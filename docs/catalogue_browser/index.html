, "basis": "EU 852/2004 Annex II ch. VI p. 1–4 (food waste removed from food rooms, closable containers, adequate storage and disposal provision, pest-free); BFS 2024:8 11 kap. 1–3 §§ (waste rooms located/dimensioned for hygiene and collection).", "url": "https://rinfo.boverket.se/BFS2024-8/pdf/BFS2024-8.pdf"}, "size": {"rule": "per_building", "value_m2": null, "range_m2": null, "count": "", "strength": "none", "source": "No size; Livsmedelsverket kontrollwiki (art. 343): food law cannot be used to demand a cooled waste room only because of odour.", "url": "https://kontrollwiki.livsmedelsverket.se/artikel/343", "confidence": "verified"}, "constraints": {"min_ceiling_height_mm": null, "daylight_required": false, "facade_required": false}, "depends_on": ["grocery_goods_in"], "shareable_with": ["restaurant_cafe", "food_hall", "retail_shop"], "shareable_note": "Shared waste room at building level.", "binding_constraint": "site_access", "layer": "site", "notes": "Bottle/can returns (pant) and cardboard baler are practice; space-demanding."}, {"id": "grocery_grease_separator", "label_en": "Grease separator (if fatty wastewater)", "label_sv": "Fettavskiljare", "required": {"strength": "programme", "basis": "Municipal VA rules (ABVA/riktlinjer). Example: MittSverige Vatten & Avfall (Sundsvall) lists grocery stores among businesses required to have a grease separator per SS-EN 1825-1/-2; small or packaged-only businesses can apply for exemption. BFS 2024:8 8 kap. 15 §: WC wastewater may not be connected to grease separators.", "url": "https://msva.se/vatten-och-avlopp/verksamheter/riktlinjer-for-verksamheter/riktlinjer-for-verksamheter-i-sundsvall/restaurang-och-storkok"}, "size": {"rule": "derived", "value_m2": null, "range_m2": null, "count": "sized per SS-EN 1825-2 from fat-laden flow", "strength": "none", "source": "", "url": "", "confidence": "sourced"}, "constraints": {"min_ceiling_height_mm": null, "daylight_required": false, "facade_required": false}, "depends_on": [], "shareable_with": ["restaurant_cafe", "food_hall"], "shareable_note": "One separator can serve several food tenants if drainage allows.", "binding_constraint": "drainage_and_emptying_access", "layer": "services", "notes": "Relevant mainly with deli/bake-off/fish counters. Municipal guides commonly say it may not be placed in a room where food is handled and needs emptying access for a suction truck."}], "variants": [{"id": "grocery_convenience", "label": "Convenience store (≤150 persons, 2A)", "changes": "Mostly packaged goods; minimal food handling; possibly exempt from grease separator; goods delivered through front or small rear door."}, {"id": "grocery_supermarket", "label": "Supermarket (>150 persons, 2B)", "changes": "Loading dock normally required for large goods volumes (AFS 2023:12 3 kap. 32 §); manual counters; fire alarm and evacuation alarm (2B)."}], "conversion_from_office": {"typical_blockers": ["Detaljplan K does not cover retail; needs H or C.", "Goods reception with dock and truck access in an office street.", "Floor load D1 4.0 kN/m2 (+ cold-room and storage loads) vs office B 2.5 kN/m2.", "Change to vk 2A/2B: 30 m travel distance, exits, alarms (cross_cutting.json fire_vk_2abc).", "Space for refrigeration condensers and their noise."], "typical_enablers": ["Large, column-free ground floors with street frontage.", "Existing goods lift and basement storage."]}, "sources": [{"ref": "EU 852/2004 bilaga II kap. I p. 3, 4, 5, 8, 9; kap. II; kap. VI (text read from legislation.gov.uk copy of the original regulation)", "url": "https://www.legislation.gov.uk/eur/2004/852/annex/II", "accessed": "2026-10-19"}, {"ref": "LIVSFS 2022:8 — 2, 6, 9 §§", "url": "https://www.livsmedelsverket.se/globalassets/om-oss/lagstiftning/offentlig-kontroll/livsfs-2022-8_web_t.pdf", "accessed": "2026-10-19"}, {"ref": "Livsmedelsverket kontrollwiki — Toaletter och handfat (art. 1045); Lokaler och utrustning (art. 343)", "url": "https://kontrollwiki.livsmedelsverket.se/artikel/1045", "accessed": "2026-10-19"}, {"ref": "AFS 2023:12 — 3 kap. 15, 32–35, 56–63 §§; 5 kap. 25 §", "url": "https://www.av.se/globalassets/filer/publikationer/foreskrifter/utformning-av-arbetsplatser-afs2023-12.pdf", "accessed": "2026-10-19"}, {"ref": "BFS 2024:7 — 2 kap. 4, 11–12 §§", "url": "https://rinfo.boverket.se/BFS2024-7/pdf/BFS2024-7.pdf", "accessed": "2026-10-19"}, {"ref": "BFS 2024:8 — 8 kap. 15 §, 11 kap. 1–3 §§", "url": "https://rinfo.boverket.se/BFS2024-8/pdf/BFS2024-8.pdf", "accessed": "2026-10-19"}, {"ref": "MittSverige Vatten & Avfall — Restaurang och storkök (fettavskiljare)", "url": "https://msva.se/vatten-och-avlopp/verksamheter/riktlinjer-for-verksamheter/riktlinjer-for-verksamheter-i-sundsvall/restaurang-och-storkok", "accessed": "2026-10-19"}], "open_questions": ["EU 852/2004 Annex II ch. IX (temperature control) was not re-read in this session — verify wording before citing.", "Grease-separator requirement for grocery stores varies by municipality; MSVA (Sundsvall) is one example. Stockholm Vatten och Avfall's page could not be retrieved.", "Separate collection of food waste/bioavfall from businesses (avfallsförordningen 2020:614) likely drives waste-room size — paragraph not verified here.", "No public Swedish source for back-of-house share or m2 per checkout.", "BFS 2025:10 amendments to BFS 2024:7 not checked."]}, "gym_fitness": {"id": "gym_fitness", "label_en": "Gym / fitness centre", "label_sv": "Gym / träningsanläggning", "family": "commercial", "summary": "Commercial or association fitness centre: weights and cardio floor, group-exercise studios, changing rooms with showers, reception. No Swedish law is specific to gyms: they are not on the FMH 38 § notification list (pool bathing is). The binding requirements are generic but hard to meet in an office building: the floor category for physical activity (C4, 4.0 kN/m2 and dynamic effects, BFS 2024:6) against office slabs designed for 2.5; sound insulation from lokaler to dwellings (BFS 2024:10: DnT,w,50 at least 56 dB, L'nT,w,50 at most 52 dB), with dropped weights and music usually needing more than the minimum; and high outdoor-air demand at elevated activity (AFS 2023:12 5 kap. 4 § allmänna råd). No public source gives m2 per member or per piece of equipment.", "regulatory": {"bbr_verksamhetsklass": "2A (max 150 persons) / 2B (more than 150). BFS 2024:7 2 kap. 11–12 §§ list 'sporthallar och andra utrymmen där personer har liknande förutsättningar att utrymma'; a gym open to the public falls here (classification by analogy, assessment). See cross_cutting.json fire_vk_2abc.", "key_laws": [{"ref": "BFS 2024:6 4 kap. 10 § tabell 4:1 (C4 4.0 kN/m2), 13 § (dynamic forces)", "url": "https://www.boverket.se/sv/PBL-kunskapsbanken/regler-om-byggande/barformaga-stadga-bestandighet/laster/nyttiga-laster/"}, {"ref": "BFS 2024:10 skydd mot buller: 2 kap. 2 § tabell 2:1, 5 § tabell 2:4, 9 §", "url": "https://rinfo.boverket.se/BFS2024-10/pdf/BFS2024-10.pdf"}, {"ref": "BFS 2024:7 brandskydd: 2 kap. 4, 11–12 §§", "url": "https://rinfo.boverket.se/BFS2024-7/pdf/BFS2024-7.pdf"}, {"ref": "AFS 2023:12 Utformning av arbetsplatser: 5 kap. 4 § (outdoor air) for staff and instructors", "url": "https://www.av.se/globalassets/filer/publikationer/foreskrifter/utformning-av-arbetsplatser-afs2023-12.pdf"}, {"ref": "FMH (1998:899) 38 § (notification only for e.g. bassängbad and hygienic treatments; gyms not listed)", "url": "https://www.riksdagen.se/sv/dokument-och-lagar/dokument/svensk-forfattningssamling/forordning-1998899-om-miljofarlig-verksamhet-och_sfs-1998-899/"}], "permits": ["Bygglov for change of use from office (PBL 9 kap. 15 § 1 since 2025-12-01; formerly 9 kap. 2 § första stycket 3 a; see cross_cutting.json cou_bygglov_trigger). Detaljplan: commercial or centrum use; a gym is usually accepted under C (not verified against Boverket's planbestämmelser guide).", "No gym-specific operating permit. Notification under FMH 38 § is needed only if a pool (bassängbad) or professional hygienic treatments (e.g. tattooing) are added.", "Music played in group classes: FoHMFS 2014:15 recommended sound levels apply, supervised by the municipal miljöförvaltning."], "cross_cutting_refs": ["cou_bygglov_trigger", "cou_anmalan", "cou_requirements_scope", "fire_vk_2abc", "fire_egress_dimensions", "occ_density_law_2024", "occ_density_gaps", "access_design_dimensions", "access_public_premises_wc", "access_hin", "san_public", "san_workplace", "staff_personalutrymmen_general", "staff_changing_showers_storage", "staff_eating_rest", "vent_workplace", "vent_change_of_use", "acoustics_premises", "acoustics_dwellings", "loads_imposed_table_4_1", "loads_barriers_stairs", "loads_structure_change"], "operator_oversight": "Kommunens miljö- och hälsoskyddsnämnd (noise, hygiene nuisance under Miljöbalken 9 kap.); byggnadsnämnd; räddningstjänst"}, "occupancy": {"unit": "visitor", "gross_m2_per_unit": {"value": null, "range": null, "strength": "none", "source": "No Swedish law, guidance or public programme found that gives m2 per member, per simultaneous visitor or per piece of equipment. Operator benchmarks are not public.", "confidence": "verified"}, "staff_per_unit": {"value": null, "strength": "none", "source": "No source; many gyms run staff-less hours with access control."}, "egress_design_density": {"persons_per_m2": null, "strength": "law", "source": "BFS 2024:7 2 kap. 4 §: design number = maximum expected. No gym default; the samlingslokal default (2.5 p/m2) is a conservative fallback for group-exercise studios if the operator cannot commit to a maximum. The old BBR (repealed BBR, pre-2025) tabell 5:333 had no gym row (danslokal 2.5 was the nearest).", "url": "https://rinfo.boverket.se/BFS2024-7/pdf/BFS2024-7.pdf", "confidence": "verified"}, "hours_profile": "evening_weekend", "hourly_presence": [0.02, 0.01, 0.01, 0.01, 0.02, 0.1, 0.4, 0.45, 0.3, 0.25, 0.25, 0.35, 0.45, 0.3, 0.25, 0.3, 0.6, 0.9, 1.0, 0.8, 0.5, 0.25, 0.1, 0.05], "hourly_presence_note": "Modelling assumption (indicative, not sourced). Three peaks: early morning, lunch and 17–20. 24/7 access is common in staff-less gyms, so the profile is non-zero at night. None of the README hour profiles fits exactly; 'evening_weekend' is the closest label."}, "spaces": [{"id": "gym_training_floor", "label_en": "Training floor (free weights, machines, cardio)", "label_sv": "Träningshall (fria vikter, maskiner, kondition)", "required": {"strength": "practice", "basis": "Defining space of the use; not regulated as such.", "url": ""}, "size": {"rule": "per_building", "value_m2": null, "range_m2": null, "count": "operator-specific", "strength": "none", "source": "No public source for m2 per station or per member.", "url": "", "confidence": "verified"}, "constraints": {"min_ceiling_height_mm": 2700, "daylight_required": false, "facade_required": false}, "depends_on": ["gym_changing", "gym_ventilation"], "shareable_with": [], "shareable_note": "Weights floor is rarely time-shared; equipment is fixed.", "binding_constraint": "floor_load", "layer": "structure", "notes": "Load: C4 'samlingslokaler där fysiska aktiviteter kan förekomma' 4.0 kN/m2 and 4.0 kN point load, vs office B 2.5 kN/m2 (BFS 2024:6 4 kap. 10 § tabell 4:1). 4 kap. 13 §: members shall be designed for dynamic forces from persons and objects in rapid, forceful movement (jumping crowds given as an example). Heavy racks and dropped weights add local impact loads and vibration. Sound: from lokaler to dwellings, DnT,w,50 at least 56 dB (tabell 2:1) and L'nT,w,50 at most 52 dB (tabell 2:4). The tapping-machine metric does not represent dropped weights, so isolated floating floors are standard practice (engineering judgement, indicative). The old BBR (repealed BBR, pre-2025) 7:21 allmänt råd named 'träningslokal' as noisy activity needing special insulation measures and advised LpAeq,nT 25 dB in dwellings from impulse or low-frequency noise from adjacent gyms (consolidated BBR p. 117–118). Ceiling height: 2,700 mm is guidance only (AFS 2023:12 3 kap. 5 § allmänna råd); overhead lifts and racks need more locally."}, {"id": "gym_group_studio", "label_en": "Group-exercise studio (aerobics, spinning, yoga)", "label_sv": "Gruppträningssal", "required": {"strength": "practice", "basis": "Typical; not regulated.", "url": ""}, "size": {"rule": "per_unit", "value_m2": null, "range_m2": null, "count": "class size", "strength": "none", "source": "No public source.", "url": "", "confidence": "verified"}, "constraints": {"min_ceiling_height_mm": 2700, "daylight_required": false, "facade_required": false}, "depends_on": ["gym_ventilation"], "shareable_with": ["community_hybrid", "culture_makerspace", "assembly_event"], "shareable_note": "Dance, yoga, rehearsal and community classes can time-share an open studio with a sprung floor. Needs the C4 floor and the noise separation anyway.", "binding_constraint": "noise_to_neighbours", "layer": "space_plan", "notes": "Rhythmic jumping (aerobics, spinning) is the critical dynamic load case (BFS 2024:6 4 kap. 13 §). Amplified music: FoHMFS 2014:15 recommends at most LAeq 100 dB / LAFmax 115 dB, and 97/110 dB if children are admitted (sourced from municipal summaries)."}, {"id": "gym_changing", "label_en": "Changing rooms with showers and WCs (visitors)", "label_sv": "Omklädningsrum med duschar och toaletter", "required": {"strength": "practice", "basis": "For visitors there is no legal requirement (AFS 2023:12 3 kap. 46–54 §§ apply to employees). FMH 35 § requires sufficient toilets. Showers and changing are a market necessity.", "url": "https://www.riksdagen.se/sv/dokument-och-lagar/dokument/svensk-forfattningssamling/forordning-1998899-om-miljofarlig-verksamhet-och_sfs-1998-899/"}, "size": {"rule": "per_unit", "value_m2": null, "range_m2": null, "count": "per peak simultaneous visitors; no source", "strength": "none", "source": "No public gym programme found. For comparison, the Uppsala sports hall programme (2023) uses 20 persons per changing room with at least 4 showers (see sports_hall).", "url": "", "confidence": "verified"}, "constraints": {"min_ceiling_height_mm": null, "daylight_required": false, "facade_required": false}, "depends_on": [], "shareable_with": ["sports_hall", "shared_amenities", "office"], "shareable_note": "Could double as end-of-trip facilities (showers, lockers) for cycling office workers in the building.", "binding_constraint": "plumbing_shafts", "layer": "services", "notes": "Wet rooms need waterproofing (BFS 2024:8 7 kap. 7–8, 11 §§) and floor drains with falls, which are hard on office slabs without raised floors. Legionella-safe hot water applies to shower installations (BFS 2024:8 8 kap. 6 §; AFS 2023:12 also has rules for showers and aerosol-producing installations). Accessible changing and shower: repealed guidance and the Uppsala practice put an accessible WC with shower in changing areas (indicative)."}, {"id": "gym_ventilation", "label_en": "Ventilation capacity for high activity", "label_sv": "Ventilation för hög aktivitetsnivå", "required": {"strength": "law", "basis": "BFS 2024:8 3 kap. 4 § (functional: continuous air change, removal of pollutants from the intended use). AFS 2023:12 5 kap. 4 §: at least 7 l/s per person plus 0.35 l/s per m2 for workplaces; allmänna råd: 7 l/s is for sedentary work and higher activity may need more.", "url": "https://rinfo.boverket.se/BFS2024-8/pdf/BFS2024-8.pdf"}, "size": {"rule": "derived", "value_m2": null, "range_m2": null, "count": "airflow > 7 l/s per person + 0.35 l/s per m2; multiplier for exercise not sourced", "strength": "law", "source": "AFS 2023:12 5 kap. 4 § (verified, p. 39). No Swedish source gives an exercise multiplier.", "url": "https://www.av.se/globalassets/filer/publikationer/foreskrifter/utformning-av-arbetsplatser-afs2023-12.pdf", "confidence": "verified"}, "constraints": {"min_ceiling_height_mm": null, "daylight_required": false, "facade_required": false}, "depends_on": [], "shareable_with": [], "shareable_note": "", "binding_constraint": "ventilation", "layer": "services", "notes": "Cooling load from people and cardio equipment is high; office AHUs sized for about 0.1 persons/m2 typically fail."}, {"id": "gym_reception", "label_en": "Reception / access control", "label_sv": "Reception / entré med passersystem", "required": {"strength": "law", "basis": "If staffed, a reception in a publik lokal needs a hearing-aid sound transfer system (BFS 2024:12 3 kap. 6 §). Accessible main entrance (2 kap. 1 §).", "url": "https://rinfo.boverket.se/BFS2024-12/pdf/BFS2024-12.pdf"}, "size": {"rule": "per_building", "value_m2": null, "range_m2": null, "count": "", "strength": "none", "source": "", "url": "", "confidence": "verified"}, "constraints": {"min_ceiling_height_mm": null, "daylight_required": false, "facade_required": true}, "depends_on": [], "shareable_with": ["shared_amenities"], "shareable_note": "Staff-less gyms can use the shared lobby with gate access.", "binding_constraint": "accessibility", "layer": "space_plan", "notes": ""}, {"id": "gym_storage_cleaning", "label_en": "Equipment store and cleaning room", "label_sv": "Förråd och städ", "required": {"strength": "practice", "basis": "Not regulated; cleaning room needs per BFS 2024:8 hygiene in general terms.", "url": ""}, "size": {"rule": "per_building", "value_m2": null, "range_m2": null, "count": "", "strength": "none", "source": "", "url": "", "confidence": "indicative"}, "constraints": {"min_ceiling_height_mm": null, "daylight_required": false, "facade_required": false}, "depends_on": [], "shareable_with": ["shared_amenities"], "shareable_note": "", "binding_constraint": "none", "layer": "stuff", "notes": ""}, {"id": "gym_staff", "label_en": "Staff facilities", "label_sv": "Personalutrymmen", "required": {"strength": "law", "basis": "AFS 2023:12. Instructors do sweaty work, so changing rooms and showers apply (3 kap. 46, 52 §§). See cross_cutting.json staff_changing_showers_storage.", "url": "https://www.av.se/globalassets/filer/publikationer/foreskrifter/utformning-av-arbetsplatser-afs2023-12.pdf"}, "size": {"rule": "per_building", "value_m2": null, "range_m2": null, "count": "", "strength": "none", "source": "See cross_cutting.json.", "url": "", "confidence": "verified"}, "constraints": {"min_ceiling_height_mm": 2400, "daylight_required": false, "facade_required": false}, "depends_on": [], "shareable_with": ["shared_amenities"], "shareable_note": "", "binding_constraint": "none", "layer": "space_plan", "notes": ""}], "variants": [{"id": "gym_full_service", "label": "Full-service gym with group studios and sauna", "changes": "Adds sauna and spa wet areas (more drainage, moisture and vapour control). A pool would trigger FMH 38 § notification (bassängbad)."}, {"id": "gym_24_7_compact", "label": "Compact 24/7 staff-less gym", "changes": "Mainly machines and cardio, few or no group studios, small changing rooms. Access control replaces the reception. Night use raises noise concerns next to dwellings."}, {"id": "gym_boutique_studio", "label": "Boutique studio (yoga, pilates, cycling)", "changes": "One or two studios only; can fit 200–400 m2 office units (indicative). Yoga and pilates are low-impact, while cycling and HIIT carry dynamic loads and music noise."}, {"id": "gym_crossfit_lifting", "label": "Strength / CrossFit box", "changes": "Dropped weights; essentially a ground-floor or slab-on-grade use. Upper office floors are unsuitable without heavy isolation."}], "conversion_from_office": {"typical_blockers": ["Floor load and dynamics: C4 4.0 kN/m2 plus dynamic effects (BFS 2024:6 4 kap. 10, 13 §§) vs office B 2.5 kN/m2.", "Impact noise and vibration to other tenants, especially dwellings: BFS 2024:10 tabell 2:1 / 2:4 minima, plus dropped weights and music bass.", "Wet rooms (showers) on office slabs: floor drains, falls, waterproofing and drainage stack capacity.", "Ventilation and cooling capacity for exercising occupants.", "Fire class change Vk 1 to 2A/2B (30 m travel)."], "typical_enablers": ["Ground floor or basement on slab-on-grade (no impact path to neighbours below; loads go to ground).", "Large open floor plates and existing showers or bike rooms.", "Time profile complementary to offices (morning and evening peaks), so shared showers and lockers can serve both."]}, "sources": [{"ref": "BFS 2024:6 4 kap. 10 § tabell 4:1, 13 § (via Boverket 'Nyttiga laster')", "url": "https://www.boverket.se/sv/PBL-kunskapsbanken/regler-om-byggande/barformaga-stadga-bestandighet/laster/nyttiga-laster/", "accessed": "2026-10-19"}, {"ref": "BFS 2024:10 buller: 2 kap. 2, 5, 9 §§ (text extracted from PDF)", "url": "https://rinfo.boverket.se/BFS2024-10/pdf/BFS2024-10.pdf", "accessed": "2026-10-19"}, {"ref": "BFS 2024:7: 2 kap. 4, 11–12 §§", "url": "https://lagen.nu/bfs/2024:7", "accessed": "2026-10-19"}, {"ref": "BFS 2024:8: 3 kap. 4 §, 7 kap., 8 kap. 6 §", "url": "https://rinfo.boverket.se/BFS2024-8/pdf/BFS2024-8.pdf", "accessed": "2026-10-19"}, {"ref": "AFS 2023:12: 3 kap. 5, 46–54 §§; 5 kap. 4 §", "url": "https://www.av.se/globalassets/filer/publikationer/foreskrifter/utformning-av-arbetsplatser-afs2023-12.pdf", "accessed": "2026-10-19"}, {"ref": "FMH (1998:899) 35, 38 §§", "url": "https://www.riksdagen.se/sv/dokument-och-lagar/dokument/svensk-forfattningssamling/forordning-1998899-om-miljofarlig-verksamhet-och_sfs-1998-899/", "accessed": "2026-10-19"}, {"ref": "Old BBR (repealed BBR, pre-2025) 7:21 allmänt råd (consolidated BBR pp. 117–118)", "url": "https://rinfo.boverket.se/BFS2011-6/dok/BFS2024-5_konsolidering.pdf", "accessed": "2026-10-19"}, {"ref": "FoHMFS 2014:15 Höga ljudnivåer", "url": "https://www.fohm.se/contentassets/af078ffb8b8c41e5ad7c35de0e20420d/fohmfs-2014-15.pdf", "accessed": "2026-10-19"}], "open_questions": ["No public Swedish source for gym sizing (m2 per member or simultaneous user, changing-room capacity). Consider operator interviews or an industry body (e.g. Friskvårdsföretagen); not searched in depth.", "Is a gym formally a 'sporthall or similar' (Vk 2) or could a members-only gym be argued as Vk 1? Classification here is an analogy; confirm with Boverket guidance or a fire consultant.", "Folkhälsomyndigheten's allmänna råd om buller inomhus (FoHMFS 2014:13) values for dwellings next to gyms were not verified; add them if the fit test needs neighbour-noise limits.", "Exercise-specific ventilation rates (l/s per exercising person) have no Swedish source found."]}, "hotel": {"id": "hotel", "label_en": "Hotel / short-stay accommodation (incl. aparthotel)", "label_sv": "Hotell / tillfälligt boende (inkl. apartmenthotell)", "family": "hospitality", "summary": "Temporary accommodation is not a 'bostad'. The dwelling-design rules (BFS 2024:11) and the dwelling-specific accessibility, daylight and sound rules therefore do not apply; Boverket states this explicitly for hotels and temporary accommodation, even when rooms have full home facilities. A hotel is a 'lokal' (and, where the public enters, a 'publik lokal'). It gets functional requirements: daylight and outlook in rooms used more than temporarily 'unless unreasonable' (BFS 2024:8 4 kap. 3 §), noise control as the use requires (BFS 2024:10 2 kap. 9 §), and general accessibility (PBL 8 kap. 1 § 3; BFS 2024:12), with a hearing loop in receptions. Guest rooms are fire class Vk 4 and each is its own fire compartment (BFS 2024:7). No law sets room size or the number of accessible rooms; practice cited in a 2023 municipal permit file is at least 1 accessible room per 10. The police permit for hotel and boarding-house businesses (Lag 1966:742, >= 9 guests or >= 5 rooms) was repealed on 1 January 2025. Staff areas follow AFS 2023:12. Planning use is 'Tillfällig vistelse', not 'Bostäder'.", "regulatory": {"bbr_verksamhetsklass": "4 — guest rooms, dormitories and similar in hotels, hostels, B&B and other temporary accommodation (BFS 2024:7 2 kap. 17 §); each guest room / dormitory its own fire compartment (5 kap. 25 § p. 7). Restaurant/breakfast room: Vk 2A (<= 150 persons) or 2B (> 150) (2 kap. 11-12 §§); 2C if > 150 persons and alcohol served more than to a limited extent (2 kap. 13 §). Back-of-house offices: Vk 1. A commercial kitchen with special fire risk must be its own compartment (5 kap. 26 §).", "key_laws": [{"ref": "Plan- och bygglag (2010:900) 8 kap. 1 § p. 3, 9 §; 9 kap. 15 § p. 1", "url": "https://www.riksdagen.se/sv/dokument-och-lagar/dokument/svensk-forfattningssamling/plan-och-bygglag-2010900_sfs-2010-900/"}, {"ref": "BFS 2024:7 brand, 2 kap. 11-13 §§, 17 §; 5 kap. 25-26 §§", "url": "https://forfattningssamling.boverket.se/detaljer/BFS2024-7"}, {"ref": "BFS 2024:12 tillgänglighet, 2 kap. 1-2, 5, 7 §§; 3 kap. 6-7 §§ (publik lokal, hearing loop in receptions)", "url": "https://forfattningssamling.boverket.se/detaljer/BFS2024-12"}, {"ref": "BFS 2024:8 4 kap. 3 § (daylight/outlook in lokaler), 11 kap. (waste)", "url": "https://forfattningssamling.boverket.se/detaljer/BFS2024-8"}, {"ref": "BFS 2024:10 2 kap. 9 § (lokaler: functional noise requirement)", "url": "https://forfattningssamling.boverket.se/detaljer/BFS2024-10"}, {"ref": "BFS 2026:4 hållbar mobilitet, 2 kap. 3-4 §§ (lokalbyggnad)", "url": "https://forfattningssamling.boverket.se/detaljer/BFS2026-4"}, {"ref": "AFS 2023:12 Utformning av arbetsplatser, 3 kap. 37-65 §§ personalutrymmen (in force 1 Jan 2025)", "url": "https://www.av.se/globalassets/filer/publikationer/foreskrifter/utformning-av-arbetsplatser-afs2023-12.pdf"}, {"ref": "Lag (1966:742) om hotell- och pensionatrörelse — REPEALED 1 Jan 2025 by SFS 2024:1082", "url": "https://www.riksdagen.se/sv/dokument-och-lagar/dokument/svensk-forfattningssamling/lag-1966742-om-hotell-och-pensionatrorelse_sfs-1966-742/"}], "permits": ["Bygglov for change of use from office: PBL 9 kap. 15 § p. 1.", "Detaljplan must allow 'Tillfällig vistelse' (Boverket planbestämmelse; includes staff areas and complementary restaurant, conference, spa, gym).", "Food: a food business must be registered with the municipal food control authority before start (EU Regulation 852/2004 art. 6; Livsmedelsverket guidance). Not verified in this pass.", "Alcohol serving licence (serveringstillstånd, alkohollagen 2010:1622) from the municipality, if alcohol is served. Not verified in this pass.", "No police permit since 1 Jan 2025 (Lag 1966:742 repealed)."], "operator_oversight": "Municipality (byggnadsnämnd; miljö-/livsmedelskontroll for food; räddningstjänst for fire safety under LSO). Arbetsmiljöverket for staff areas."}, "occupancy": {"unit": "guest_room", "gross_m2_per_unit": {"value": 38, "range": [28, 55], "strength": "practice", "source": "Working value: gross floor area per key incl. lobby, breakfast and back-of-house. Lower end for economy/limited service, upper for full service. No Swedish source found; MUST be verified against operator briefs.", "url": "", "confidence": "indicative"}, "staff_per_unit": {"value": 0.15, "strength": "practice", "source": "Working value for limited-service hotels (staff present per room at peak); full service much higher. Unsourced."}, "hours_profile": "24_7", "hourly_presence": [0.65, 0.65, 0.65, 0.65, 0.65, 0.62, 0.55, 0.45, 0.3, 0.2, 0.15, 0.12, 0.12, 0.12, 0.15, 0.2, 0.3, 0.4, 0.45, 0.5, 0.55, 0.6, 0.65, 0.65], "hourly_presence_note": "Share of room capacity with guests present, assuming about 65-70 % average room occupancy and an average 1.3-1.5 guests per occupied room. Indicative, unsourced. Breakfast peak 06:30-09:30, check-in peak 15:00-19:00.", "persons_per_dwelling_note": "Beds per room: standard double 2, single 1; family rooms 3-4. Design guests per room about 1.5 (indicative)."}, "spaces": [{"id": "hotel_guest_room", "label_en": "Guest room", "label_sv": "Hotellrum / gästrum", "required": {"strength": "law", "basis": "Core function. Fire: Vk 4, own fire compartment (BFS 2024:7 2 kap. 17 §, 5 kap. 25 § p. 7). Daylight and outlook: BFS 2024:8 4 kap. 3 § (rooms in lokaler where people stay more than temporarily must have enough daylight and outlook, unless unreasonable). Noise: BFS 2024:10 2 kap. 9 § (sound insulation, impact sound, installation and traffic noise, reverberation as the use requires).", "url": "https://forfattningssamling.boverket.se/detaljer/BFS2024-7"}, "size": {"rule": "per_unit", "value_m2": 20, "range_m2": [14, 30], "count": "one per key", "strength": "practice", "source": "No law sets room size. Working value (net incl. bathroom); budget/micro hotels go below 14 m². Unsourced.", "url": "", "confidence": "indicative"}, "constraints": {"min_ceiling_height_mm": null, "daylight_required": true, "facade_required": true}, "depends_on": ["hotel_guest_bathroom"], "shareable_with": [], "shareable_note": "", "binding_constraint": "facade_length_and_room_width", "layer": "space_plan", "notes": "No numeric DF for lokaler (the 1.0 % rule is dwelling-only), which gives hotels more freedom than housing in deep office plans. Whether a hotel guest room counts as 'vistas mer än tillfälligt' was not tested. Acoustic design is typically done to SS 25268 (sound classes for lokaler); edition not checked."}, {"id": "hotel_guest_bathroom", "label_en": "En-suite bathroom", "label_sv": "Badrum till hotellrum", "required": {"strength": "practice", "basis": "Not required by building law for temporary accommodation (BFS 2024:11 does not apply); market standard for hotels. Hostels may use shared bathrooms.", "url": "https://www.boverket.se/sv/PBL-kunskapsbanken/regler-om-byggande/bostaders-lamplighet/utformning/"}, "size": {"rule": "per_unit", "value_m2": 4, "range_m2": [3, 6], "count": "one per room", "strength": "practice", "source": "Working value; unsourced.", "url": "", "confidence": "indicative"}, "constraints": {"min_ceiling_height_mm": null, "daylight_required": false, "facade_required": false}, "depends_on": [], "shareable_with": [], "shareable_note": "", "binding_constraint": "wet_room_drainage", "layer": "services", "notes": "In office conversions, a wet room per key is the main services cost, as for studios."}, {"id": "hotel_accessible_room", "label_en": "Accessible guest room", "label_sv": "Tillgängligt hotellrum", "required": {"strength": "law", "basis": "PBL 8 kap. 1 § p. 3 and BFS 2024:12 (buildings must be accessible and usable; publik lokal dimensions: wheelchair 0.70 x 1.30 m, turning circle 1.50 m, door >= 0.80 m, 1 kap. 6 §). The law sets no share of accessible rooms.", "url": "https://forfattningssamling.boverket.se/detaljer/BFS2024-12"}, "size": {"rule": "per_unit", "value_m2": null, "count": ">= 1 per 10 guest rooms (practice)", "strength": "practice", "source": "Accessibility statement in Nacka bygglov file (hotel Rösunda 27:2, 2023): 'Tidigare byggregler rekommenderade minst ett tillgängligt rum per 10 gästrum'. The original rule it refers to was not identified.", "url": "https://handlingar.nacka.se/Handlingar/Miljo_och_stadsbyggnadsnamnden/2023/20230621/24_bygglov_R%C3%B6sunda_27_2_Hotellv%C3%A4gen_2_tillbyggnad/24_h_bygglov_R%C3%B6sunda_27_2_Hotellv%C3%A4gen_2_tillg%C3%A4nglighetsutl%C3%A5tande.pdf", "confidence": "sourced"}, "constraints": {"min_ceiling_height_mm": null, "daylight_required": true, "facade_required": true}, "depends_on": ["entrance_lift_lobby"], "shareable_with": [], "shareable_note": "", "binding_constraint": "bathroom_turning_circle_1500", "layer": "space_plan", "notes": "Use the publik lokal turning circle of 1.50 m (not the 1.30 m dwelling value), since the hotel is not a dwelling."}, {"id": "hotel_reception_lobby", "label_en": "Reception and lobby", "label_sv": "Reception och lobby", "required": {"strength": "practice", "basis": "Operational need (self-check-in concepts can minimise it). If a reception exists, a hearing loop is law: BFS 2024:12 3 kap. 6 § ('I samlingssalar och receptioner ska system för ljudöverföring till hörhjälpmedel finnas').", "url": "https://forfattningssamling.boverket.se/detaljer/BFS2024-12"}, "size": {"rule": "per_building", "value_m2": null, "count": "one", "strength": "none", "source": "No general advice to 3 kap. 56 §); separate rest room typically when > 50 persons are employed at the same time (advice to 63 §)", "strength": "guidance", "source": "AFS 2023:12 allmänna råd. An accessible toilet should be at least 2.2 x 2.2 m (advice to 58 §). No m² for changing or eating rooms.", "url": "https://www.av.se/globalassets/filer/publikationer/foreskrifter/utformning-av-arbetsplatser-afs2023-12.pdf", "confidence": "verified"}, "constraints": {"min_ceiling_height_mm": null, "daylight_required": false, "facade_required": false}, "depends_on": [], "shareable_with": [], "shareable_note": "", "binding_constraint": "none", "layer": "space_plan", "notes": "Detailed general workplace rules are in data/catalogue/cross_cutting.json; only hotel-specific counts are noted here. Housekeeping staff do soiling work, so changing rooms with showers are effectively needed."}, {"id": "hotel_housekeeping_linen", "label_en": "Housekeeping stores, linen room, laundry (or outsourced linen)", "label_sv": "Städcentral, linneförråd, tvätt", "required": {"strength": "practice", "basis": "Operational; floor pantries on each floor are usual. Not law.", "url": ""}, "size": {"rule": "per_building", "value_m2": null, "count": "one floor pantry per guest floor plus central store", "strength": "none", "source": "No source.", "url": "", "confidence": "indicative"}, "constraints": {"min_ceiling_height_mm": null, "daylight_required": false, "facade_required": false}, "depends_on": ["service_lift"], "shareable_with": [], "shareable_note": "", "binding_constraint": "none", "layer": "space_plan", "notes": "Fits deep-plan core zones."}, {"id": "service_lift", "label_en": "Service / goods lift", "label_sv": "Servicehiss", "required": {"strength": "practice", "basis": "Operational for housekeeping and luggage; not law. Accessible lift requirements (BFS 2024:12 2 kap. 5 §) apply to the guest lift.", "url": "https://forfattningssamling.boverket.se/detaljer/BFS2024-12"}, "size": {"rule": "per_building" ce", "label_en": "Meeting / conference rooms (optional)", "label_sv": "Konferenslokaler", "required": {"strength": "practice", "basis": "Optional; if used as samlingslokal, BFS 2024:12 3 kap. 6 § (hearing loop in samlingssalar) and Vk 2A/2B apply.", "url": "https://forfattningssamling.boverket.se/detaljer/BFS2024-12"}, "size": {"rule": "per_seat", "value_m2": null, "count": "operator choice", "strength": "none", "source": "No source.", "url": "", "confidence": "indicative"}, "constraints": {"min_ceiling_height_mm": null, "daylight_required": false, "facade_required": false}, "depends_on": [], "shareable_with": ["co_living"], "shareable_note": "Existing office meeting rooms can be kept.", "binding_constraint": "ventilation_per_person", "layer": "space_plan", "notes": ""}, {"id": "waste_room", "label_en": "Waste room", "label_sv": "Avfallsutrymme", "required": {"strength": "law", "basis": "BFS 2024:8 11 kap. 1-3 §§", "url": "https://forfattningssamling.boverket.se/detaljer/BFS2024-8"}, "size": {"rule": "per_building", "value_m2": null, "count": "per municipal waste rules; food waste from kitchen may need a cooled room", "strength": "programme", "source": "Municipal renhållningsföreskrifter.", "url": "", "confidence": "indicative"}, "constraints": {"min_ceiling_height_mm": null, "daylight_required": false, "facade_required": false}, "depends_on": [], "shareable_with": ["housing_apartment", "student_housing", "co_living"], "shareable_note": "", "binding_constraint": "collection_vehicle_access", "layer": "site", "notes": ""}, {"id": "bicycle_parking", "label_en": "Bicycle parking", "label_sv": "Cykelparkering", "required": {"strength": "law", "basis": "BFS 2026:4 2 kap. 4 §: a new lokalbyggnad must have bicycle parking for at least 15 % of average or 10 % of total user capacity; may be adapted where people normally do not arrive by bike. On alteration only for ombyggnad involving car parking (1 kap. 4 §).", "url": "https://www.boverket.se/sv/PBL-kunskapsbanken/regler-om- llig vistelse'."], "typical_enablers": ["No dwelling DF 1.0 % rule and no dwelling sound tables, so deeper rooms are possible than for housing (functional requirements still apply).", "No friyta requirement (PBL 8 kap. 9 § second paragraph covers dwellings and schools, not hotels).", "Office lobbies, lifts, meeting rooms and parking map well to hotel needs.", "Fast route: no police permit since 2025."]}, "sources": [{"ref": "BFS 2024:7 brand (full text), 2 kap. 9-20 §§ verksamhetsklasser; 4 kap. 24 §; 5 kap. 25-26 §§", "url": "https://forfattningssamling.boverket.se/detaljer/BFS2024-7", "accessed": "2026-10-19"}, {"ref": "BFS 2024:12 tillgänglighet (full text)", "url": "https://forfattningssamling.boverket.se/detaljer/BFS2024-12", "accessed": "2026-10-19"}, {"ref": "BFS 2024:8 4 kap. 3 §, 11 kap.", "url": "https://forfattningssamling.boverket.se/detaljer/BFS2024-8", "accessed": "2026-10-19"}, {"ref": "BFS 2024:10 2 kap. 9 §", "url": "https://forfattningssamling.boverket.se/detaljer/BFS2024-10", "accessed": "2026-10-19"}, {"ref": "Boverket PBL kunskapsbanken: Bostäders utformning (hotels and temporary accommodation not covered)", "url": "https://www.boverket.se/sv/PBL-kunskapsbanken/regler-om-byggande/bostaders-lamplighet/utformning/", "accessed": "2026-10-19"}, {"ref": "Boverket PBL kunskapsbanken: Tillfällig vistelse (planbestämmelse)", "url": "https://www.boverket.se/sv/PBL-kunskapsbanken/detaljplan/planbestammelser/anvandning-av-kvartersmark/tillf-vistelse/", "accessed": "2026-10-19"}, {"ref": "Boverket PBL kunskapsbanken: Hållbar mobilitet (BFS 2026:4)", "url": "https://www.boverket.se/sv/PBL-kunskapsbanken/regler-om-byggande/hallbar-mobilitet/", "accessed": "2026-10-19"}, {"ref": "AFS 2023:12 Utformning av arbetsplatser, 3 kap. 37-65 §§", "url": "https://www.av.se/globalassets/filer/publikationer/foreskrifter/utformning-av-arbetsplatser-afs2023-12.pdf", "accessed": "2026-10-19"}, {"ref": "Lag (1966:742) om hotell- och pensionatrörelse, riksdagen.se (status: repealed 2025-01-01 by SFS 2024:1082)", "url": "https://www.riksdagen.se/sv/dokument-och-lagar/dokument/svensk-forfattningssamling/lag-1966742-om-hotell-och-pensionatrorelse_sfs-1966-742/", "accessed": "2026-10-19"}, {"ref": "Nacka kommun, bygglov Rösunda 27:2 Hotellvägen 2, tillgänglighetsutlåtande (2023), section 7.2", "url": "https://handlingar.nacka.se/Handlingar/Miljo_och_stadsbyggnadsnamnden/2023/20230621/24_bygglov_R%C3%B6sunda_27_2_Hotellv%C3%A4gen_2_tillbyggnad/24_h_bygglov_R%C3%B6sunda_27_2_Hotellv%C3%A4gen_2_tillg%C3%A4nglighetsutl%C3%A5tande.pdf", "accessed": "2026-10-19"}, {"ref": "Plan- och bygglag (2010:900) 8 kap. 9 §; 9 kap. 15 §", "url": "https://www.riksdagen.se/sv/dokument-och-lagar/dokument/svensk-forfattningssamling/plan-och-bygglag-2010900_sfs-2010-900/", "accessed": "2026-10-19"}], "open_questions": ["Accessible room share: the '1 per 10 rooms' figure comes from a consultant statement citing 'earlier building rules'. Identify the original (likely pre-2008 BBR or ALM general advice) or a current operator/industry standard (e.g. Visita).", "Does BFS 2024:8 4 kap. 3 § (daylight/outlook in lokaler where people stay more than temporarily) cover hotel guest rooms? Boverket guidance on this paragraph was not read.", "Room size, gross m² per key, breakfast seats per bed and staff ratios are unsourced working values. Need operator briefs (e.g. Scandic, Nordic Choice brand standards) or Visita data.", "Food registration and serveringstillstånd were stated from general knowledge, not fetched. Verify with Livsmedelsverket and the alkohollag before relying on them.", "LSO: does a hotel need a written fire-safety statement (skriftlig redogörelse) under MSB rules? Not checked.", "Is guest registration still required after Lag 1966:742 was repealed? Not checked.", "Aparthotel to housing boundary: no case law or Boverket guidance checked beyond the 'Tillfällig vistelse' page."]}, "housing_apartment": {"id": "housing_apartment", "label_en": "Ordinary dwelling in a multi-dwelling building (flerbostadshus)", "label_sv": "Bostadslägenhet i flerbostadshus", "family": "housing", "summary": "Permanent, self-contained dwellings (1 rok to 4 rok). Since 1 July 2025 the dwelling-design rules are in BFS 2024:11 (bostäders lämplighet för sitt ändamål), which replaced BBR section 3:2; the BBR transition period ended 30 June 2026. The new rules are purely functional: every dwelling must provide, in reasonable measure, separable spaces for the six 'bostadsfunktioner' (sleep/rest, socialising, cooking, meals, hygiene, storage), and personal hygiene must be a room of its own. The old BBR size bands (>55 m², 35-55 m², <=35 m²) and the general-advice references to SS 91 42 21 no longer exist in the regulation; sizing is a judgement on four factors (dwelling size, number of residents, need for separable parts of rooms, fittings and equipment) supported by 'relevant and established standards'. Hard numeric law values that do exist: daylight factor >= 1.0 % over half the floor area of habitable rooms (0.8 % may be accepted on conversion from non-residential premises), outdoor-air flow 0.35 l/s per m² and 4 l/s per person, sound insulation tables in BFS 2024:10, wheelchair design dimensions 0.70 x 1.20 m / turning circle 1.30 m / door 0.76 m inside dwellings (BFS 2024:12), and >= 2 bicycle parking spaces per apartment for new multi-dwelling buildings (BFS 2026:4).", "regulatory": {"bbr_verksamhetsklass": "3A — 'bostäder i flerbostadshus' (BFS 2024:7, 2 kap. 14 §). Each dwelling is its own fire compartment (BFS 2024:7, 5 kap. 25 § p. 3). Lägenhetsförråd are Vk 1 (BFS 2024:7, 2 kap. 10 §). Note: BBR 5:2 (repealed BBR, pre-2025) numbering is superseded; the class names are unchanged.", "key_laws": [{"ref": "Plan- och bygglag (2010:900) 8 kap. 1 §, 4 §, 9-10 §§; 9 kap. 15 §", "url": "https://www.riksdagen.se/sv/dokument-och-lagar/dokument/svensk-forfattningssamling/plan-och-bygglag-2010900_sfs-2010-900/"}, {"ref": "Plan- och byggförordning (2011:338) 3 kap. 1 §, 4 §, 17 §, 18 §", "url": "https://www.riksdagen.se/sv/dokument-och-lagar/dokument/svensk-forfattningssamling/plan-och-byggforordning-2011338_sfs-2011-338/"}, {"ref": "BFS 2024:11 Boverkets föreskrifter om bostäders lämplighet för sitt ändamål", "url": "https://rinfo.boverket.se/BFS2024-11/pdf/BFS2024-11.pdf"}, {"ref": "BFS 2024:12 Boverkets föreskrifter om byggnaders tillgänglighet och användbarhet", "url": "https://forfattningssamling.boverket.se/detaljer/BFS2024-12"}, {"ref": "BFS 2024:8 Boverkets föreskrifter om skydd med hänsyn till hygien, hälsa och miljö samt hushållning med vatten och avfall", "url": "https://forfattningssamling.boverket.se/detaljer/BFS2024-8"}, {"ref": "BFS 2024:10 Boverkets föreskrifter om skydd mot buller i byggnader", "url": "https://forfattningssamling.boverket.se/detaljer/BFS2024-10"}, {"ref": "BFS 2024:7 Boverkets föreskrifter och allmänna råd om säkerhet i händelse av brand i byggnader", "url": "https://forfattningssamling.boverket.se/detaljer/BFS2024-7"}, {"ref": "BFS 2026:4 Boverkets föreskrifter och allmänna råd om hållbar mobilitet (in force 1 July 2026)", "url": "https://forfattningssamling.boverket.se/detaljer/BFS2026-4"}], "permits": ["Bygglov for change of use: PBL 9 kap. 15 § p. 1 (building taken into use for a substantially different purpose) and p. 2 (an additional dwelling is created). Numbering as amended by Lag (2025:974); before 1 Dec 2025 this was 9 kap. 2 § p. 3 a-b.", "Detaljplan must permit 'Bostäder' (B); otherwise planändring or an avvikelse is needed.", "Tekniskt samråd and startbesked (technical requirements of BFS 2024:7-2024:12 are handled here, design requirements at bygglov).", "On alteration, the altered part must meet the new-build requirements, which may be adapted on the grounds listed in BFS 2024:11 4 kap. 1 § (varsamhet, förvanskning, scope, negligible benefit, unreasonable cost, technical reasons, other requirements)."], "operator_oversight": "Byggnadsnämnden (municipality) under PBL; no sector-specific operator authority."}, "occupancy": {"unit": "resident", "gross_m2_per_unit": {"value": 45, "range": [40, 50], "strength": "practice", "source": "Derived: SCB 'Hushållens boende 2025' gives 35 m² bostadsarea per person for rented flats in flerbostadshus (40 m² for bostadsrätt, 42 m² national average). Converted to gross with an assumed BOA/BTA ratio of about 0.75-0.85; that ratio is an assumption, not sourced.", "url": "https://www.scb.se/hitta-statistik/statistik-efter-amne/boende-bebyggelse-och-mark/bostader-och-boende/hushallens-boende/pong/statistiknyhet/hushallens-boende-2025/", "confidence": "indicative"}, "staff_per_unit": {"value": 0, "strength": "practice", "source": "No on-site staff in ordinary rental housing; property management is off-site or shared."}, "hours_profile": "24_7", "hourly_presence": [0.95, 0.95, 0.95, 0.95, 0.95, 0.95, 0.9, 0.75, 0.5, 0.4, 0.35, 0.35, 0.35, 0.35, 0.35, 0.4, 0.5, 0.65, 0.75, 0.8, 0.85, 0.9, 0.95, 0.95], "hourly_presence_note": "Indicative weekday profile (share of residents at home): high at night, low during working hours, peak in the evening. Not taken from a source; replace with SCB tidsanvändningsundersökning data if needed. Weekends sit roughly between 0.6 and 0.95 all day.", "persons_per_dwelling_note": "BFS 2024:11 2 kap. 1 § requires sizing for 'det antal boende som den är avsedd för'; Boverket's guidance says a dwelling is intended for as many persons as it has sleeping places. Design persons per variant are listed under variants and are indicative."}, "spaces": [{"id": "dwelling_sleep", "label_en": "Space for sleep and rest (bedroom or separable part of a room)", "label_sv": "Utrymme för sömn och vila", "required": {"strength": "law", "basis": "PBF 3 kap. 1 § and 17 § (separable spaces for sömn och vila, in reasonable measure); BFS 2024:11 2 kap. 1 § (design and size for the bostadsfunktioner)", "url": "https://rinfo.boverket.se/BFS2024-11/pdf/BFS2024-11.pdf"}, "size": {"rule": "per_unit", "value_m2": null, "count": "one sleeping place per intended resident; number of separable sleeping spaces depends on household size", "strength": "none", "source": "BFS 2024:11 sets no m². Boverket points to 'relevanta och vedertagna standarder' (SS 91 42 21:2006 is the established Swedish standard but is paid and no longer referenced by the regulation).", "url": "https://www.boverket.se/sv/PBL-kunskapsbanken/regler-om-byggande/bostaders-lamplighet/utformning/", "confidence": "verified"}, "constraints": {"min_ceiling_height_mm": null, "daylight_required": true, "facade_required": true}, "depends_on": [], "shareable_with": [], "shareable_note": "Private function; not shareable in an ordinary dwelling.", "binding_constraint": "daylight_and_plan_depth", "layer": "space_plan", "notes": "Accessibility: in at least one sleeping space it must be possible to arrange free space for help along both long sides and the foot of at least one bed (BFS 2024:12 2 kap. 10 §). In a multi-storey dwelling only the entrance level needs to be accessible, but it must give access to all functions (BFS 2024:12 2 kap. 12 §). Daylight: DF >= 1.0 % over at least half the summed floor area of rooms used more than temporarily (BFS 2024:8 4 kap. 1 §). Ceiling height: BFS 2024:8 5 kap. 1 § is only functional ('tillräcklig ... anpassad till rummets avsedda användning'); the old BBR 2.40 m value is no longer in the regulation, so null is recorded."}, {"id": "dwelling_living", "label_en": "Space for socialising / living room", "label_sv": "Utrymme för samvaro (vardagsrum)", "required": {"strength": "law", "basis": "PBF 3 kap. 1 § and 17 §; BFS 2024:11 2 kap. 1 §; outlook required: BFS 2024:8 4 kap. 2 § ('utrymme för bostadsfunktionerna samvaro och måltider ha utblick')", "url": "https://rinfo.boverket.se/BFS2024-11/pdf/BFS2024-11.pdf"}, "size": {"rule": "per_unit", "value_m2": null, "count": "one per dwelling", "strength": "none", "source": "No m² in BFS 2024:11 or its guidance.", "url": "https://www.boverket.se/sv/PBL-kunskapsbanken/regler-om-byggande/bostaders-lamplighet/utformning/", "confidence": "verified"}, "constraints": {"min_ceiling_height_mm": null, "daylight_required": true, "facade_required": true}, "depends_on": [], "shareable_with": [], "shareable_note": "In small dwellings for few persons, sleep/rest and socialising may overlap (Boverket guidance on överlappning).", "binding_constraint": "daylight_and_outlook", "layer": "space_plan", "notes": "The outlook requirement (utblick) makes a window toward the outside effectively mandatory for living and dining spaces."}, {"id": "dwelling_kitchen", "label_en": "Kitchen / space for cooking", "label_sv": "Utrymme för matlagning (kök)", "required": {"strength": "law", "basis": "PBF 3 kap. 1 § second paragraph (fittings and equipment for cooking); BFS 2024:11 3 kap. 3 § (fixed fittings and equipment sized for the number of persons the dwelling is intended for); BFS 2024:12 2 kap. 8 § and 3 kap. 8 § (kitchen can be made accessible)", "url": "https://rinfo.boverket.se/BFS2024-11/pdf/BFS2024-11.pdf"}, "size": {"rule": "per_unit", "value_m2": null, "count": "one per dwelling", "strength": "none", "source": "Regulation requires fitting units 'i lämpligt antal och lämpliga storlekar' for the household but gives no length or m². Kitchen fitting lengths in SS 91 42 21:2006 are behind a paywall and are not reproduced here.", "url": "https://www.boverket.se/sv/PBL-kunskapsbanken/regler-om-byggande/bostaders-lamplighet/inredning/", "confidence": "verified"}, "constraints": {"min_ceiling_height_mm": null, "daylight_required": false, "facade_required": false}, "depends_on": ["dwelling_dining"], "shareable_with": [], "shareable_note": "Not shareable in an ordinary dwelling (sharing is only allowed in dwellings with boendeenheter; see co_living).", "binding_constraint": "drainage_and_kitchen_exhaust", "layer": "services", "notes": "Cooking fumes must be removed at the source (BFS 2024:8 3 kap. 6 §). Kitchen exhaust ducts serving dwellings have fire rules in BFS 2024:7 4 kap. 22 §. Room for temporary storage of household waste must exist in the apartment (BFS 2024:8 11 kap. 3 §)."}, {"id": "dwelling_dining", "label_en": "Space for meals", "label_sv": "Utrymme för måltider", "required": {"strength": "law", "basis": "PBF 3 kap. 1 § and 17 §; BFS 2024:11 2 kap. 1 §; outlook required by BFS 2024:8 4 kap. 2 §", "url": "https://rinfo.boverket.se/BFS2024-11/pdf/BFS2024-11.pdf"}, "size": {"rule": "per_seat", "value_m2": null, "count": "a dining place for the intended number of residents", "strength": "none", "source": "No m² in the regulation.", "url": "https://www.boverket.se/sv/PBL-kunskapsbanken/regler-om-byggande/bostaders-lamplighet/inredning/", "confidence": "verified"}, "constraints": {"min_ceiling_height_mm": null, "daylight_required": true, "facade_required": true}, "depends_on": ["dwelling_kitchen"], "shareable_with": [], "shareable_note": "Usually combined with kitchen or living room.", "binding_constraint": "outlook", "layer": "space_plan", "notes": ""}, {"id": "dwelling_hygiene", "label_en": "Bathroom (room for personal hygiene)", "label_sv": "Rum för personhygien (badrum/hygienrum)", "required": {"strength": "law", "basis": "BFS 2024:11 2 kap. 3 § ('I bostaden ska finnas rum för personhygien') and 3 kap. 1 § (fixed fittings); BFS 2024:12 2 kap. 9 § and 3 kap. 9 § (at least one hygiene room accessible for a person with reduced mobility)", "url": "https://rinfo.boverket.se/BFS2024-11/pdf/BFS2024-11.pdf"}, "size": {"rule": "per_unit", "value_m2": null, "count": "at least one per dwelling, at least one of them accessible", "strength": "none", "source": "No m² in regulation. The binding geometry is the wheelchair design dimensions for inside dwellings in BFS 2024:12 1 kap. 6 §: wheelchair 0.70 x 1.20 m, turning circle 1.30 m diameter, door clear passage >= 0.76 m.", "url": "https://forfattningssamling.boverket.se/detaljer/BFS2024-12", "confidence": "verified"}, "constraints": {"min_ceiling_height_mm": null, "daylight_required": false, "facade_required": false}, "depends_on": [], "shareable_with": [], "shareable_note": "Must be a separate room inside the dwelling ('Funktionen personhygien måste dock alltid vara i ett separat rum').", "binding_constraint": "wet_room_drainage", "layer": "services", "notes": "Office conversions: new wet rooms need falls to drains and stack routing through existing slabs, often the costliest single item."}, {"id": "dwelling_storage_daily", "label_en": "Storage for daily use (wardrobes, cleaning cupboard, outdoor clothes)", "label_sv": "Förvaring för dagligt bruk", "required": {"strength": "law", "basis": "PBF 3 kap. 1 § and 17 § (förvaring); BFS 2024:11 2 kap. 1 §. Boverket defines daily-use storage as clothes, home textiles, cleaning equipment, which stays inside the dwelling.", "url": "https://www.boverket.se/sv/PBL-kunskapsbanken/regler-om-byggande/bostaders-lamplighet/utformning/"}, "size": {"rule": "per_unit", "value_m2": null, "count": "scaled to number of residents", "strength": "none", "source": "No storage quantity in BFS 2024:11. The old BBR general advice quantities (via SS 91 42 21) are no longer referenced.", "url": "https://www.boverket.se/sv/PBL-kunskapsbanken/regler-om-byggande/bostaders-lamplighet/utformning/", "confidence": "verified"}, "constraints": {"min_ceiling_height_mm": null, "daylight_required": false, "facade_required": false}, "depends_on": [], "shareable_with": [], "shareable_note": "", "binding_constraint": "none", "layer": "stuff", "notes": "Interior zone of a deep plan suits this."}, {"id": "storage_non_daily", "label_en": "Storage not for daily use (apartment storeroom: seasonal items, suitcases)", "label_sv": "Förvaring som inte är för dagligt bruk (lägenhetsförråd)", "required": {"strength": "law", "basis": "PBF 3 kap. 1 § (förvaring); BFS 2024:11 2 kap. 5 § allows it outside the dwelling but nearby; if outside it must be 'avskilt' (separate/lockable per dwelling)", "url": "https://rinfo.boverket.se/BFS2024-11/pdf/BFS2024-11.pdf"}, "size": {"rule": "per_unit", "value_m2": null, "count": "one per dwelling", "strength": "none", "source": "No m² in BFS 2024:11.", "url": "https://rinfo.boverket.se/BFS2024-11/pdf/BFS2024-11.pdf", "confidence": "verified"}, "constraints": {"min_ceiling_height_mm": null, "daylight_required": false, "facade_required": false}, "depends_on": [], "shareable_with": [], "shareable_note": "Each dwelling's share must be separated; the room can be common.", "binding_constraint": "none", "layer": "space_plan", "notes": "Basements and dark deep-plan zones of offices are good for this. Fire: lägenhetsförråd = Vk 1 (BFS 2024:7 2 kap. 10 §)."}, {"id": "storage_bulky_shared", "label_en": "Room for bulky items in daily use (prams, bicycles, wheelchairs, walkers)", "label_sv": "Rum för skrymmande föremål för dagligt bruk (barnvagns-/rullstolsförråd)", "required": {"strength": "law", "basis": "BFS 2024:11 2 kap. 6 § (may be outside the dwelling and shared; must be sized for the dwellings that share it). Boverket guidance lists cyklar, rullstolar, rollatorer, barnvagnar.", "url": "https://rinfo.boverket.se/BFS2024-11/pdf/BFS2024-11.pdf"}, "size": {"rule": "per_building", "value_m2": null, "count": "sized for the dwellings sharing it", "strength": "none", "source": "No m² in regulation.", "url": "https://www.boverket.se/sv/PBL-kunskapsbanken/regler-om-byggande/bostaders-lamplighet/utformning/", "confidence": "verified"}, "constraints": {"min_ceiling_height_mm": null, "daylight_required": false, "facade_required": false}, "depends_on": [], "shareable_with": ["co_living", "student_housing"], "shareable_note": "Can be combined with the bicycle room.", "binding_constraint": "step_free_access_from_entrance", "layer": "space_plan", "notes": "Must be reachable step-free near the entrance to be usable for prams and wheelchairs."}, {"id": "laundry_room", "label_en": "Shared laundry room", "label_sv": "Tvättstuga", "required": {"strength": "law", "basis": "PBF 3 kap. 1 § (hygien includes hantering av tvätt per Boverket). BFS 2024:11 2 kap. 4 § allows the function outside the dwelling, shared, near the dwellings and sized for them; 3 kap. 2 § requires fixed equipment for machine washing and drying when shared. If not shared, space for it must be inside each dwelling.", "url": "https://rinfo.boverket.se/BFS2024-11/pdf/BFS2024-11.pdf"}, "size": {"rule": "per_building", "value_m2": null, "count": "number and type of machines sized for the number, size and type of dwellings sharing it", "strength": "none", "source": "No m² or machine ratio in the regulation.", "url": "https://www.boverket.se/sv/PBL-kunskapsbanken/regler-om-byggande/bostaders-lamplighet/inredning/", "confidence": "verified"}, "constraints": {"min_ceiling_height_mm": null, "daylight_required": false, "facade_required": false}, "depends_on": [], "shareable_with": ["student_housing", "co_living"], "shareable_note": "One laundry can serve several residential uses in the same building.", "binding_constraint": "drainage_and_exhaust", "layer": "services", "notes": "Alternative: washer/dryer space in each bathroom (then the shared room is not needed)."}, {"id": "waste_room", "label_en": "Waste room / waste collection point", "label_sv": "Avfallsutrymme / avfallsanordning", "required": {"strength": "law", "basis": "BFS 2024:8 11 kap. 1-3 §§ (waste must be handled in or next to the building; avfallsanordningar or avfallsutrymmen required; placed, designed and sized for hygiene and for removal 'på det sätt som krävs')", "url": "https://forfattningssamling.boverket.se/detaljer/BFS2024-8"}, "size": {"rule": "per_building", "value_m2": null, "count": "depends on fractions and collection frequency in the municipal waste rules", "strength": "programme", "source": "Size comes from the municipality's renhållningsföreskrifter / avfallshandbok (varies by municipality); not set nationally.", "url": "https://www.boverket.se/sv/PBL-kunskapsbanken/regler-om-byggande/hygien-halsa-och-miljo/avfallsutrymmen/", "confidence": "indicative"}, "constraints": {"min_ceiling_height_mm": null, "daylight_required": false, "facade_required": false}, "depends_on": [], "shareable_with": ["student_housing", "co_living", "hotel"], "shareable_note": "Can be shared across uses in a mixed building if fractions and access suit both.", "binding_constraint": "collection_vehicle_access", "layer": "site", "notes": "Distance and route for the collection vehicle is usually what fails in an existing building."}, {"id": "bicycle_parking", "label_en": "Bicycle parking", "label_sv": "Cykelparkering", "required": {"strength": "law", "basis": "BFS 2026:4 2 kap. 2 §: a new flerbostadshus must have at least two bicycle parking spaces per bostadslägenhet, plus a reasonable number for larger cycles. On alteration the rules only apply to an ombyggnad that involves car parking (1 kap. 4 §), and the number may be adapted if two per apartment is not possible (3 kap. 1 §).", "url": "https://www.boverket.se/sv/PBL-kunskapsbanken/regler-om-byggande/hallbar-mobilitet/"}, "size": {"rule": "per_unit", "value_m2": null, "count": ">= 2 spaces per apartment (new build)", "strength": "law", "source": "The law sets the count, not the m². Space dimensions: see Boverket's page on designing bicycle parking spaces (not extracted here).", "url": "https://www.boverket.se/sv/PBL-kunskapsbanken/regler-om-byggande/hallbar-mobilitet/utformning-av-cykelparkeringsplatser/", "confidence": "verified"}, "constraints": {"min_ceiling_height_mm": null, "daylight_required": false, "facade_required": false}, "depends_on": [], "shareable_with": ["student_housing", "co_living"], "shareable_note": "", "binding_constraint": "ground_floor_area", "layer": "site", "notes": "Municipal parking norms (parkeringsnorm/mobilitetsnorm) may ask for more; they are programme-level and vary by city. Applies to applications made on or after 1 July 2026."}, {"id": "outdoor_play_space", "label_en": "Outdoor space for play and outdoor stay (friyta)", "label_sv": "Friyta för lek och utevistelse", "required": {"strength": "law", "basis": "PBL 8 kap. 9 § second paragraph (a plot built with dwellings shall have sufficiently large friyta on or near the plot, prioritised over parking) and 8 kap. 10 § (applies 'i skälig utsträckning' when the plot is already built, i.e. conversions)", "url": "https://www.riksdagen.se/sv/dokument-och-lagar/dokument/svensk-forfattningssamling/plan-och-bygglag-2010900_sfs-2010-900/"}, "size": {"rule": "per_building", "value_m2": null, "count": "sufficiently large for the residents; may be 'i närheten' (nearby park)", "strength": "none", "source": "PBL sets no m². Some municipalities set friyta targets in their own programmes (not checked here).", "url": "https://www.riksdagen.se/sv/dokument-och-lagar/dokument/svensk-forfattningssamling/plan-och-bygglag-2010900_sfs-2010-900/", "confidence": "verified"}, "constraints": {"min_ceiling_height_mm": null, "daylight_required": true, "facade_required": false}, "depends_on": [], "shareable_with": ["student_housing", "co_living"], "shareable_note": "Roof terraces or courtyards shared with other residential uses.", "binding_constraint": "plot_area", "layer": "site", "notes": "Office plots in business parks often have parking but no friyta; a nearby park may satisfy 'i närheten'."}, {"id": "entrance_stair_lift", "label_en": "Entrance, stairwell and lift", "label_sv": "Entré, trapphus och hiss", "required": {"strength": "law", "basis": "BFS 2024:12 2 kap. 1-2 §§, 5 § (accessible entrance and circulation; lift for wheelchair user plus helper, clear short side >= 1100 mm; more than one passenger lift above ten storeys); 3 kap. 2 § and 5 § (stretcher transport from every dwelling; stretcher in lift in residential buildings of more than four storeys); PBF 3 kap. 4 § (lift not needed for dwellings in buildings with fewer than three storeys, but must be possible to add)", "url": "https://forfattningssamling.boverket.se/detaljer/BFS2024-12"}, "size": {"rule": "derived", "value_m2": null, "count": "per stair core", "strength": "law", "source": "Lift dimension (short side >= 1100 mm) is law; corridor widths are functional only ('utifrån utformningen och längden av utrymmet'). Public-area wheelchair dimensions: 0.70 x 1.30 m, turning circle 1.50 m, door >= 0.80 m (BFS 2024:12 1 kap. 6 §).", "url": "https://forfattningssamling.boverket.se/detaljer/BFS2024-12", "confidence": "verified"}, "constraints": {"min_ceiling_height_mm": null, "daylight_required": false, "facade_required": false}, "depends_on": [], "shareable_with": ["student_housing", "co_living", "hotel"], "shareable_note": "", "binding_constraint": "fire_egress_and_stair_count", "layer": "structure", "notes": "Office cores usually have lifts, but stair numbers and their relation to new fire compartments decide egress. On alteration of a multi-dwelling building above two storeys with major intervention in stairwell, plan or structure, an accessible lift must be installed if missing (BFS 2024:12 4 kap. 5 §). From 1 Jan 2027, PBF 3 kap. 4 b § / 18 b § (SFS 2026:1265) say a lift need not be installed on alteration if the building has fewer than four storeys afterwards."}, {"id": "balcony_or_patio", "label_en": "Balcony or private patio", "label_sv": "Balkong / uteplats", "required": {"strength": "practice", "basis": "Not required by BFS 2024:11; market practice in new production. Where present, BFS 2024:12 2 kap. 11 § sets accessibility rules for roof terraces that complement a balcony.", "url": "https://forfattningssamling.boverket.se/detaljer/BFS2024-12"}, "size": {"rule": "per_unit", "value_m2": null, "count": "optional", "strength": "none", "source": "No source sets size.", "url": "", "confidence": "indicative"}, "constraints": {"min_ceiling_height_mm": null, "daylight_required": true, "facade_required": true}, "depends_on": [], "shareable_with": [], "shareable_note": "", "binding_constraint": "facade_and_structure", "layer": "skin", "notes": "Adding balconies to an office facade is a structural and facade intervention."}, {"id": "car_parking", "label_en": "Car parking, loading and unloading", "label_sv": "Bilparkering, lastning och lossning", "required": {"strength": "law", "basis": "PBL 8 kap. 9 § first paragraph p. 4 ('i skälig utsträckning' on or near the plot); friyta takes priority if space is short", "url": "https://www.riksdagen.se/sv/dokument-och-lagar/dokument/svensk-forfattningssamling/plan-och-bygglag-2010900_sfs-2010-900/"}, "size": {"rule": "per_unit", "value_m2": null, "count": "per municipal parkeringsnorm", "strength": "programme", "source": "Municipal parking/mobility norms (vary by city and zone).", "url": "", "confidence": "indicative"}, "constraints": {"min_ceiling_height_mm": null, "daylight_required": false, "facade_required": false}, "depends_on": [], "shareable_with": ["hotel"], "shareable_note": "Office parking is often surplus after conversion; daytime/evening sharing with other uses is possible.", "binding_constraint": "none", "layer": "site", "notes": "If there are more than three car spaces, EV-charging pre-installation applies to new buildings (BFS 2026:4 2 kap. 1 §)."}], "variants": [{"id": "apt_1rok", "label": "1 rok (one room + kitchenette/kitchen)", "changes": "Design persons 1 (indicative). Typical BOA about 25-40 m² (indicative, not sourced). Sleep, socialising and meals may overlap in one room; only the bathroom must be a separate room. Under the old BBR this was the <=35 m² band (BBR 3:224 (repealed BBR, pre-2025)), which no longer exists."}, {"id": "apt_2rok", "label": "2 rok", "changes": "Design persons 1-2 (indicative). Typical BOA about 45-60 m² (indicative). One separable bedroom. Old BBR band 35-55 m² (BBR 3:223 (repealed BBR, pre-2025)) required either the bedroom or the kitchen to be separable; that rule is gone and replaced by the four-factor judgement."}, {"id": "apt_3rok", "label": "3 rok", "changes": "Design persons 2-4 (indicative). Typical BOA about 65-80 m² (indicative). Two bedrooms, one with room for a double bed (old BBR 3:222 (repealed BBR, pre-2025) general advice; not in the new rules)."}, {"id": "apt_4rok", "label": "4 rok", "changes": "Design persons 3-5 (indicative). Typical BOA about 85-100 m² (indicative). Bigger kitchen fittings and storage scaled to household size (BFS 2024:11 3 kap. 3 §); a second WC is common practice but not required."}], "conversion_from_office": {"typical_blockers": ["Daylight: DF >= 1.0 % over half the habitable floor area (BFS 2024:8 4 kap. 1 §), relaxable to 0.8 % on conversion of non-residential premises only on the grounds in 12 kap. 1 § (BFS 2024:8 13 kap. 5 §). Office plans deeper than about 12-14 m usually fail without an atrium or light well (depth figure indicative).", "Wet rooms in every dwelling: drainage falls and new stacks through existing slabs.", "Sound insulation between dwellings to the BFS 2024:10 2 kap. tables (e.g. 52 dB DnT,w,50 from other spaces outside the dwelling; 56 dB from commercial premises) where offices had lightweight partitions and continuous raised floors or suspended ceilings.", "Fire: change from Vk 1 to Vk 3A; each dwelling becomes its own fire compartment (BFS 2024:7 5 kap. 25 §), with new compartment walls, doors and egress.", "Outdoor friyta (PBL 8 kap. 9-10 §§) on plots designed for parking.", "Detaljplan may only allow offices ('K')."], "typical_enablers": ["Existing lifts and accessible entrances usually meet BFS 2024:12.", "Ventilation capacity (0.35 l/s per m², BFS 2024:8 3 kap. 5 §) is often already met by office systems, though the distribution needs rebuilding.", "Generous floor-to-floor heights allow drainage in raised floors.", "BFS 2024:11 4 kap. 1 § lets requirements be adapted on alteration (technical reasons, unreasonable cost, varsamhet).", "The functional (non-m²) dwelling rules give freedom to fit unusual plans."]}, "sources": [{"ref": "BFS 2024:11 Boverkets föreskrifter om bostäders lämplighet för sitt ändamål (full text, 7 pages)", "url": "https://rinfo.boverket.se/BFS2024-11/pdf/BFS2024-11.pdf", "accessed": "2026-10-19"}, {"ref": "Boverket PBL kunskapsbanken: Bostäders utformning och dimensionering", "url": "https://www.boverket.se/sv/PBL-kunskapsbanken/regler-om-byggande/bostaders-lamplighet/utformning/", "accessed": "2026-10-19"}, {"ref": "Boverket PBL kunskapsbanken: Bostäders inredning och utrustning", "url": "https://www.boverket.se/sv/PBL-kunskapsbanken/regler-om-byggande/bostaders-lamplighet/inredning/", "accessed": "2026-10-19"}, {"ref": "Boverket PBL kunskapsbanken: Anpassning av krav på bostäders lämplighet vid ändring", "url": "https://www.boverket.se/sv/PBL-kunskapsbanken/regler-om-byggande/bostaders-lamplighet/andring/", "accessed": "2026-10-19"}, {"ref": "BFS 2024:12 tillgänglighet och användbarhet, 1 kap. 6 §, 2 kap. 1-12 §§, 3 kap., 4 kap. 5 §", "url": "https://forfattningssamling.boverket.se/detaljer/BFS2024-12", "accessed": "2026-10-19"}, {"ref": "Boverket PBL kunskapsbanken: Tillgängliga bostäder (quotes PBF 3 kap. 4 §, 18 § incl. 2027 versions)", "url": "https://www.boverket.se/sv/PBL-kunskapsbanken/regler-om-byggande/tillganglighet-och-anvandbarhet/tillgangliga-bostader/", "accessed": "2026-10-19"}, {"ref": "BFS 2024:8 hygien, hälsa och miljö: 3 kap. 5-6 §§ ventilation, 4 kap. 1-2 §§ dagsljus/utblick, 5 kap. 1 § rumshöjd, 11 kap. avfall, 13 kap. 5 § dagsljus vid ändring", "url": "https://forfattningssamling.boverket.se/detaljer/BFS2024-8", "accessed": "2026-10-19"}, {"ref": "BFS 2024:10 skydd mot buller, 2 kap. 2-8 §§, 3 kap.", "url": "https://forfattningssamling.boverket.se/detaljer/BFS2024-10", "accessed": "2026-10-19"}, {"ref": "BFS 2024:7 brand, 2 kap. 10 §, 14 §; 5 kap. 24-25 §§", "url": "https://forfattningssamling.boverket.se/detaljer/BFS2024-7", "accessed": "2026-10-19"}, {"ref": "Boverket PBL kunskapsbanken: Hållbar mobilitet (quotes BFS 2026:4 1 kap. 4 §, 2 kap. 1-4 §§, 3 kap. 1 §)", "url": "https://www.boverket.se/sv/PBL-kunskapsbanken/regler-om-byggande/hallbar-mobilitet/", "accessed": "2026-10-19"}, {"ref": "Plan- och bygglag (2010:900), riksdagen.se (8 kap. 9-10 §§; 9 kap. 15 §)", "url": "https://www.riksdagen.se/sv/dokument-och-lagar/dokument/svensk-forfattningssamling/plan-och-bygglag-2010900_sfs-2010-900/", "accessed": "2026-10-19"}, {"ref": "Boverket (2026) Boverkets byggregler Bostadsutformning – Vägledning från PBL kunskapsbanken (före 1 juli 2026), archived guidance on old BBR 3:22x (repealed BBR, pre-2025), pp. 3, 8-9", "url": "https://www.boverket.se/globalassets/publikationer/dokument/2026/boverkets-byggregler-bbr---bostadsutformning-efter-1-december-2025.pdf", "accessed": "2026-10-19"}, {"ref": "SCB, Hushållens boende 2025 (m² per person by tenure)", "url": "https://www.scb.se/hitta-statistik/statistik-efter-amne/boende-bebyggelse-och-mark/bostader-och-boende/hushallens-boende/pong/statistiknyhet/hushallens-boende-2025/", "accessed": "2026-10-19"}, {"ref": "SIS, SS 25267:2024 Byggakustik – Ljudklassning av utrymmen i byggnader – Bostäder (product page; replaces SS 25267:2015)", "url": "https://www.sis.se/en/produkter/building-design-stage/building-design/ss-252672024/", "accessed": "2026-10-19"}], "open_questions": ["BFS 2024:7, 2024:8 and 2024:10 were read in their original 2024 text; later amending BFS (2025-2026) were not checked. BFS 2024:11 and 2024:12 wording matches the October 2026 Boverket guidance pages.", "SS 91 42 21:2006 (dimensions, kitchen and storage lengths) is no longer cited by the regulation. Does any municipality still require it? Is a revision under way at SIS? Its values are paid and were not used.", "Sound class: SS 25267:2024 classes A-D were mapped to the old BBR 7 (class C = BBR level). How they map to the new BFS 2024:10 tables was not checked.", "Accessibility levels 'B/C' asked for in the brief: we found no public source tying SS 91 42 21 to such levels. What is public is the wheelchair dimensions in BFS 2024:12 1 kap. 6 §. The level terminology needs checking against the paid standard.", "Ceiling height: no numeric minimum remains (BFS 2024:8 5 kap. 1 § is functional). Is 2.40 m still applied in practice by building committees?", "PBL changes from 1 Jan 2027 (Lag 2026:746: new 8 kap. 2 a, 5 a-5 b §§ and 'större byggnadsändring') will change how requirements apply on alteration. Re-check when in force.", "Persons per dwelling type and BOA ranges per rok are indicative working values. Replace them with a municipal or allmännyttan programme (e.g. the target pilot city's housing company) if one exists.", "Overcrowding norm (e.g. 'norm 2': at most two persons per bedroom, kitchen and living room excluded) could calibrate persons per rok, but no current source was retrieved."]}, "library": {"id": "library", "label_en": "Public library", "label_sv": "Folkbibliotek", "family": "community", "summary": "Municipal public library. Bibliotekslagen (2013:801) requires every municipality to have folkbibliotek. They must be open to all, lend literature free of charge, and give special attention to children and young people, persons with disabilities, national minorities and people whose first language is not Swedish. They must also promote reading and knowledge of IT. The law sets services, not space: no Swedish law or national guidance gives a library size. The only quantitative space standards found are foreign examples published in the IFLA Public Library Service Guidelines (Ontario 1997: 56 m2 per 1,000 inhabitants for communities under 100,000). Size is therefore indicative and set in the municipal biblioteksplan (Bibliotekslagen 17 §).", "regulatory": {"bbr_verksamhetsklass": "2A (max 150 persons) or 2B (more than 150): a library is a public premises with awake visitors unfamiliar with the building (BFS 2024:7 2 kap. 11–12 §§). See cross_cutting.json fire_vk_2abc. Libraries are also named in BFS 2024:7 2 kap. 3 § on variable fire load (bibliotek), so check fire load density in cross_cutting fire_load_density.", "key_laws": [{"ref": "Bibliotekslag (2013:801), t.o.m. SFS 2024:1073: 2, 4–9, 17 §§", "url": "https://www.riksdagen.se/sv/dokument-och-lagar/dokument/svensk-forfattningssamling/bibliotekslag-2013801_sfs-2013-801/"}, {"ref": "BFS 2024:7 brandskydd: 2 kap. 3–4, 11–12 §§", "url": "https://rinfo.boverket.se/BFS2024-7/pdf/BFS2024-7.pdf"}, {"ref": "BFS 2024:12 tillgänglighet: 2 kap. 7 §, 3 kap. 6–7 §§", "url": "https://rinfo.boverket.se/BFS2024-12/pdf/BFS2024-12.pdf"}, {"ref": "BFS 2024:6 4 kap. 10 § tabell 4:1 (C1, C3, E1)", "url": "https://www.boverket.se/sv/PBL-kunskapsbanken/regler-om-byggande/barformaga-stadga-bestandighet/laster/nyttiga-laster/"}], "permits": ["Bygglov for change of use from office (PBL 9 kap. 15 § 1 since 2025-12-01; formerly 9 kap. 2 § första stycket 3 a; see cross_cutting.json cou_bygglov_trigger). The detaljplan must allow the use (often C centrum or S skola/samhällsservice; not verified against Boverket's planbestämmelser guide).", "Municipal biblioteksplan (Bibliotekslagen 17 §) sets the service level; the municipality is usually both operator and client."], "cross_cutting_refs": ["cou_bygglov_trigger", "cou_anmalan", "cou_requirements_scope", "fire_vk_2abc", "fire_load_density", "fire_egress_dimensions", "occ_density_law_2024", "occ_density_bbr_table_5333", "access_design_dimensions", "access_public_premises_wc", "access_public_premises_other", "access_hin", "san_public", "san_workplace", "staff_personalutrymmen_general", "staff_eating_rest", "staff_room_height_daylight", "vent_workplace", "acoustics_premises", "loads_imposed_table_4_1", "loads_structure_change"], "operator_oversight": "Municipality (kultur- och fritidsnämnd); Kungliga biblioteket (national follow-up and statistics); regional library activity (Bibliotekslagen 11 §)"}, "occupancy": {"unit": "inhabitant_served", "gross_m2_per_unit": {"value": 0.056, "range": null, "strength": "practice", "source": "IFLA Public Library Service Guidelines, 2nd ed. (2010), Appendix 4, p. 131: Ontario Public Library Guidelines 1997: 'For a community under 100 000 population the appropriate standard is 56 sq. m. (600 sq. ft.) per 1000 capita'. IFLA 3.10.2 (p. 59) states that a universal space standard cannot be proposed. This is a foreign example, not Swedish practice.", "confidence": "sourced", "note": "Minimum sizes in the same appendix: independent library at least 370 m2; branch at least 230 m2 plus 14 m2 per additional 1,000 volumes over 3,000. No Swedish equivalent was found."}, "staff_per_unit": {"value": 0.0005, "strength": "practice", "source": "IFLA 2010 Appendix 4 (Ontario 1997): 1 staff member per 2,000 population, at 16.3 m2 total space per staff member including desks, circulation, lounge and lockers. Foreign example; confidence sourced."}, "egress_design_density": {"persons_per_m2": 0.1, "strength": "practice", "source": "Old BBR (repealed BBR, pre-2025) general advice, practice: BBR tabell 5:333 (consolidated BBR p. 52) gave Bibliotek 0.1 persons/m2 net area, with deduction of loose furniture allowed. BFS 2024:7 2 kap. 4 § now requires the expected maximum and gives no library default. Event rooms inside the library use the samlingslokal default of 2.5 p/m2.", "url": "https://rinfo.boverket.se/BFS2011-6/dok/BFS2024-5_konsolidering.pdf", "confidence": "verified"}, "hours_profile": "retail_hours", "hourly_presence": [0, 0, 0, 0, 0, 0, 0, 0, 0.05, 0.2, 0.35, 0.4, 0.45, 0.45, 0.45, 0.55, 0.6, 0.55, 0.45, 0.3, 0.1, 0, 0, 0], "hourly_presence_note": "Modelling assumption (indicative, not sourced). Typical branch opening about 10–19 on weekdays with an after-school peak, and shorter Saturday hours. 'Meröppet' (self-service opening without staff) can extend hours to 7–22 at low occupancy."}, "spaces": [{"id": "library_collection", "label_en": "Open collection (shelving) and browsing", "label_sv": "Medieytor / öppen hylla", "required": {"strength": "law", "basis": "Bibliotekslagen 6 § (folkbibliotek open to all, with varied media of high quality) and 9 § (free lending of literature regardless of format). A service requirement. No space size is set.", "url": "https://www.riksdagen.se/sv/dokument-och-lagar/dokument/svensk-forfattningssamling/bibliotekslag-2013801_sfs-2013-801/"}, "size": {"rule": "derived", "value_m2": null, "range_m2": null, "count": "volumes / 110 per m2 (practice, foreign)", "strength": "practice", "source": "IFLA 2010 Appendix 4, p. 131 (Ontario 1997): '1 sq. m. for every 110 volumes', allowing low shelving and wider aisles in children's and reference areas. Foreign example.", "url": "https://repository.ifla.org/items/83753461-738d-4a36-a18e-60a7ae8e6c64/full", "confidence": "sourced"}, "constraints": {"min_ceiling_height_mm": null, "daylight_required": false, "facade_required": false}, "depends_on": [], "shareable_with": [], "shareable_note": "", "binding_constraint": "floor_load", "layer": "structure", "notes": "Loads: reading and browsing areas are C1/C3 (2.5–3.0 kN/m2), and book storage is E1 (5.0 kN/m2, BFS 2024:6 tabell 4:1). Assigning library stacks to E1 follows EN 1991-1-1 practice (not verified here). Compact or rolling shelving can exceed 5.0. Office slabs (B, 2.5) suit low open shelving but not stacks or compact archives without strengthening. IFLA 3.10.5 recommends adjustable shelving on lockable wheels for flexibility, and IFLA 3.10.3 gives circulation of 15–20 % in public areas."}, {"id": "library_children", "label_en": "Children's and youth area", "label_sv": "Barn- och ungdomsavdelning", "required": {"strength": "law", "basis": "Bibliotekslagen 8 §: folkbibliotek shall give special attention to children and young people to promote language development and reading, including by offering suitable literature. A service requirement; a dedicated area is how it is normally met. IFLA 3.10.3 (p. 59): space for children including babies and toddlers, young adults and family use.", "url": "https://www.riksdagen.se/sv/dokument-och-lagar/dokument/svensk-forfattningssamling/bibliotekslag-2013801_sfs-2013-801/"}, "s
