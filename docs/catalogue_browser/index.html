ize": {"rule": "per_building", "value_m2": null, "range_m2": null, "count": "", "strength": "none", "source": "No Swedish or IFLA size given.", "url": "", "confidence": "verified"}, "constraints": {"min_ceiling_height_mm": null, "daylight_required": true, "facade_required": false}, "depends_on": ["library_wc"], "shareable_with": ["preschool", "school_compulsory"], "shareable_note": "Story-time and class visits from nearby preschools and schools. The school library itself is regulated separately (Skollagen 2 kap. 24 a–d §§, referenced in Bibliotekslagen 10 §).", "binding_constraint": "acoustics", "layer": "space_plan", "notes": "Pram parking near the entrance and a baby-changing facility are practice. Acoustic separation from quiet study areas matters."}, {"id": "library_reading_study", "label_en": "Reading, study and group-work places incl. quiet room", "label_sv": "Läs- och studieplatser, grupprum, tyst rum", "required": {"strength": "practice", "basis": "Not named in Bibliotekslagen. IFLA 3.10.3 (p. 59): reader seating for leisure reading, study, group work and tutoring; 'quiet rooms should be provided'. Supports Bibliotekslagen 2 § (education and further learning).", "url": "https://repository.ifla.org/items/83753461-738d-4a36-a18e-60a7ae8e6c64/full"}, "size": {"rule": "per_seat", "value_m2": 2.8, "range_m2": null, "count": "5 user places per 1,000 inhabitants (practice, foreign)", "strength": "practice", "source": "IFLA 2010 Appendix 4, p. 132 (Ontario 1997): 5 user spaces per 1,000 capita; 2.8 m2 (30 sq ft) per reader station. Foreign example.", "url": "https://repository.ifla.org/items/83753461-738d-4a36-a18e-60a7ae8e6c64/full", "confidence": "sourced"}, "constraints": {"min_ceiling_height_mm": 2400, "daylight_required": true, "facade_required": true}, "depends_on": [], "shareable_with": ["coworking", "community_hybrid", "school_compulsory"], "shareable_note": "Study places overlap with coworking 'drop-in' demand. A library cannot charge for access to its core service (Bibliotekslagen 9 § covers lending; fees for space use are a policy question).", "binding_constraint": "daylight_and_view", "layer": "space_plan", "notes": "Rooms where people stay more than temporarily need sufficient daylight and view (BFS 2024:8 4 kap. 3 §, functional). Deep office plans suit stacks in the core and reading at the facade."}, {"id": "library_it", "label_en": "Public computers, printing and digital help", "label_sv": "Publika datorer, utskrift, digital vägledning", "required": {"strength": "law", "basis": "Bibliotekslagen 7 §: folkbibliotek shall work to increase knowledge of how information technology can be used for learning and participation in cultural life. A service requirement; no space defined.", "url": "https://www.riksdagen.se/sv/dokument-och-lagar/dokument/svensk-forfattningssamling/bibliotekslag-2013801_sfs-2013-801/"}, "size": {"rule": "per_building", "value_m2": null, "range_m2": null, "count": "", "strength": "none", "source": "No size source.", "url": "", "confidence": "verified"}, "constraints": {"min_ceiling_height_mm": null, "daylight_required": false, "facade_required": false}, "depends_on": [], "shareable_with": ["coworking", "community_hybrid"], "shareable_note": "", "binding_constraint": "none", "layer": "stuff", "notes": ""}, {"id": "library_accessible_media", "label_en": "Accessible media and assistive technology; minority-language collections", "label_sv": "Tillgängliga medier (talböcker m.m.), minoritetsspråk, lättläst", "required": {"strength": "law", "basis": "Bibliotekslagen 4 § (persons with disabilities: e.g. literature and technical aids adapted to their needs) and 5 § (national minorities and people whose first language is not Swedish: literature in minority languages, other languages and easy-to-read Swedish). Service requirements.", "url": "https://www.riksdagen.se/sv/dokument-och-lagar/dokument/svensk-forfattningssamling/bibliotekslag-2013801_sfs-2013-801/"}, "size": {"rule": "per_building", "value_m2": null, "range_m2": null, "count": "", "strength": "none", "source": "No size source; part of the collection area.", "url": "", "confidence": "verified"}, "constraints": {"min_ceiling_height_mm": null, "daylight_required": false, "facade_required": false}, "depends_on": ["library_collection"], "shareable_with": [], "shareable_note": "", "binding_constraint": "none", "layer": "stuff", "notes": ""}, {"id": "library_meeting_room", "label_en": "Meeting / event room for community groups", "label_sv": "Mötesrum / programrum", "required": {"strength": "practice", "basis": "IFLA 3.10.3 (p. 59): meeting room space for large and small community groups, which should have separate access to washrooms and to the exterior so meetings can be held while the library is closed. Not required by Swedish law.", "url": "https://repository.ifla.org/items/83753461-738d-4a36-a18e-60a7ae8e6c64/full"}, "size": {"rule": "per_building", "value_m2": null, "range_m2": null, "count": "", "strength": "none", "source": "IFLA Appendix 4: 'based on community service and programme objectives' (no figure).", "url": "", "confidence": "sourced"}, "constraints": {"min_ceiling_height_mm": 2700, "daylight_required": false, "facade_required": false}, "depends_on": ["library_wc"], "shareable_with": ["community_hybrid", "assembly_event", "shared_amenities", "coworking"], "shareable_note": "The textbook shared space: IFLA itself asks for after-hours access independent of the library. See shared_amenities.shared_meeting_rooms.", "binding_constraint": "egress_capacity", "layer": "space_plan", "notes": "A samlingssal needs a hearing-aid system (BFS 2024:12 3 kap. 6 §). 2,700 mm is guidance (AFS 2023:12 3 kap. 5 § allmänna råd; old BBR (repealed BBR, pre-2025) 3:3112). Event density uses the samlingslokal default (2.5 p/m2)."}, {"id": "library_desk_entrance", "label_en": "Entrance, service desk, self-service and returns", "label_sv": "Entré, informationsdisk, självbetjäning, återlämning", "required": {"strength": "law", "basis": "A reception in a publik lokal needs a hearing-aid sound transfer system (BFS 2024:12 3 kap. 6 §), and the main entrance must be accessible (2 kap. 1 §). IFLA 3.10.4 (p. 60): after-hours return facility, theft- and waterproof.", "url": "https://rinfo.boverket.se/BFS2024-12/pdf/BFS2024-12.pdf"}, "size": {"rule": "per_building", "value_m2": null, "range_m2": null, "count": "", "strength": "none", "source": "", "url": "", "confidence": "verified"}, "constraints": {"min_ceiling_height_mm": null, "daylight_required": false, "facade_required": true}, "depends_on": [], "shareable_with": ["shared_amenities", "community_hybrid"], "shareable_note": "A shared building lobby can host returns and the 'meröppet' entry control.", "binding_constraint": "accessibility", "layer": "space_plan", "notes": "IFLA 3.10.4: a library on two or more floors should have lifts close to the entrance that take wheelchairs and prams."}, {"id": "library_wc", "label_en": "Public WCs incl. accessible WC and baby changing", "label_sv": "Publika toaletter, RWC, skötrum", "required": {"strength": "law", "basis": "BFS 2024:12 2 kap. 7 §: if public toilets exist, at least one accessible. Public WCs are not strictly required by Bibliotekslagen, but FMH 35 § requires sufficient toilets where people stay for longer periods. See cross_cutting.json san_public and access_public_premises_wc.", "url": "https://rinfo.boverket.se/BFS2024-12/pdf/BFS2024-12.pdf"}, "size": {"rule": "per_building", "value_m2": null, "range_m2": null, "count": "no Swedish ratio found", "strength": "none", "source": "", "url": "", "confidence": "verified"}, "constraints": {"min_ceiling_height_mm": null, "daylight_required": false, "facade_required": false}, "depends_on": [], "shareable_with": ["shared_amenities", "community_hybrid", "assembly_event"], "shareable_note": "", "binding_constraint": "plumbing_shafts", "layer": "services", "notes": ""}, {"id": "library_back_office", "label_en": "Staff work room, media handling, staff facilities", "label_sv": "Personalutrymmen, mediehantering, arbetsrum", "required": {"strength": "law", "basis": "AFS 2023:12 staff facilities; see cross_cutting.json staff_facilities. IFLA 3.10.3: staff work space, break and meeting rooms, outreach and preparation areas.", "url": "https://www.av.se/globalassets/filer/publikationer/foreskrifter/utformning-av-arbetsplatser-afs2023-12.pdf"}, "size": {"rule": "per_unit", "value_m2": 16.3, "range_m2": null, "count": "per staff member (practice, foreign)", "strength": "practice", "source": "IFLA 2010 Appendix 4, p. 132 (Ontario 1997): 16.3 m2 (175 sq ft) per staff member, including workstations, service desks, circulation, lounge and lockers.", "url": "https://repository.ifla.org/items/83753461-738d-4a36-a18e-60a7ae8e6c64/full", "confidence": "sourced"}, "constraints": {"min_ceiling_height_mm": 2400, "daylight_required": true, "facade_required": false}, "depends_on": [], "shareable_with": ["office", "shared_amenities"], "shareable_note": "", "binding_constraint": "none", "layer": "space_plan", "notes": "Goods access for media deliveries and mobile library (bokbuss) where relevant."}, {"id": "library_support_nonassignable", "label_en": "Non-assignable space (WC, cleaning, plant, lifts, stairs)", "label_sv": "Övriga ytor (installationer, städ, kommunikation)", "required": {"strength": "practice", "basis": "IFLA Appendix 4 component (5).", "url": "https://repository.ifla.org/items/83753461-738d-4a36-a18e-60a7ae8e6c64/full"}, "size": {"rule": "derived", "value_m2": null, "range_m2": null, "count": "20 % of net space (items 1–4) per Ontario 1997; reduced where WCs and plant are shared with other tenants", "strength": "practice", "source": "IFLA 2010 Appendix 4, p. 132.", "url": "https://repository.ifla.org/items/83753461-738d-4a36-a18e-60a7ae8e6c64/full", "confidence": "sourced"}, "constraints": {"min_ceiling_height_mm": null, "daylight_required": false, "facade_required": false}, "depends_on": [], "shareable_with": ["shared_amenities"], "shareable_note": "IFLA explicitly notes the reduction when washrooms and mechanical areas are shared with another tenant.", "binding_constraint": "none", "layer": "services", "notes": ""}], "variants": [{"id": "library_branch", "label": "Branch library (filialbibliotek)", "changes": "Ontario example minimum 230 m2 plus 14 m2 per 1,000 volumes over 3,000 (IFLA App. 4, practice). Often combined with a medborgarkontor or träffpunkt (community_hybrid)."}, {"id": "library_main", "label": "Main / central library (huvudbibliotek)", "changes": "Ontario example minimum 370 m2 for an independent library; in practice much larger, with event hall, makerspace and café. Stack areas need E1 loads."}, {"id": "library_meroppet", "label": "Staff-less extended opening (meröppet)", "changes": "Access control at the entrance, CCTV, self-service. Extends hours with low occupancy. Fire safety and the occupant sign must work without staff (organisational fire safety under LSO; assessment, not sourced)."}], "conversion_from_office": {"typical_blockers": ["Floor load for stacks (E1, 5.0 kN/m2) and compact shelving vs office B (2.5 kN/m2), per BFS 2024:6 tabell 4:1.", "Vk 1 to Vk 2A/2B change: 30 m travel distance and, above 150 persons, fire alarm, evacuation alarm and emergency lighting (cross_cutting fire_vk_2abc).", "Upper-floor location weakens street presence; IFLA 3.10.4 asks for a visible entrance on the side most users approach."], "typical_enablers": ["Low design density (repealed advice 0.1 p/m2) means egress rarely binds outside event rooms.", "Deep office plans suit stacks in the interior and reading places along the facade.", "Office ceiling heights (about 2.6–2.7 m) are generally acceptable; there is no library-specific height rule.", "Ground-floor library plus shared meeting rooms is a classic mixed-use anchor."]}, "sources": [{"ref": "Bibliotekslag (2013:801) t.o.m. SFS 2024:1073, 2, 4–11, 17 §§", "url": "https://www.riksdagen.se/sv/dokument-och-lagar/dokument/svensk-forfattningssamling/bibliotekslag-2013801_sfs-2013-801/", "accessed": "2026-10-19"}, {"ref": "IFLA Public Library Service Guidelines, 2nd ed. (Koontz & Gubbin eds., 2010, IFLA Publications 147, CC BY 3.0): 3.10.2–3.10.5 (pp. 59–61); Appendix 4 'Library Building Standards – Ontario, Canada and Barcelona, Spain' (pp. 131–132)", "url": "https://repository.ifla.org/items/83753461-738d-4a36-a18e-60a7ae8e6c64/full", "accessed": "2026-10-19"}, {"ref": "BFS 2024:7 brandskydd: 2 kap. 3–4, 11–12 §§", "url": "https://lagen.nu/bfs/2024:7", "accessed": "2026-10-19"}, {"ref": "BFS 2024:12 tillgänglighet: 2 kap. 1, 7 §§; 3 kap. 6–7 §§", "url": "https://rinfo.boverket.se/BFS2024-12/pdf/BFS2024-12.pdf", "accessed": "2026-10-19"}, {"ref": "BFS 2024:6 4 kap. 10 § tabell 4:1 (via Boverket 'Nyttiga laster')", "url": "https://www.boverket.se/sv/PBL-kunskapsbanken/regler-om-byggande/barformaga-stadga-bestandighet/laster/nyttiga-laster/", "accessed": "2026-10-19"}, {"ref": "Old BBR (repealed BBR, pre-2025) tabell 5:333 (consolidated BBR p. 52)", "url": "https://rinfo.boverket.se/BFS2011-6/dok/BFS2024-5_konsolidering.pdf", "accessed": "2026-10-19"}], "open_questions": ["No Swedish space norm for folkbibliotek was found (KB, Svensk biblioteksförening and Kulturrådet searched; none surfaced). Check whether KB's folkbibliotek statistics include floor area per municipality, which would allow a Swedish empirical m2 per inhabitant.", "IFLA's Barcelona and Queensland standards are referenced in IFLA 3.10.2 but were not readable in the extracted text. Only the Ontario 1997 figures are recorded.", "Confirm the E1 classification for library stacks under BFS 2024:6 (Boverket guidance) and loads for compact shelving.", "Opening hours / hourly profile is a modelling assumption; KB statistics could give open hours per week."]}, "lss_group_home": {"id": "lss_group_home", "label_en": "LSS group home / service housing for adults with disabilities", "label_sv": "Bostad med särskild service för vuxna enligt LSS (gruppbostad / servicebostad)", "family": "care", "summary": "Housing under LSS 9 § 9 for adults with extensive disabilities. In a group home (gruppbostad) a few full apartments are grouped around a shared kitchen, dining and living room, with staff present around the clock. Two rules differ from SÄBO. First, each LSS apartment must be a FULL dwelling: BFS 2024:11 2 kap. 11 § forbids the shared-function rules (7-10 §§) for special housing for people with disabilities, so each apartment needs its own kitchen. Second, Socialstyrelsen advises 3-5 residents per group home, while municipal practice is 6. Fire class is normally 5B.", "regulatory": {"bbr_verksamhetsklass": "5B (gruppbostad); servicebostad case by case (3A/3B/3C/5B)", "bbr_verksamhetsklass_source": "BFS 2024:7 2 kap. 19 § (5B: dwellings and common spaces in needs-assessed special housing for people with limited or no ability to self-evacuate). Boverket PBL kunskapsbanken names SoL and LSS as the needs-assessment laws behind 5B. Stockholm stad checklista 2015 p. 9 (under the old BBR 5:215) says 5B applies to group homes with sprinkler. Class choice depends on residents' ability to evacuate, so servicebostäder for people who can self-evacuate may fall in 3A/3B/3C. Fire-engineering judgement is needed. Class details are in cross_cutting.json fire_vk_3abc / fire_vk_5abc.", "key_laws": [{"ref": "LSS (1993:387) 9 § p. 9: bostad med särskild service för vuxna eller annan särskilt anpassad bostad för vuxna. 7 §: goda levnadsvillkor. 9 e §: care (omvårdnad) included.", "url": "https://lagen.nu/1993:387"}, {"ref": "LSS 23 §: private for-profit providers need an IVO permit for insatser under 9 § p. 2-10", "url": "https://lagen.nu/1993:387"}, {"ref": "SOSFS 2002:9 (amended by HSLF-FS 2016:87), Socialstyrelsens föreskrifter och allmänna råd om bostad med särskild service för vuxna enligt LSS: 4-5 §§ (a named manager, with education requirements for group homes). Allmänna råd: 3-5 residents per group home, common rooms next to the apartments, no institutional character, not next to other such housing or SÄBO, not co-located with daily-activity premises.", "url": "https://www.socialstyrelsen.se/kunskapsstod-och-regler/regler-och-riktlinjer/foreskrifter-och-allmanna-rad/konsoliderade-foreskrifter/20029-om-bostad-med-sarskild-service-for-vuxna-enligt-9--9-lagen-1993387-om-stod-och-service-till-vissa-funktionshindrade-lss/"}, {"ref": "SoL (2025:400) 8 kap. 11 §: municipalities shall set up housing with special support (bostäder med särskilt stöd). This is the SoL route for similar housing, e.g. psychiatric disability.", "url": "https://lagen.nu/2025:400"}, {"ref": "BFS 2024:11 2 kap. 11 §: for special housing for people with reduced functional ability, 7-10 §§ (shared cooking, socialising, meals and hygiene) may NOT be applied, so every apartment is a full dwelling", "url": "https://rinfo.boverket.se/BFS2024-11/pdf/BFS2024-11.pdf"}, {"ref": "BFS 2024:12 2 kap. 9-10 §§, 3 kap. 2 §", "url": "https://rinfo.boverket.se/BFS2024-12/pdf/BFS2024-12.pdf"}, {"ref": "BFS 2024:7 (5B: sprinkler 7 kap. 48 §, own fire cell per dwelling 5 kap. 25 §, two escape doors 7 kap. 9 §)", "url": "https://rinfo.boverket.se/BFS2024-7/pdf/BFS2024-7.pdf"}, {"ref": "AFS 2023:12 3 kap. 64-65 §§: an on-call room (jourrum) where on-call duty in the sense of the Working Hours Act occurs. Common in group homes with sleeping night staff.", "url": "https://www.av.se/globalassets/filer/publikationer/foreskrifter/utformning-av-arbetsplatser-afs2023-12.pdf"}], "permits": ["Bygglov for change of use (PBL 9 kap. 15 § 1, from 2025-12-01). See cross_cutting.json cou_bygglov_trigger.", "IVO permit for private providers (LSS 23 §). For SoL housing with special support: IVO permit or notification (SoL 2025:400 26 kap. 1-2 §§)."], "operator_oversight": "IVO"}, "occupancy": {"unit": "resident", "group_size": {"value": 6, "range": [3, 6], "strength": "guidance", "source": "SOSFS 2002:9 allmänna råd: 'I en gruppbostad bör i regel endast tre till fem personer bo' (one more may be accepted if living conditions stay good, per Kunskapsguiden). Municipal practice is 6: Knivsta lokalfunktionsprogram 2024 p. 5 'Praxis för gruppbostad är sex (6) lägenheter'; Botkyrka 2017 p. 8, groups of 6; Stockholm checklista 2015 p. 3, six apartments.", "confidence": "verified"}, "gross_m2_per_unit": {"value": 92, "range": [67, 100], "strength": "programme", "source": "Stockholm stad Checklista gruppbostad LSS 2015 p. 3: usually about 400 m² for six apartments (about 67 m²/resident). Botkyrka 2017 p. 9: usually about 550 m² (about 92 m²/resident at 6). Knivsta SN-2024/143 p. 5: usually 550-600 m² (about 92-100 m²/resident).", "confidence": "verified", "notes": "The area standard (BTA/LOA) is not stated in the sources."}, "staff_per_unit": {"value": null, "strength": "programme", "source": "Stockholm checklista 2015 p. 2: staff provide support and service around the clock. Botkyrka p. 8: group home for people needing more or less continuous staff presence. No ratio found. It varies strongly with the residents' needs.", "confidence": "verified"}, "hours_profile": "24_7", "hourly_presence": [1, 1, 1, 1, 1, 1, 1, 0.9, 0.5, 0.3, 0.3, 0.3, 0.3, 0.3, 0.4, 0.6, 0.9, 1, 1, 1, 1, 1, 1, 1], "hourly_presence_note": "Residents, weekday, indicative. Knivsta p. 5: most residents attend daily activity (daglig verksamhet) on weekday daytime and come home in the afternoon. Weekends are close to 1.0. Staff are present 24/7."}, "spaces": [{"id": "lss_apartment", "label_en": "Resident apartment (full dwelling)", "label_sv": "Lägenhet (fullvärdig bostad)", "required": {"strength": "law", "basis": "LSS 9 § 9. BFS 2024:11 2 kap. 1 § and 2 kap. 11 § (no sharing of functions, so own kitchen, hygiene room and living space). BFS 2024:12 2 kap. 10 § (free space along both long sides and the foot of the bed).", "url": "https://rinfo.boverket.se/BFS2024-11/pdf/BFS2024-11.pdf"}, "size": {"rule": "per_unit", "value_m2": 40, "range_m2": [35, 45], "count": "1 per resident", "strength": "programme", "source": "Stockholm checklista 2015 p. 3: 35-45 m². Botkyrka 2017 p. 22: 37-45 m², lowest functional level 37 m², with separable sleeping area, full kitchen and own patio or balcony. Knivsta 2024 p. 22: about 40 m².", "url": "https://www.botkyrka.se/download/18.13554ca8173e7b670d1ec11/1598379351184/Riktlinjer%20f%C3%B6r%20lokalfunktionsprogram%20f%C3%B6r%20s%C3%A4rskilda%20boenden%20m%20m.pdf", "confidence": "verified"}, "constraints": {"daylight_required": true, "facade_required": true, "bed_clearance_both_sides_mm": 900, "hall_turning_diameter_mm": 1500, "ceiling_hoist": "prepared", "stove_guard": true}, "constraints_sources": "Botkyrka p. 22: 900 mm free on both sides of the bed in care position; hall turning 1300 mm minimum, preferably 1500 mm; all apartments prepared for ceiling hoist; stove guard and timer outlets. Stockholm checklista p. 5: bed angled from the wall with 900 mm passage at the foot. Stockholm p. 3 also notes the old BBR 3:223 rule (dwellings of at most 55 m² must have a separable sleeping or cooking area), which is repealed BBR, pre-2025.", "depends_on": ["lss_bathroom"], "binding_constraint": "facade_length_and_drainage", "layer": "space_plan", "notes": "Residents' medicines are kept in a locked cabinet in each apartment, not in a central medication room (Stockholm checklista p. 9; Botkyrka p. 22)."}, {"id": "lss_bathroom", "label_en": "Apartment bathroom (accessible, assisted)", "label_sv": "Hygienrum i lägenhet", "required": {"strength": "law", "basis": "BFS 2024:11 2 kap. 3 § and 11 § (no shared hygiene rooms). BFS 2024:12 2 kap. 9 § (accessible hygiene room).", "url": "https://rinfo.boverket.se/BFS2024-11/pdf/BFS2024-11.pdf"}, "size": {"rule": "per_unit", "value_m2": 6.5, "count": "1 per apartment (included in apartment area)", "strength": "programme", "source": "Botkyrka 2017 p. 23: bathrooms 2.4 x 2.7 m with room to assist on both sides of WC and shower (for both SÄBO and LSS apartments). Stockholm checklista p. 6: room for an assisting person on both sides of the WC, 1500 mm turning diameter, space for washer/dryer.", "confidence": "verified"}, "constraints": {"floor_drain_required": true, "ceiling_hoist": "prepared"}, "binding_constraint": "drainage_and_shafts", "layer": "services"}, {"id": "lss_apartment_balcony", "label_en": "Private balcony / patio", "label_sv": "Egen balkong / uteplats", "required": {"strength": "programme", "basis": "Botkyrka 2017 p. 8 and 22: own patio or balcony shall exist. Stockholm checklista p. 6: max 2.5 cm level difference.", "url": "https://www.botkyrka.se/download/18.13554ca8173e7b670d1ec11/1598379351184/Riktlinjer%20f%C3%B6r%20lokalfunktionsprogram%20f%C3%B6r%20s%C3%A4rskilda%20boenden%20m%20m.pdf"}, "size": {"rule": "per_unit", "value_m2": null, "strength": "none", "source": "no m² found", "confidence": "verified"}, "constraints": {"facade_required": true}, "binding_constraint": "structure_new_balcony", "layer": "skin"}, {"id": "lss_apartment_storage", "label_en": "Resident storage", "label_sv": "Lägenhetsförråd", "required": {"strength": "law", "basis": "BFS 2024:11 2 kap. 5 § (storage function; may be outside the dwelling). Stockholm checklista p. 7: every apartment shall have a storage space.", "url": "https://rinfo.boverket.se/BFS2024-11/pdf/BFS2024-11.pdf"}, "size": {"rule": "per_unit", "value_m2": 2, "count": "1 per apartment plus 1 for the group home", "strength": "programme", "source": "Botkyrka 2017 p. 25: at least 2 m² for group homes. Knivsta 2024: at least 2 m².", "confidence": "verified"}, "layer": "space_plan"}, {"id": "lss_common_kitchen_living", "label_en": "Common kitchen, dining and living room", "label_sv": "Gemensamt kök, matplats och vardagsrum", "required": {"strength": "guidance", "basis": "SOSFS 2002:9 allmänna råd (Gemensamhetslokaler i gruppbostaden): common rooms in close or direct connection to the apartments, easy to reach, used only by residents and staff. Programme: Stockholm p. 7 and Botkyrka p. 9.", "url": "https://www.socialstyrelsen.se/kunskapsstod-och-regler/regler-och-riktlinjer/foreskrifter-och-allmanna-rad/konsoliderade-foreskrifter/20029-om-bostad-med-sarskild-service-for-vuxna-enligt-9--9-lagen-1993387-om-stod-och-service-till-vissa-funktionshindrade-lss/"}, "size": {"rule": "per_group", "value_m2": null, "count": "1 per group home; seats 8-10 persons", "strength": "programme", "source": "Stockholm checklista 2015 p. 3 and 7: kitchen, meals and socialising for 8-10 persons, separate staff hand-wash basin. All common housing functions (common room with kitchen, laundry, apartment and wheelchair stores) together about 100 m². No separate m² for the kitchen-living room alone.", "confidence": "verified"}, "constraints": {"daylight_required": true, "facade_required": true}, "depends_on": ["lss_common_terrace"], "binding_constraint": "acoustics_and_daylight", "layer": "space_plan"}, {"id": "lss_common_terrace", "label_en": "Common balcony / patio and garden", "label_sv": "Gemensam balkong/uteplats, utemiljö", "required": {"strength": "programme", "basis": "Stockholm checklista p. 8: directly next to the common room. Knivsta 2024: outdoor environment adapted to residents.", "url": "https://insynsverige.se/documentHandler.ashx?did=1821755"}, "size": {"rule": "per_group", "value_m2": null, "strength": "none", "source": "no m² found", "confidence": "verified"}, "layer": "site"}, {"id": "lss_laundry", "label_en": "Laundry room within group home", "label_sv": "Tvättutrymme", "required": {"strength": "programme", "basis": "Stockholm checklista p. 7: one washer and one dryer on plinths, folding bench, reached from the group home corridor. Apartments also prepared for their own machines. BFS 2024:11 2 kap. 4 § allows shared laundry.", "url": "https://insynsverige.se/documentHandler.ashx?did=1821755"}, "size": {"rule": "per_group", "value_m2": null, "strength": "none", "source": "included in the about 100 m² of common functions (Stockholm)", "confidence": "verified"}, "layer": "services"}, {"id": "lss_wheelchair_store", "label_en": "Wheelchair / aids store with charging and rinse", "label_sv": "Rullstolsförråd", "required": {"strength": "programme", "basis": "Stockholm checklista p. 5: room for 4 wheelchairs, charging at 800 mm, hot and cold water for rinsing, floor drain with grit trap.", "url": "https://insynsverige.se/documentHandler.ashx?did=1821755"}, "size": {"rule": "per_group", "value_m2": null, "count": "dimensioned for 4 chairs", "strength": "none", "source": "capacity given, not m²", "confidence": "verified"}, "constraints": {"floor_drain_required": true}, "layer": "space_plan"}, {"id": "lss_cleaning_store", "label_en": "Cleaning store / near store", "label_sv": "Städförråd och närförråd", "required": {"strength": "programme", "basis": "Stockholm checklista p. 7-8: slop sink, shelving. May be combined with the laundry.", "url": "https://insynsverige.se/documentHandler.ashx?did=1821755"}, "size": {"rule": "per_group", "value_m2": null, "strength": "none", "source": "no m² found", "confidence": "verified"}, "layer": "services"}, {"id": "lss_staff_office", "label_en": "Staff office (expedition)", "label_sv": "Expedition / kontor", "required": {"strength": "programme", "basis": "Stockholm checklista p. 8; Botkyrka p. 9. Fire alarm panel placed here (Stockholm p. 9).", "url": "https://insynsverige.se/documentHandler.ashx?did=1821755"}, "size": {"rule": "per_group", "value_m2": null, "strength": "none", "source": "Part of about 40 m² for all staff spaces (Stockholm p. 3).", "confidence": "verified"}, "layer": "space_plan"}, {"id": "lss_staff_oncall_room", "label_en": "On-call / rest room for staff", "label_sv": "Jourrum / vilrum", "required": {"strength": "law", "basis": "AFS 2023:12 3 kap. 63 § (rest space), 64 § (on-call room as single room near the main workplace where on-call duty occurs), 65 § (food heating, WC and shower nearby).", "url": "https://www.av.se/globalassets/filer/publikationer/foreskrifter/utformning-av-arbetsplatser-afs2023-12.pdf"}, "size": {"rule": "per_group", "value_m2": null, "strength": "none", "source": "No m². Stockholm p. 8: bed, bedside table, wardrobes, near the WC.", "confidence": "verified"}, "layer": "space_plan"}, {"id": "lss_staff_changing_wc_shower", "label_en": "Staff changing, WC with shower", "label_sv": "Omklädning, personaltoalett med dusch", "required": {"strength": "law", "basis": "AFS 2023:12 3 kap. 40-58 §§ (general staff-facility rules in cross_cutting.json staff_*). Stockholm p. 8: staff WC with shower near the on-call room.", "url": "https://www.av.se/globalassets/filer/publikationer/foreskrifter/utformning-av-arbetsplatser-afs2023-12.pdf"}, "size": {"rule": "per_group", "value_m2": 40, "count": "all staff spaces together (office, on-call/rest, changing, WC/shower)", "strength": "programme", "source": "Stockholm stad checklista gruppbostad LSS 2015 p. 3: staff work room, rest/on-call room, changing and hygiene, 'Sammanlagt cirka 40 kvm'.", "confidence": "verified"}, "layer": "space_plan"}, {"id": "lss_visitor_wc", "label_en": "Visitors' accessible WC (servicebostad common room)", "label_sv": "RWC för besökare", "required": {"strength": "programme", "basis": "Stockholm checklista p. 10: RWC for visitors in the common premises for service apartments.", "url": "https://insynsverige.se/documentHandler.ashx?did=1821755"}, "size": {"rule": "fixed", "value_m2": null, "strength": "none", "source": "no m²; see cross_cutting.json san_public for the 2.2 x 2.2 m planning value", "confidence": "verified"}, "layer": "services"}], "variants": [{"id": "servicebostad", "label": "Service housing (servicebostad)", "changes": "Ordinary-standard apartments spread among other apartments, plus a common room for socialising and meetings with staff for a group of up to about 15 residents, and a visitors' RWC (Stockholm checklista 2015 p. 10). SOSFS 2002:9: number of residents limited so the housing blends into the neighbourhood. Fire class may be lower than 5B depending on residents."}, {"id": "sol_bostad_sarskilt_stod", "label": "SoL housing with special support (SoL 2025:400 8 kap. 11 §)", "changes": "Similar physical brief, e.g. for psychiatric disability. LSS-specific Socialstyrelsen advice (SOSFS 2002:9) does not apply. Whether BFS 2024:11 2 kap. 11 § ('särskilda bostäder för personer med nedsatt funktionsförmåga') covers it should be checked."}, {"id": "group_home_in_villa", "label": "Detached-house group home", "changes": "Same brief on one storey (Knivsta norm). Own entrance."}], "conversion_from_office": {"typical_blockers": ["Full kitchen and bathroom in every apartment (BFS 2024:11 2 kap. 11 §): drainage, ventilation and shafts at every unit.", "5B: sprinkler, own fire cell per apartment, two escape routes; cannot be waived on change of use (see cross_cutting.json).", "SOSFS 2002:9 advises against institutional settings and against co-location with other special housing or daily-activity premises. A large office building converted into several group homes conflicts with this.", "Programmes want the whole group home on one floor (Knivsta) or at most two apartments on an adjacent floor (Stockholm p. 3), which needs about 400-600 m² on one floor."], "typical_enablers": ["A floor plate of 400-600 m² fits one group home. Office floors of that size are common.", "An office building in a mixed housing area meets the 'integrated in ordinary housing' advice.", "Ground floor with direct garden access (Stockholm p. 3: raised ground floor has advantages for noise and evacuation)."]}, "sources": [{"ref": "LSS (1993:387) 7, 9, 9 e, 23 §§ (lagen.nu)", "url": "https://lagen.nu/1993:387", "accessed": "2026-10-19"}, {"ref": "SOSFS 2002:9 consolidated (Socialstyrelsen)", "url": "https://www.socialstyrelsen.se/kunskapsstod-och-regler/regler-och-riktlinjer/foreskrifter-och-allmanna-rad/konsoliderade-foreskrifter/20029-om-bostad-med-sarskild-service-for-vuxna-enligt-9--9-lagen-1993387-om-stod-och-service-till-vissa-funktionshindrade-lss/", "accessed": "2026-10-19"}, {"ref": "Kunskapsguiden: Boendealternativ för vuxna enligt LSS", "url": "https://kunskapsguiden.se/omraden-och-teman/funktionshinder/boende-for-personer-med-funktionsnedsattning/bostad-med-sarskild-service-for-vuxna-eller-annan-sarskilt-anpassad-bostad-for-vuxna/", "accessed": "2026-10-19"}, {"ref": "Socialtjänstlag (2025:400) 8 kap. 11 §, 26 kap.", "url": "https://lagen.nu/2025:400", "accessed": "2026-10-19"}, {"ref": "BFS 2024:11 bostäders lämplighet (2 kap. 11 §)", "url": "https://rinfo.boverket.se/BFS2024-11/pdf/BFS2024-11.pdf", "accessed": "2026-10-19"}, {"ref": "BFS 2024:12 tillgänglighet och användbarhet", "url": "https://rinfo.boverket.se/BFS2024-12/pdf/BFS2024-12.pdf", "accessed": "2026-10-19"}, {"ref": "BFS 2024:7 brandskydd", "url": "https://rinfo.boverket.se/BFS2024-7/pdf/BFS2024-7.pdf", "accessed": "2026-10-19"}, {"ref": "AFS 2023:12 Utformning av arbetsplatser, 3 kap. 63-65 §§", "url": "https://www.av.se/globalassets/filer/publikationer/foreskrifter/utformning-av-arbetsplatser-afs2023-12.pdf", "accessed": "2026-10-19"}, {"ref": "Stockholms stad, Lokalplanerarna: Checklista vid planering av gruppbostad för boende enligt LSS (2015). Cites the old BBR, pre-2025.", "url": "https://insynsverige.se/documentHandler.ashx?did=1821755", "accessed": "2026-10-19"}, {"ref": "Knivsta kommun, Lokalfunktionsprogram gruppbostad LSS, SN-2024/143 (2024-05-24)", "url": "https://knivstakommun.ondemand.formpipe.com/welcome-sv/namnder-styrelser/kommunstyrelsen/kommunstyrelsen-2025-03-31/agenda/sn-2024143-lokalfunktionsprogram-gruppbostad-lsspdf?downloadMode=open", "accessed": "2026-10-19"}, {"ref": "Botkyrka kommun, Lokalfunktionsprogram för särskilda boenden (SoL och LSS), von/2017:158 (valid to 2021)", "url": "https://www.botkyrka.se/download/18.13554ca8173e7b670d1ec11/1598379351184/Riktlinjer%20f%C3%B6r%20lokalfunktionsprogram%20f%C3%B6r%20s%C3%A4rskilda%20boenden%20m%20m.pdf", "accessed": "2026-10-19"}], "open_questions": ["Socialstyrelsen advises 3-5 residents (SOSFS 2002:9), but every checked municipal programme uses 6. The fit test should flag 6 as 'deviation from guidance, accepted practice'.", "Fire class for servicebostad and for group homes whose residents can self-evacuate (3B/3C vs 5B). Needs case-by-case fire-engineering judgement.", "Whether BFS 2024:11 2 kap. 11 § ('särskilda bostäder för personer med nedsatt funktionsförmåga') also covers SoL 8 kap. 11 § housing.", "No source gives a staff ratio or m² for the common kitchen and living room alone. Stockholm gives only about 100 m² total for common functions.", "SOSFS 2002:9 dates from 2002 (amended 2016). Check whether Socialstyrelsen plans an HSLF-FS replacement."]}, "office": {"id": "office", "label_en": "Office", "label_sv": "Kontor", "family": "work", "summary": "Workplace for desk-based work. Variants: cellular (cellkontor), open-plan (kontorslandskap) and activity-based (aktivitetsbaserat kontor, ABW). Swedish law (AFS 2023:12, in force 1 Jan 2025, replacing AFS 2020:1) requires the staff functions (WC, eating, pause, rest, clothes storage, drinking water), outdoor air of 7 l/s per person + 0.35 l/s per m2, and daylight and view, but sets almost no room sizes. Size benchmarks come from state office policy (15 m2 per employee) rather than law.", "regulatory": {"bbr_verksamhetsklass": "1 — BFS 2024:7 2 kap. 10 § names 'kontor' explicitly (people with good knowledge of the premises, able to evacuate themselves, awake). BFS 2024:7 replaced BBR section 5 from 1 Jul 2025; the transition period allowing BBR ended 30 Jun 2026.", "key_laws": [{"ref": "AFS 2023:12 Utformning av arbetsplatser (Arbetsmiljöverket), in force 1 Jan 2025", "url": "https://www.av.se/globalassets/filer/publikationer/foreskrifter/utformning-av-arbetsplatser-afs2023-12.pdf"}, {"ref": "Arbetsmiljölagen (1977:1160)", "url": "https://www.riksdagen.se/sv/dokument-och-lagar/dokument/svensk-forfattningssamling/arbetsmiljolag-19771160_sfs-1977-1160/"}, {"ref": "BFS 2024:7 Boverkets föreskrifter och allmänna råd om säkerhet i händelse av brand i byggnader", "url": "https://rinfo.boverket.se/BFS2024-7/pdf/BFS2024-7.pdf"}, {"ref": "BFS 2024:8 Boverkets föreskrifter om skydd med hänsyn till hygien, hälsa och miljö samt hushållning med vatten och avfall", "url": "https://rinfo.boverket.se/BFS2024-8/pdf/BFS2024-8.pdf"}, {"ref": "BFS 2024:12 Boverkets föreskrifter om byggnaders tillgänglighet och användbarhet", "url": "https://rinfo.boverket.se/BFS2024-12/pdf/BFS2024-12.pdf"}], "permits": ["Usually none if the building is already office; otherwise bygglov for change of use, PBL 9 kap. 15 § 1 since 2025-12-01 (formerly 9 kap. 2 § 3 a) — see cross_cutting.json cou_bygglov_trigger.", "Detaljplan must allow Kontor (K) or Centrum (C) — see Boverket PBL kunskapsbanken on användning av kvartersmark.", "Anmälan (PBF 6 kap. 1 §, see cross_cutting.json cou_anmalan) for new/changed ventilation, VA installations or fire-safety-relevant changes."], "cross_cutting_refs": ["cou_bygglov_trigger", "cou_anmalan", "fire_vk_1", "staff_personalutrymmen_general", "staff_eating_rest", "staff_room_height_daylight", "san_workplace", "vent_workplace", "loads_imposed_table_4_1"], "operator_oversight": "Arbetsmiljöverket (work environment); kommunens byggnadsnämnd (building permits, OVK)"}, "occupancy": {"unit": "workplace", "gross_m2_per_unit": {"value": 15, "range": [12, 22], "strength": "programme", "source": "Riksrevisionen RiR 2025:17 'Kostsam kvadratjakt' sect. 4.1.1–4.1.2: state office agencies averaged 22 m2 office area per employee in 2023 (28 in 2014); 15 m2 per employee used as reference (upper limit of agency strategies; Skatteverket targets 12–14 m2). Regeringens skrivelse 2025/26:65 sect. 3.1 finds 15 m2 per employee a reasonable starting point. Area includes workstations, support areas, WC, meeting and conference rooms.", "confidence": "sourced", "note": "Measured per employee, not per desk. For ABW, desks are often provisioned for ~75 % of staff (CAMM faktablad, p. 3), so m2 per desk is higher than m2 per employee."}, "staff_per_unit": {"value": null, "strength": "none", "source": "Occupants are the staff; desk-sharing ratio is the relevant parameter (ABW ~0.75 desks per employee, CAMM faktablad p. 3)."}, "egress_design_density": {"persons_per_m2": null, "strength": "law", "source": "BFS 2024:7 2 kap. 4 §: design occupancy = maximum number of persons expected given intended use and room size; default densities are given only for affärslokal (0.5), pub/bar (3) and samlingslokal (2.5 persons/m2), none for offices. Use the furnished workplace count plus meeting-room seats.", "url": "https://rinfo.boverket.se/BFS2024-7/pdf/BFS2024-7.pdf", "confidence": "verified"}, "hours_profile": "office_hours", "hourly_presence": [0, 0, 0, 0, 0, 0, 0.02, 0.15, 0.5, 0.7, 0.7, 0.6, 0.5, 0.65, 0.7, 0.6, 0.4, 0.15, 0.05, 0.02, 0, 0, 0, 0], "hourly_presence_note": "Modelling assumption (indicative). Peak ~0.7 of staff present follows CAMM faktablad p. 3 ('cirka 70 procent av arbetskraften i genomsnitt befinner sig på kontoret en vanlig dag'); hourly shape is not sourced. Weekend ~0."}, "spaces": [{"id": "office_workplaces", "label_en": "Workplaces (desks, open-plan or cellular)", "label_sv": "Arbetsplatser (kontorslandskap/cellkontor)", "required": {"strength": "law", "basis": "AFS 2023:12 3 kap. 5 § — workplaces shall have sufficient area and free height for the activity; 3 kap. 6 § sufficient freedom of movement.", "url": "https://www.av.se/globalassets/filer/publikationer/foreskrifter/utformning-av-arbetsplatser-afs2023-12.pdf"}, "size": {"rule": "per_unit", "value_m2": null, "range_m2": null, "count": "number of workplaces (ABW: ~0.75 x employees per CAMM faktablad p. 3)", "strength": "none", "source": "AFS 2023:12 sets no m2 per workplace (functional requirement only). Whole-office benchmark see occupancy.gross_m2_per_unit.", "url": "https://www.av.se/globalassets/filer/publikationer/foreskrifter/utformning-av-arbetsplatser-afs2023-12.pdf", "confidence": "verified"}, "constraints": {"min_ceiling_height_mm": 2400, "daylight_required": true, "facade_required": true}, "depends_on": ["office_ventilation"], "shareable_with": ["coworking"], "shareable_note": "Desks can be shared with coworking members or other tenants outside the tenant's core hours.", "binding_constraint": "daylight_and_view", "layer": "space_plan", "notes": "Ceiling height: AFS 2023:12 3 kap. 5 § allmänna råd — room height should be at least 2.40 m (2.70 m in rooms for many persons, e.g. teaching; locally 2.10 m where standing height is needed). Daylight and view: AFS 2023:12 5 kap. 25 § (law) — workplaces shall give satisfactory daylight and view during the working day; if not reasonable, compensating measures; allmänna råd points to SS-EN 17037:2018 for assessment methods. BFS 2024:8 4 kap. 3 § also requires rooms in lokaler where people stay more than temporarily to have sufficient daylight and view. No numeric daylight factor is set for offices in either text (the 2 % in space_requirements.json is not a legal value)."}, {"id": "office_ventilation", "label_en": "Ventilation capacity (outdoor air supply)", "label_sv": "Ventilation (uteluftsflöde)", "required": {"strength": "law", "basis": "AFS 2023:12 5 kap. 4 § — indoor workplaces shall normally be supplied with at least 7 l/s outdoor air per person plus at least 0.35 l/s per m2 floor area during working hours; allmänna råd: 7 l/s applies to sedentary work, higher activity may need more. 5 kap. 3 § allmänna råd: air-change effectiveness should be at least 40 %.", "url": "https://www.av.se/globalassets/filer/publikationer/foreskrifter/utformning-av-arbetsplatser-afs2023-12.pdf"}, "size": {"rule": "derived", "value_m2": null, "range_m2": null, "count": "airflow l/s = 7 x persons + 0.35 x m2 floor area", "strength": "law", "source": "AFS 2023:12 5 kap. 4 § (verified against PDF p. 39). BFS 2024:8 3 kap. 4–5 §§ give only functional requirements for lokaler (numeric values only for dwellings).", "url": "https://www.av.se/globalassets/filer/publikationer/foreskrifter/utformning-av-arbetsplatser-afs2023-12.pdf", "confidence": "verified"}, "constraints": {"min_ceiling_height_mm": null, "daylight_required": false, "facade_required": false}, "depends_on": [], "shareable_with": [], "shareable_note": "", "binding_constraint": "ventilation", "layer": "services", "notes": "Densification (e.g. ABW, coworking) raises per-person airflow demand; small enclosed rooms (focus rooms, phone booths, meeting rooms) are where retrofit ventilation typically fails. Plant-room area is not regulated."}, {"id": "office_meeting", "label_en": "Meeting rooms", "label_sv": "Mötesrum", "required": {"strength": "practice", "basis": "Not required by law; standard part of office programmes.", "url": ""}, "size": {"rule": "per_building", "value_m2": null, "range_m2": null, "count": "operator-specific", "strength": "none", "source": "No Swedish public source found for m2 per meeting seat.", "url": "", "confidence": "indicative"}, "constraints": {"min_ceiling_height_mm": 2400, "daylight_required": false, "facade_required": false}, "depends_on": ["office_ventilation"], "shareable_with": ["coworking"], "shareable_note": "Bookable by other tenants or coworking members.", "binding_constraint": "ventilation", "layer": "space_plan", "notes": "Rooms for larger groups: AFS 2023:12 3 kap. 5 § allmänna råd suggests 2.70 m room height for rooms intended for many persons. A conference room for >150 persons would be verksamhetsklass 2B (BFS 2024:7 2 kap. 12 §). Hearing loop: BFS 2024:12 3 kap. 6 § requires sound transfer to hearing aids in samlingssalar and receptions in publika lokaler (new build)."}, {"id": "office_quiet_room", "label_en": "Quiet / focus rooms", "label_sv": "Tysta rum", "required": {"strength": "guidance", "basis": "AFS 2023:12 3 kap. 2 § — workplaces shall have the rooms needed for the activity; allmänna råd names 'tysta rum' as an example.", "url": "https://www.av.se/globalassets/filer/publikationer/foreskrifter/utformning-av-arbetsplatser-afs2023-12.pdf"}, "size": {"rule": "per_building", "value_m2": null, "range_m2": null, "count": "need-based; more critical in open-plan and ABW", "strength": "none", "source": "No size or ratio in AFS 2023:12.", "url": "", "confidence": "verified"}, "constraints": {"min_ceiling_height_mm": 2400, "daylight_required": false, "facade_required": false}, "depends_on": ["office_ventilation"], "shareable_with": ["coworking"], "shareable_note": "", "binding_constraint": "ventilation", "layer": "space_plan", "notes": "If used as a permanent workplace the daylight/view requirement (AFS 2023:12 5 kap. 25 §) applies; short-term focus rooms are usually treated as temporary-use rooms (assessment, not stated in the text)."}, {"id": "office_eating_room", "label_en": "Eating room / staff kitchen", "label_sv": "Matutrymme / personalrum med pentry", "required": {"strength": "law", "basis": "AFS 2023:12 3 kap. 60 § — employees shall be able to eat in suitable rooms with tables and chairs with backrests (also those eating brought food); 61 § — near the place where brought food is eaten there shall be a refrigerator, means to heat food and to wash dishes. 36 § — drinking water near workplaces and eating areas.", "url": "https://www.av.se/globalassets/filer/publikationer/foreskrifter/utformning-av-arbetsplatser-afs2023-12.pdf"}, "size": {"rule": "per_unit", "value_m2": null, "range_m2": null, "count": "seats for those eating simultaneously (3 kap. 38 §: sized to number normally using it at the same time)", "strength": "none", "source": "AFS 2023:12 gives no m2 figure.", "url": "https://www.av.se/globalassets/filer/publikationer/foreskrifter/utformning-av-arbetsplatser-afs2023-12.pdf", "confidence": "verified"}, "constraints": {"min_ceiling_height_mm": 2400, "daylight_required": true, "facade_required": false}, "depends_on": [], "shareable_with": ["restaurant_cafe", "coworking", "food_hall"], "shareable_note": "Allmänna råd to 3 kap. 60 § names a restaurant as an example of a suitable eating place — a staff restaurant or nearby restaurant can partly substitute, but 61 § still requires fridge/heating/dishwashing near where brought food is eaten.", "binding_constraint": "none", "layer": "space_plan", "notes": "Must not connect directly to a WC (3 kap. 57 §). daylight_required here reflects that it is a room where people stay more than temporarily (BFS 2024:8 4 kap. 3 §); AFS does not specifically require daylight in eating rooms beyond 5 kap. 25 §."}, {"id": "office_pause", "label_en": "Pause / break area", "label_sv": "Pausutrymme", "required": {"strength": "law", "basis": "AFS 2023:12 3 kap. 62 § — place for pauses with possibility for short recovery and enough seats with backrests.", "url": "https://www.av.se/globalassets/filer/publikationer/foreskrifter/utformning-av-arbetsplatser-afs2023-12.pdf"}, "size": {"rule": "per_building", "value_m2": null, "range_m2": null, "count": "", "strength": "none", "source": "No size in AFS 2023:12.", "url": "", "confidence": "verified"}, "constraints": {"min_ceiling_height_mm": 2400, "daylight_required": false, "facade_required": false}, "depends_on": [], "shareable_with": ["coworking"], "shareable_note": "Usually combined with the eating room.", "binding_constraint": "none", "layer": "space_plan", "notes": ""}, {"id": "office_rest_room", "label_en": "Rest space / rest room", "label_sv": "Vilutrymme / vilrum", "required": {"strength": "law", "basis": "AFS 2023:12 3 kap. 63 § — there shall be, or be quickly arrangeable, a suitable rest space for temporary, undisturbed, lying rest. Allmänna råd: a separate vilrum may be needed when more than 50 persons are employed simultaneously in the same area; a WC should be nearby.", "url": "https://www.av.se/globalassets/filer/publikationer/foreskrifter/utformning-av-arbetsplatser-afs2023-12.pdf"}, "size": {"rule": "per_building", "value_m2": null, "range_m2": null, "count": "1 (dedicated room typically when >50 simultaneously employed — guidance)", "strength": "none", "source": "No size in AFS 2023:12.", "url": "", "confidence": "verified"}, "constraints": {"min_ceiling_height_mm": null, "daylight_required": false, "facade_required": false}, "depends_on": ["office_wc"], "shareable_with": ["coworking"], "shareable_note": "Can be shared between tenants in a multi-tenant building if easily accessible.", "binding_constraint": "none", "layer": "space_plan", "notes": ""}, {"id": "office_wc", "label_en": "WCs incl. accessible WC", "label_sv": "Toaletter inkl. tillgänglig toalett", "required": {"strength": "law", "basis": "AFS 2023:12 3 kap. 56 § sufficient WCs and washbasins near workplaces/pause rooms; 57 § sufficiently large, separate, lockable, washbasin, no direct connection to eating room; 58 § accessible WCs at existing workplaces for those who need them; 3 kap. 4 § p. 6 — when designing new build/ombyggnad at least one accessible WC per storey.", "url": "https://www.av.se/globalassets/filer/publikationer/foreskrifter/utformning-av-arbetsplatser-afs2023-12.pdf"}, "size": {"rule": "per_unit", "value_m2": 4.84, "range_m2": null, "count": "1 WC per started 15 employees (allmänna råd to 3 kap. 56 §); at least one accessible WC per storey at new build/ombyggnad (3 kap. 4 §)", "strength": "guidance", "source": "AFS 2023:12 3 kap. 58 § allmänna råd: an accessible toilet should be at least 2.2 x 2.2 m (= 4.84 m2), larger if assistants/aids needed; alarm recommended. Ordinary WC size not given.", "url": "https://www.av.se/globalassets/filer/publikationer/foreskrifter/utformning-av-arbetsplatser-afs2023-12.pdf", "confidence": "verified"}, "constraints": {"min_ceiling_height_mm": null, "daylight_required": false, "facade_required": false}, "depends_on": [], "shareable_with": ["coworking"], "shareable_note": "", "binding_constraint": "plumbing_shafts", "layer": "services", "notes": "value_m2 refers to the accessible WC only."}, {"id": "office_clothes_storage", "label_en": "Clothes and valuables storage", "label_sv": "Förvaring av kläder och värdesaker", "required": {"strength": "law", "basis": "AFS 2023:12 3 kap. 40 § storage for private clothes for all who need it at the same time; 41 § lockable storage for personal valuables.", "url": "https://www.av.se/globalassets/filer/publikationer/foreskrifter/utformning-av-arbetsplatser-afs2023-12.pdf"}, "size": {"rule": "per_unit", "value_m2": null, "range_m2": null, "count": "per employee present simultaneously", "strength": "none", "source": "No size in AFS 2023:12.", "url": "", "confidence": "verified"}, "constraints": {"min_ceiling_height_mm": null, "daylight_required": false, "facade_required": false}, "depends_on": [], "shareable_with": [], "shareable_note": "", "binding_constraint": "none", "layer": "stuff", "notes": "In ABW typically lockers. Changing rooms (3 kap. 46 §) are required only for dirty/sweaty work or special work clothes — normally not for office work; showers/changing for cycling commuters are practice, not law."}, {"id": "office_cleaning_service", "label_en": "Cleaning and building-service room", "label_sv": "Städ- och fastighetsserviceutrymme", "required": {"strength": "guidance", "basis": "AFS 2023:12 3 kap. 2 § allmänna råd names spaces for property maintenance and service as examples of rooms that may be needed.", "url": "https://www.av.se/globalassets/filer/publikationer/foreskrifter/utformning-av-arbetsplatser-afs2023-12.pdf"}, "size": {"rule": "per_building", "value_m2": null, "range_m2": null, "count": "", "strength": "none", "source": "", "url": "", "confidence": "verified"}, "constraints": {"min_ceiling_height_mm": null, "daylight_required": false, "facade_required": false}, "depends_on": [], "shareable_with": ["coworking", "retail_shop"], "shareable_note": "Building-level shared service.", "binding_constraint": "none", "layer": "space_plan", "notes": ""}, {"id": "office_print_room", "label_en": "Print / copy room", "label_sv": "Kopieringsrum", "required": {"strength": "guidance", "basis": "AFS 2023:12 3 kap. 7 § — processes with particular risk normally in separate room; allmänna råd names copying machines (and fans, charging batteries, dishwashers) as examples that may need a separate room.", "url": "https://www.av.se/globalassets/filer/publikationer/foreskrifter/utformning-av-arbetsplatser-afs2023-12.pdf"}, "size": {"rule": "per_building", "value_m2": null, "range_m2": null, "count": "", "strength": "none", "source": "", "url": "", "confidence": "verified"}, "constraints": {"min_ceiling_height_mm": null, "daylight_required": false, "facade_required": false}, "depends_on": ["office_ventilation"], "shareable_with": ["coworking"], "shareable_note": "", "binding_constraint": "ventilation", "layer": "space_plan", "notes": ""}, {"id": "office_waste", "label_en": "Waste room", "label_sv": "Avfallsutrymme", "required": {"strength": "law", "basis": "BFS 2024:8 11 kap. 1–3 §§ — waste shall be manageable in or next to the building; waste devices or waste rooms located, designed and dimensioned for hygiene and collection.", "url": "https://rinfo.boverket.se/BFS2024-8/pdf/BFS2024-8.pdf"}, "size": {"rule": "per_building", "value_m2": null, "range_m2": null, "count": "", "strength": "none", "source": "BFS 2024:8 has no m2; municipal waste regulations (renhållningsföreskrifter) set collection conditions.", "url": "https://rinfo.boverket.se/BFS2024-8/pdf/BFS2024-8.pdf", "confidence": "verified"}, "constraints": {"min_ceiling_height_mm": null, "daylight_required": false, "facade_required": false}, "depends_on": [], "shareable_with": ["coworking", "retail_shop"], "shareable_note": "Usually a building-level shared room.", "binding_constraint": "site_access", "layer": "site", "notes": ""}, {"id": "office_reception", "label_en": "Reception / entrance", "label_sv": "Reception / entré", "required": {"strength": "practice", "basis": "Not required by law; accessible main entrance required for new build (BFS 2024:12 2 kap. 1 §).", "url": "https://rinfo.boverket.se/BFS2024-12/pdf/BFS2024-12.pdf"}, "size": {"rule": "per_building", "value_m2": null, "range_m2": null, "count": "", "strength": "none", "source": "", "url": "", "confidence": "indicative"}, "constraints": {"min_ceiling_height_mm": null, "daylight_required": false, "facade_required": true}, "depends_on": [], "shareable_with": ["coworking"], "shareable_note": "", "binding_constraint": "accessibility", "layer": "space_plan", "notes": "If the reception is a publik lokal, BFS 2024:12 3 kap. 6 § requires sound transfer to hearing aids (new build)."}], "variants": [{"id": "office_cellular", "label": "Cellular office (cellkontor)", "changes": "One or two persons per room; every room is a permanent workplace needing daylight/view and ventilation; drives facade length per person and limits plan depth. Highest m2 per employee."}, {"id": "office_open_plan", "label": "Open-plan (kontorslandskap)", "changes": "Fixed desks in open areas; deep plans possible but daylight/view still required (AFS 2023:12 5 kap. 25 §); acoustics and quiet rooms (3 kap. 2 § allmänna råd) become critical."}, {"id": "office_abw", "label": "Activity-based (aktivitetsbaserat kontor)", "changes": "No personal desks; typically ~75 % desks per employee (CAMM faktablad p. 3); more meeting, quiet and phone rooms; lockers replace personal storage (3 kap. 40–41 §§). Riksrevisionen RiR 2025:17 sect. 2.3 notes agencies converting to ABW reduced area substantially."}], "conversion_from_office": {"typical_blockers": ["Not applicable as a conversion target from office; relevant when re-using older office stock: low outdoor-air capacity versus 7 l/s/person + 0.35 l/s/m2 at higher densities.", "Deep plans failing daylight and view for permanent workplaces (AFS 2023:12 5 kap. 25 §).", "Missing accessible WC per storey at ombyggnad (AFS 2023:12 3 kap. 4 § p. 6)."], "typical_enablers": ["Same verksamhetsklass 1; no change of use permit needed.", "ABW raises utilisation, freeing floors for other uses."]}, "sources": [{"ref": "AFS 2023:12 Utformning av arbetsplatser — 2 kap. 9 §, 3 kap. 2–7, 36–65 §§, 5 kap. 3–4, 23–25 §§ (text extracted from PDF)", "url": "https://www.av.se/globalassets/filer/publikationer/foreskrifter/utformning-av-arbetsplatser-afs2023-12.pdf", "accessed": "2026-10-19"}, {"ref": "BFS 2024:7 brandskydd — 2 kap. 4 §, 10 §", "url": "https://rinfo.boverket.se/BFS2024-7/pdf/BFS2024-7.pdf", "accessed": "2026-10-19"}, {"ref": "BFS 2024:8 hygien, hälsa och miljö — 3 kap. 4–5 §§, 4 kap. 3 §, 11 kap. 1–3 §§", "url": "https://rinfo.boverket.se/BFS2024-8/pdf/BFS2024-8.pdf", "accessed": "2026-10-19"}, {"ref": "BFS 2024:12 tillgänglighet — 2 kap. 1–2 §§, 3 kap. 6 §", "url": "https://rinfo.boverket.se/BFS2024-12/pdf/BFS2024-12.pdf", "accessed": "2026-10-19"}, {"ref": "Riksrevisionen RiR 2025:17 'Kostsam kvadratjakt' and Regeringens skrivelse 2025/26:65", "url": "https://www.riksdagen.se/sv/dokument-och-lagar/dokument/regeringens-skrivelse/riksrevisionens-rapport-om-statens-anvandning-och_hd0365/html/", "accessed": "2026-10-19"}, {"ref": "CAMM (Region Stockholm) faktablad 'Aktivitetsbaserade kontor', p. 3", "url": "https://www.camm.regionstockholm.se/siteassets/camm-dokument/faktablad/camm-aktivitetsbaserade-kontor_webb.pdf", "accessed": "2026-10-19"}], "open_questions": ["No Swedish private-sector public benchmark for m2 per workplace was found (Fabege/Vasakronan/Castellum/CBRE do not publish it as a key figure); 15 m2/employee is the state benchmark. Verify against a commercial source if needed.", "Hourly presence shape is a modelling assumption; post-2020 attendance may be well below 70 % on Mondays/Fridays.", "AFS 2023:12 sets no numeric daylight factor; decide whether the platform should test against SS-EN 17037 levels (referenced only as method in allmänna råd).", "BFS 2024:8 3 kap. has no numeric airflow for lokaler; confirm no Boverket allmänna råd or vägledning adds one."]}, "preschool": {"id": "preschool", "label_en": "Preschool (förskola)", "label_sv": "Förskola", "family": "education", "summary": "Education and care for children aged 1-5, organised in barngrupper (Skolverket benchmark 6-12 children aged 1-3, 9-15 aged 4-5; municipal programmes plan for about 18 per group). The law requires suitable group size, a good environment and the premises needed for the education's purpose, but sets no room sizes. Sizes come from municipal programmes: Uppsala uses about 7.0 m² of children's area per child and 8.3-9.3 m² of programme area per child; Malmö plans 15 m² BTA per child; one Göteborg project uses 13.5 m² BTA per child. The decisive constraint is outdoor friyta (PBL 8 kap. 9 §; Boverket guidance 40 m² per child). After that come fire class 5A, ground-floor access for prams and cargo bikes, drainage for many WCs and changing tables, and a large ventilation plant room.", "regulatory": {"bbr_verksamhetsklass": "5A", "bbr_verksamhetsklass_source": "BFS 2024:7 (Boverkets föreskrifter och allmänna råd om säkerhet i händelse av brand i byggnader) 2 kap. 18 §: verksamhetsklass 5A covers spaces for people with limited or no ability to get themselves to safety, explicitly naming förskolor. These rules replace the fire rules in BBR section 5. Earlier BBR 5:2 (repealed BBR, pre-2025) also placed förskolor in Vk5A. Fire classes are now in BFS 2024:7 2 kap. 9-20 §§. General fire, egress and travel-distance rules are in cross_cutting.json. Pre-school classes inside a school building are Vk2A/2B (see school_compulsory).", "bbr_verksamhetsklass_url": "https://lagen.nu/bfs/2024:7", "key_laws": [{"ref": "Skollagen (2010:800) 8 kap. 8 § (barngrupper of suitable composition and size; good environment)", "url": "https://www.riksdagen.se/sv/dokument-och-lagar/dokument/svensk-forfattningssamling/skollag-2010800_sfs-2010-800/"}, {"ref": "Skollagen (2010:800) 2 kap. 35 § (the premises and equipment needed for the education's purpose must exist)", "url": "https://www.riksdagen.se/sv/dokument-och-lagar/dokument/svensk-forfattningssamling/skollag-2010800_sfs-2010-800/"}, {"ref": "Plan- och bygglagen (2010:900) 8 kap. 9 § andra stycket, 10-11 §§ (sufficiently large friyta for play and outdoor stay on or near the site)", "url": "https://www.riksdagen.se/sv/dokument-och-lagar/dokument/svensk-forfattningssamling/plan-och-bygglag-2010900_sfs-2010-900/"}, {"ref": "Boverkets allmänna råd BFS 2015:1 FRI om friyta för lek och utevistelse", "url": "https://www.boverket.se/globalassets/publikationer/dokument/2015/gor-plats-for-barn-och-unga.pdf"}, {"ref": "BFS 2024:7 fire safety, verksamhetsklass 5A (2 kap. 18 §)", "url": "https://lagen.nu/bfs/2024:7"}, {"ref": "AFS 2023:12 Utformning av arbetsplatser, kap. 3 (personalutrymmen); replaced AFS 2020:1 on 2025-01-01", "url": "https://www.av.se/globalassets/filer/publikationer/foreskrifter/utformning-av-arbetsplatser-afs2023-12.pdf"}, {"ref": "Förordning (1998:899) om miljöfarlig verksamhet och hälsoskydd 38 § (anmälan to the municipal environment committee before a förskola starts)", "url": "https://www.riksdagen.se/sv/dokument-och-lagar/dokument/svensk-forfattningssamling/forordning-1998899-om-miljofarlig-verksamhet-och_sfs-1998-899/"}, {"ref": "Förordning (EG) nr 852/2004 om livsmedelshygien, art. 6 (registration of food establishment) and bilaga II (premises hygiene)", "url": "https://eur-lex.europa.eu/legal-content/SV/TXT/?uri=CELEX:32004R0852"}], "permits": ["Bygglov for change of use (PBL 9 kap. 15 § 1, from 2025-12-01; the former 9 kap. 2 § 3 a/b is gone; see cross_cutting.json), tested against the detaljplan (förskola normally needs a plan designation for skola/förskola, S) and against PBL 8 kap. 9 § friyta", "Anmälan för hälsoskydd to the municipal environment committee (FMH 38 §) before start; municipalities typically ask for plans, child numbers, ventilation and radon data", "Registration of the kitchen as a food establishment with the municipal control authority at least two weeks before start (EU 852/2004 art. 6; Livsmedelsverket guidance)", "Fire-protection design (brandskyddsbeskrivning) for verksamhetsklass 5A", "Municipal VA approval of a grease separator if a cooking kitchen is installed (ABVA; SS-EN 1825)"], "operator_oversight": "The municipality (huvudman for municipal förskolor, and approving authority for independent ones); Skolinspektionen for state oversight of quality; the municipal miljönämnd for health protection; the municipal livsmedelskontroll for the kitchen"}, "occupancy": {"unit": "child", "gross_m2_per_unit": {"value": 15, "range": [13.5, 15], "measure": "BTA", "strength": "programme", "source": "Malmö stad, 'Friytor vid förskolor och skolor' (Stadsbyggnadsnämnden 2016-08-26, rev. 2021-12-16) p. 10: 15 m² BTA per förskolebarn as a detaljplan estimate. Göteborgs Stad förstudierapport Solvädersbyn/Biskopsgården 103:1 (Förskoleförvaltningen 2024-06-13) p. 4: 108 children, BTA 1 465 m², LOA 1 188 m², 13.5 m² BTA and 11 m² LOA per child. For comparison, Uppsala's 2015 programme gives 8.3-9.3 m² programme area per child, which excludes circulation, walls and technical space (p. 6).", "url": "https://malmo2.miljobarometern.se/content/docs/Friytor%20vid%20f%C3%B6rskolor%20och%20skolor%20rev%2020211216.pdf", "confidence": "verified"}, "child_area_m2_per_unit": {"value": 7.0, "range": [7.0, 7.5], "strength": "programme", "source": "Uppsala kommun, 'Program för lokaler i förskola och grundskola F-9' (2015-10-22) p. 6 faktaruta: barnyta 7.0 m² per child, independent of size. Malmö (friyta guideline p. 10) cites miljönämndens vägledning that each child needs at least 7.5 m² vistelseyta indoors.", "url": "https://bygg.uppsala.se/globalassets/uppsala-vaxer/dokument/stadsplanering--utveckling/planerade-omraden/bostadsomraden/ulleraker/markanvisning/uppsala-kommuns-generella-lokalprogram-for-forskolelokaler.pdf", "confidence": "verified"}, "group_size": {"value": 15, "range": [6, 15], "strength": "guidance", "source": "Skolverket benchmark (riktmärke): 6-12 children per group aged 1-3, 9-15 aged 4-5. It is not legally binding. Skolverket's page 'Rätt till förskola' cites Skolverkets allmänna råd (SKOLFS 2025:440) om styrning och ledning av förskolan with kommentarer p. 11. Actual national average in autumn 2025 was 15.3 children per group (12.5 for groups up to age 3, 16.2 for groups aged 4-5), per Skolverket, 'Barn och personal i förskola hösten 2025', p. 4. Municipal programmes dimension for 18 per group (Uppsala 2015 p. 8; Göteborg project p. 12).", "url": "https://www.skolverket.se/styrning-och-ansvar/regler-och-ansvar/ansvar-i-skolfragor/ratt-till-forskola", "confidence": "verified"}, "typical_unit_size": "Uppsala plans sections of 36 children (2 groups of 18) with 6-7 pedagogues, and units of 72/108/144 children (4/6/8 groups). Malmö plans new municipal förskolor for at least 80 children (friyta guideline p. 9).", "staff_per_unit": {"value": 0.196, "strength": "practice", "source": "National statistic: 5.1 children per full-time post (heltidstjänst) in förskola, autumn 2025. Skolverket, 'Barn och personal i förskola hösten 2025', p. 19. Excludes kitchen, cleaning and admin staff. The Göteborg project (p. 3) lists 25 pedagogues, 2 kitchen staff, 1 cleaner and 1-2 admin for 108 children.", "url": "https://www.skolverket.se/download/18.338b7ccc19d8ac2fb50b56e/1776321721245/pdf13405.pdf", "confidence": "verified"}, "hours_profile": "weekday_daytime", "opening_hours_note": "Uppsala 2015 programme p. 7: premises fully used during opening hours 06.00-18.00. Night-open förskola exists in some areas and changes fire and kitchen requirements.", "hourly_presence": [0, 0, 0, 0, 0, 0, 0.1, 0.4, 0.8, 0.95, 1, 1, 0.95, 0.9, 0.85, 0.7, 0.45, 0.15, 0.02, 0, 0, 0, 0, 0], "hourly_presence_confidence": "indicative"}, "spaces": [{"id": "preschool_project_room", "label_en": "Group base / project room (one per barngrupp)", "label_sv": "Projektrum / avdelningsrum", "required": {"strength": "law", "basis": "Skollagen 2 kap. 35 § (the premises needed for the education's purpose must exist) and 8 kap. 8 § (good environment, suitable groups). The function is required. The law sets no size.", "url": "https://www.riksdagen.se/sv/dokument-och-lagar/dokument/svensk-forfattningssamling/skollag-2010800_sfs-2010-800/"}, "size": {"rule": "per_group", "value_m2": 30, "count": "1 per barngrupp of about 18 children", "strength": "programme", "source": "Uppsala kommun lokalförteckning förskola 72 barn (2015), p. 16: Projektrum 30 m² × 4", "url": "https://bygg.uppsala.se/globalassets/uppsala-vaxer/dokument/stadsplanering--utveckling/planerade-omraden/bostadsomraden/ulleraker/markanvisning/uppsala-kommuns-generella-lokalprogram-for-forskolelokaler.pdf", "confidence": "verified"}, "constraints": {"daylight_required": true, "facade_required": true, "ground_floor_preferred": true}, "depends_on": ["preschool_cloakroom", "preschool_changing_room", "preschool_child_wc"], "shareable_with": [], "shareable_note": "Out of hours it could host parent meetings. Daytime sharing is not realistic.", "binding_constraint": "daylight_and_facade", "layer": "space_plan", "notes": "Rest and sleep for the youngest children usually happens here on mattresses. Uppsala's 72-child list has no dedicated sleep room. Acoustics (reverberation) and ventilation per person are typical failure points in deep office floors. Uppsala wants rooms placed towards the yard."}, {"id": "preschool_group_room", "label_en": "Small group room", "label_sv": "Grupprum", "required": {"strength": "programme", "basis": "Uppsala 2015 programme p. 8: every barngrupp of 18 has its own kapprum, projektrum and grupprum", "url": "https://bygg.uppsala.se/globalassets/uppsala-vaxer/dokument/stadsplanering--utveckling/planerade-omraden/bostadsomraden/ulleraker/markanvisning/uppsala-kommuns-generella-lokalprogram-for-forskolelokaler.pdf"}, "size": {"rule": "per_group", "value_m2": 15, "count": "1 per barngrupp", "strength": "programme", "source": "Uppsala lokalförteckning förskola 72 barn, p. 16: Grupprum 15 m² × 4", "url": "https://bygg.uppsala.se/globalassets/uppsala-vaxer/dokument/stadsplanering--utveckling/planerade-omraden/bostadsomraden/ulleraker/markanvisning/uppsala-kommuns-generella-lokalprogram-for-forskolelokaler.pdf", "confidence": "verified"}, "constraints": {"daylight_required": true, "facade_required": true}, "depends_on": ["preschool_project_room"], "shareable_with": [], "binding_constraint": "daylight_and_facade", "layer": "space_plan", "notes": "Used for small-group activities and rest."}, {"id": "preschool_allrum_atelier", "label_en": "Shared playroom and studio (per two groups)", "label_sv": "Allrum och ateljé", "required": {"strength": "programme", "basis": "Uppsala 2015 programme p. 8: two groups (36 children) share an allrum and an ateljé", "url": "https://bygg.uppsala.se/globalassets/uppsala-vaxer/dokument/stadsplanering--utveckling/planerade-omraden/bostadsomraden/ulleraker/markanvisning/uppsala-kommuns-generella-lokalprogram-for-forskolelokaler.pdf"}, "size": {"rule": "per_group", "value_m2": 60, "range_m2": [60, 60], "count": "1 allrum (40 m²) + 1 ateljé (20 m²) per 2 barngrupper (36 children)", "strength": "programme", "source": "Uppsala lokalförteckning förskola 72 barn, p. 16: Allrum 40 m² × 2, Ateljé 20 m² × 2. The illustration on p. 15 shows a combined 'Ateljé/allrum 60', divisible.", "url": "https://bygg.uppsala.se/globalassets/uppsala-vaxer/dokument/stadsplanering--utveckling/planerade-omraden/bostadsomraden/ulleraker/markanvisning/uppsala-kommuns-generella-lokalprogram-for-forskolelokaler.pdf", "confidence": "verified"}, "constraints": {"daylight_required": true, "water_point_required": true}, "depends_on": [], "shareable_with": [], "binding_constraint": "acoustics", "layer": "space_plan", "notes": "Uppsala requires the allrum to be divisible into two rooms, for example with a surface-mounted sliding door (p. 9)."}, {"id": "preschool_torg_kitchen", "label_en": "Shared hall / workshop kitchen used as dining space", "label_sv": "To
