p. 4 § (definition studentbostad), 8 kap. 6 § första stycket 4 och andra stycket (80 % accessibility exemption, Lag 2025:519)", "url": "https://www.riksdagen.se/sv/dokument-och-lagar/dokument/svensk-forfattningssamling/plan-och-bygglag-2010900_sfs-2010-900/"}, {"ref": "Plan- och byggförordning (2011:338) 3 kap. 5 a-5 b §§ and 19 a-19 b §§ (visitability; Förordning 2025:627)", "url": "https://www.riksdagen.se/sv/dokument-och-lagar/dokument/svensk-forfattningssamling/plan-och-byggforordning-2011338_sfs-2011-338/"}, {"ref": "BFS 2024:11 bostäders lämplighet, 2 kap. 2 §, 7-8 §§; 3 kap. 3-4 §§", "url": "https://rinfo.boverket.se/BFS2024-11/pdf/BFS2024-11.pdf"}, {"ref": "BFS 2024:12 tillgänglighet, 2 kap. 10 § third paragraph", "url": "https://forfattningssamling.boverket.se/detaljer/BFS2024-12"}, {"ref": "BFS 2024:10 buller, 2 kap. 4 § table 2:3", "url": "https://forfattningssamling.boverket.se/detaljer/BFS2024-10"}, {"ref": "BFS 2024:7 brand, 2 kap. 14-15 §§, 4 kap. 25 §, 5 kap. 25 §", "url": "https://forfattningssamling.boverket.se/detaljer/BFS2024-7"}, {"ref": "Prop. 2024/25:132 Lättnader i byggkraven för studentbostäder", "url": "https://www.riksdagen.se/sv/dokument-och-lagar/dokument/proposition/lattnader-i-byggkraven-for-studentbostader_hc03132/"}], "permits": ["Bygglov for change of use: PBL 9 kap. 15 § p. 1-2 (as amended by Lag 2025:974).", "The application should state clearly that it is for student housing. Later changing from student to ordinary housing is a change of use that triggers the ordinary-dwelling requirements, even though it needs no permit (archived Boverket guidance, p. 14).", "The builder chooses whether the 20 % accessible share is counted on all student dwellings in the building or only on those added by the measure (Boverket guidance on PBL 8 kap. 6 §)."], "operator_oversight": "Byggnadsnämnden. Operators are typically student housing companies; no state licensing."}, "occupancy": {"unit": "resident", "gross_m2_per_unit": {"value": 30, "range": [22, 38], "strength": "practice", "source": "Working value. Boverket's archived BBR guidance says a student dwelling with all functions inside 'kan få en boarea på som minst cirka 16 m2'; corridor units are smaller but add shared kitchens. Gross-up for shared rooms, circulation and walls is an assumption.", "url": "https://www.boverket.se/globalassets/publikationer/dokument/2026/boverkets-byggregler-bbr---bostadsutformning-efter-1-december-2025.pdf", "confidence": "indicative"}, "staff_per_unit": {"value": 0, "strength": "practice", "source": "Operator staff off-site; occasional caretaker."}, "hours_profile": "24_7", "hourly_presence": [0.9, 0.9, 0.9, 0.9, 0.9, 0.9, 0.85, 0.75, 0.55, 0.4, 0.35, 0.3, 0.35, 0.35, 0.35, 0.4, 0.5, 0.6, 0.7, 0.75, 0.8, 0.85, 0.9, 0.9], "hourly_presence_note": "Indicative term-time weekday profile; not sourced. Seasonal vacancy in summer (June-August) can bring average presence well below term values.", "persons_per_dwelling_note": "1 person per studio or corridor unit (design). Double studios for couples exist; they count as 2."}, "spaces": [{"id": "student_studio", "label_en": "Self-contained studio (all functions inside)", "label_sv": "Studentlägenhet / studentetta med eget kök och hygienrum", "required": {"strength": "law", "basis": "PBF 3 kap. 1 § and 17 § (all six bostadsfunktioner); BFS 2024:11 2 kap. 1-3 §§ (hygiene room inside), 3 kap. 1 § and 3 § (fixed fittings for hygiene and cooking; for students sized considering the limited stay)", "url": "https://rinfo.boverket.se/BFS2024-11/pdf/BFS2024-11.pdf"}, "size": {"rule": "per_unit", "value_m2": 22, "range_m2": [16, 28], "count": "one per resident", "strength": "practice", "source": "No m² in law. The 16 m² lower end is from Boverket's archived guidance on old BBR 3:225 (repealed BBR, pre-2025) ('som minst cirka 16 m2'). 22 m² and the 28 m² upper end are working values carried over from data/standards/space_requirements.json.", "url": "https://www.boverket.se/globalassets/publikationer/dokument/2026/boverkets-byggregler-bbr---bostadsutformning-efter-1-december-2025.pdf", "confidence": "indicative"}, "constraints": {"min_ceiling_height_mm": null, "daylight_required": true, "facade_required": true}, "depends_on": [], "shareable_with": [], "shareable_note": "", "binding_constraint": "wet_room_drainage", "layer": "space_plan", "notes": "Overlapping functions (e.g. sofa bed with table for socialising, sleep and meals) are explicitly allowed (Boverket studentbostäder guidance). Daylight DF >= 1.0 % over half the habitable area (BFS 2024:8 4 kap. 1 §; 0.8 % possible on conversion, 13 kap. 5 §). The old 'no direct sunlight needed' rule (BBR 6:323 (repealed BBR, pre-2025)) is gone; we found no direct-sunlight requirement in BFS 2024:8. Sound: same as other dwellings (BFS 2024:10 2 kap. 2 §)."}, {"id": "student_corridor_room", "label_en": "Corridor unit (private room, boendeenhet for one person)", "label_sv": "Korridorrum (boendeenhet för en person)", "required": {"strength": "law", "basis": "BFS 2024:11 1 kap. 5 § (boendeenhet = part of a dwelling let for private use where some functions are shared) and 2 kap. 7-8 §§. Boverket: each unit needs its own tenancy contract; if several students rent together on one contract, the rooms are not boendeenheter and the whole flat is one dwelling.", "url": "https://www.boverket.se/sv/PBL-kunskapsbanken/regler-om-byggande/bostaders-lamplighet/boendeenheter/"}, "size": {"rule": "per_unit", "value_m2": 14, "range_m2": [12, 18], "count": "one per resident", "strength": "practice", "source": "Working value from data/standards/space_requirements.json; no source sets size.", "url": "", "confidence": "indicative"}, "constraints": {"min_ceiling_height_mm": null, "daylight_required": true, "facade_required": true}, "depends_on": ["student_shared_kitchen", "student_shared_living"], "shareable_with": [], "shareable_note": "", "binding_constraint": "facade_length", "layer": "space_plan", "notes": "Daylight requirement applies both in the unit and in the rooms for shared functions (BFS 2024:8 4 kap. 1 § second paragraph). Sound between units in a student corridor: DnT,w,100 >= 48 dB; from the internal corridor 40 dB; from shared rooms 44 dB (BFS 2024:10 table 2:3). Each unit may have its own private shower/WC (most common) or share per student_shared_hygiene."}, {"id": "student_shared_kitchen", "label_en": "Shared kitchen (corridor variant)", "label_sv": "Gemensamt kök", "required": {"strength": "law", "basis": "BFS 2024:11 2 kap. 7 § (cooking may be shared by units for one person, adjacent to the units, sized for the number sharing; 'Bostadsfunktionen matlagning får delas av högst tolv personer') and 3 kap. 4 § (fixed fittings sized for those sharing). Stove guard on cookers: BFS 2024:7 4 kap. 25 §.", "url": "https://rinfo.boverket.se/BFS2024-11/pdf/BFS2024-11.pdf"}, "size": {"rule": "per_group", "value_m2": null, "count": "one kitchen per <= 12 persons (law)", "strength": "none", "source": "Regulation caps the group at 12 but sets no m². data/standards/space_requirements.json uses 2.5 m² per resident for kitchen plus social space (indicative, unsourced).", "url": "https://www.boverket.se/sv/PBL-kunskapsbanken/regler-om-byggande/bostaders-lamplighet/boendeenheter/", "confidence": "verified"}, "constraints": {"min_ceiling_height_mm": null, "daylight_required": true, "facade_required": true}, "depends_on": ["student_corridor_room"], "shareable_with": [], "shareable_note": "Must be in connection with the units ('i anslutning till'); Boverket accepts another floor only with internal communication that does not pass through public stairwells.", "binding_constraint": "group_size_12_and_daylight", "layer": "space_plan", "notes": "A unit may have its own kitchenette and also share a kitchen (Boverket boendeenheter guidance)."}, {"id": "student_shared_living", "label_en": "Shared living / dining room (corridor variant)", "label_sv": "Gemensamt sällskapsrum / matplats", "required": {"strength": "law", "basis": "BFS 2024:11 2 kap. 7 § (socialising and meals may be shared, adjacent, sized for the number sharing). The shared space must compensate for smaller private rooms; Boverket mentions a lounge or common room for several units.", "url": "https://rinfo.boverket.se/BFS2024-11/pdf/BFS2024-11.pdf"}, "size": {"rule": "per_group", "value_m2": null, "count": "sized 'lämpliga för det antal personer som delar dem'", "strength": "none", "source": "Boverket: 'Reglerna anger inte hur de delade utrymmena ska se ut eller hur stora de måste vara.'", "url": "https://www.boverket.se/sv/PBL-kunskapsbanken/regler-om-byggande/bostaders-lamplighet/boendeenheter/", "confidence": "verified"}, "constraints": {"min_ceiling_height_mm": null, "daylight_required": true, "facade_required": false}, "depends_on": ["student_shared_kitchen"], "shareable_with": [], "shareable_note": "", "binding_constraint": "acoustics", "layer": "space_plan", "notes": "DF requirement applies to rooms for shared functions (BFS 2024:8 4 kap. 1 §), but the outlook requirement does not apply to shared socialising and meal spaces in dwellings with one-person units (4 kap. 2 § second paragraph). So it needs daylight but not necessarily a view; a toplit interior room may work."}, {"id": "student_shared_hygiene", "label_en": "Shared hygiene room (optional, corridor variant)", "label_sv": "Gemensamt hygienrum", "required": {"strength": "law", "basis": "BFS 2024:11 2 kap. 8 §: if shared, at most three one-person units per hygiene room, adjacent to and on the same floor as the units. Boverket: reachable without passing through other residents' private areas or public stairwells/galleries.", "url": "https://rinfo.boverket.se/BFS2024-11/pdf/BFS2024-11.pdf"}, "size": {"rule": "per_group", "value_m2": null, "count": "one per <= 3 units (law)", "strength": "none", "source": "No m² in regulation.", "url": "https://www.boverket.se/sv/PBL-kunskapsbanken/regler-om-byggande/bostaders-lamplighet/boendeenheter/", "confidence": "verified"}, "constraints": {"min_ceiling_height_mm": null, "daylight_required": false, "facade_required": false}, "depends_on": ["student_corridor_room"], "shareable_with": [], "shareable_note": "", "binding_constraint": "wet_room_drainage", "layer": "services", "notes": "Sharing cuts the number of wet rooms per resident by up to two thirds, a big lever in office conversion, but it lowers lettability."}, {"id": "student_visitor_wc", "label_en": "Accessible WC for visitors (when units are exempt from accessibility)", "label_sv": "Tillgänglig toalett för besökare", "required": {"strength": "law", "basis": "PBF 3 kap. 5 a § p. 3 / 19 a § p. 3: a student dwelling that only needs to be visitable must have at least one accessible WC for the visitor in the building near the dwelling; also the visitor must reach the floor and enter, and there must be a space for socialising with the visitor", "url": "https://www.boverket.se/sv/PBL-kunskapsbanken/regler-om-byggande/tillganglighet-och-anvandbarhet/tillganglighet-studentbostader/"}, "size": {"rule": "per_building", "value_m2": null, "count": "at least one per building, near the exempted dwellings", "strength": "none", "source": "No m²; accessibility dimensions per BFS 2024:12 1 kap. 6 §.", "url": "https://forfattningssamling.boverket.se/detaljer/BFS2024-12", "confidence": "verified"}, "constraints": {"min_ceiling_height_mm": null, "daylight_required": false, "facade_required": false}, "depends_on": [], "shareable_with": [], "shareable_note": "", "binding_constraint": "none", "layer": "services", "notes": "Only needed if the 80 % exemption is used. At least 20 % of the student dwellings stay fully accessible. If those accessible ones cannot be reached from the ground, all exempted dwellings must be visitable (PBF 3 kap. 5 b §)."}, {"id": "student_study_room", "label_en": "Study / bookable room", "label_sv": "Studierum / bokningsbart rum", "required": {"strength": "practice", "basis": "Not required by law; common operator practice.", "url": ""}, "size": {"rule": "per_group", "value_m2": 10, "count": "about one per 24 residents (working value)", "strength": "practice", "source": "Working value from data/standards/space_requirements.json; unsourced.", "url": "", "confidence": "indicative"}, "constraints": {"min_ceiling_height_mm": null, "daylight_required": false, "facade_required": false}, "depends_on": [], "shareable_with": ["co_living"], "shareable_note": "Could be a co-working space shared with other residents.", "binding_constraint": "none", "layer": "space_plan", "notes": "Fits the deep, windowless zone of an office plan. If people stay more than temporarily it is a 'lokal' room under BFS 2024:8 4 kap. 3 § (enough daylight 'unless unreasonable for the intended use')."}, {"id": "laundry_room", "label_en": "Shared laundry room", "label_sv": "Tvättstuga", "required": {"strength": "law", "basis": "BFS 2024:11 2 kap. 4 § and 3 kap. 2 § (as for housing_apartment)", "url": "https://rinfo.boverket.se/BFS2024-11/pdf/BFS2024-11.pdf"}, "size": {"rule": "per_building", "value_m2": null, "count": "sized for the dwellings sharing it", "strength": "none", "source": "No m² in regulation.", "url": "https://www.boverket.se/sv/PBL-kunskapsbanken/regler-om-byggande/bostaders-lamplighet/inredning/", "confidence": "verified"}, "constraints": {"min_ceiling_height_mm": null, "daylight_required": false, "facade_required": false}, "depends_on": [], "shareable_with": ["housing_apartment", "co_living"], "shareable_note": "", "binding_constraint": "drainage_and_exhaust", "layer": "services", "notes": ""}, {"id": "storage_non_daily", "label_en": "Storage not for daily use", "label_sv": "Förråd (förvaring som inte är för dagligt bruk)", "required": {"strength": "law", "basis": "BFS 2024:11 2 kap. 5 § (may be outside the dwelling, near it, and separated)", "url": "https://rinfo.boverket.se/BFS2024-11/pdf/BFS2024-11.pdf"}, "size": {"rule": "per_unit", "value_m2": null, "count": "one per dwelling", "strength": "none", "source": "No m² in regulation. The old BBR 3:225 (repealed BBR, pre-2025) general advice gave storage measures for small student dwellings; they are no longer in force and were not retrieved.", "url": "https://rinfo.boverket.se/BFS2024-11/pdf/BFS2024-11.pdf", "confidence": "verified"}, "constraints": {"min_ceiling_height_mm": null, "daylight_required": false, "facade_required": false}, "depends_on": [], "shareable_with": [], "shareable_note": "", "binding_constraint": "none", "layer": "space_plan", "notes": "Limited stay (2 kap. 2 §) may justify smaller storage."}, {"id": "bicycle_parking", "label_en": "Bicycle parking", "label_sv": "Cykelparkering", "required": {"strength": "law", "basis": "BFS 2026:4 2 kap. 2 § (>= 2 per apartment in a new flerbostadshus; may be adapted to local conditions, especially if the building mainly contains dwellings for one person). On alteration only for ombyggnad involving car parking (1 kap. 4 §).", "url": "https://www.boverket.se/sv/PBL-kunskapsbanken/regler-om-byggande/hallbar-mobilitet/"}, "size": {"rule": "per_unit", "value_m2": null, "count": "law default 2 per apartment; adaptation allowed for one-person dwellings", "strength": "law", "source": "Count only; no m².", "url": "https://www.boverket.se/sv/PBL-kunskapsbanken/regler-om-byggande/hallbar-mobilitet/", "confidence": "verified"}, "constraints": {"min_ceiling_height_mm": null, "daylight_required": false, "facade_required": false}, "depends_on": [], "shareable_with": ["housing_apartment", "co_living"], "shareable_note": "", "binding_constraint": "ground_floor_area", "layer": "site", "notes": "Students cycle a lot. Even where the rule allows fewer, operators and municipalities usually want generous bicycle parking."}, {"id": "waste_room", "label_en": "Waste room", "label_sv": "Avfallsutrymme", "required": {"strength": "law", "basis": "BFS 2024:8 11 kap. 1-3 §§", "url": "https://forfattningssamling.boverket.se/detaljer/BFS2024-8"}, "size": {"rule": "per_building", "value_m2": null, "count": "per municipal waste rules", "strength": "programme", "source": "Municipal renhållningsföreskrifter.", "url": "", "confidence": "indicative"}, "constraints": {"min_ceiling_height_mm": null, "daylight_required": false, "facade_required": false}, "depends_on": [], "shareable_with": ["housing_apartment", "co_living", "hotel"], "shareable_note": "", "binding_constraint": "collection_vehicle_access", "layer": "site", "notes": ""}, {"id": "outdoor_play_space", "label_en": "Outdoor space (friyta)", "label_sv": "Friyta för lek och utevistelse", "required": {"strength": "law", "basis": "PBL 8 kap. 9 § second paragraph and 10 § (applies to all plots with dwellings, student housing included)", "url": "https://www.riksdagen.se/sv/dokument-och-lagar/dokument/svensk-forfattningssamling/plan-och-bygglag-2010900_sfs-2010-900/"}, "size": {"rule": "per_building", "value_m2": null, "count": "sufficient", "strength": "none", "source": "PBL sets no m².", "url": "https://www.riksdagen.se/sv/dokument-och-lagar/dokument/svensk-forfattningssamling/plan-och-bygglag-2010900_sfs-2010-900/", "confidence": "verified"}, "constraints": {"min_ceiling_height_mm": null, "daylight_required": true, "facade_required": false}, "depends_on": [], "shareable_with": ["housing_apartment", "co_living"], "shareable_note": "", "binding_constraint": "plot_area", "layer": "site", "notes": ""}, {"id": "entrance_stair_lift", "label_en": "Entrance, circulation and lift", "label_sv": "Entré, kommunikationsytor och hiss", "required": {"strength": "law", "basis": "BFS 2024:12 2 kap. 1-5 §§; PBF 3 kap. 4 §; for exempted student dwellings, visitability means the visitor can reach the floor (lift if three or more storeys), with special rules for two-storey buildings (PBF 3 kap. 5 b §)", "url": "https://www.boverket.se/sv/PBL-kunskapsbanken/regler-om-byggande/tillganglighet-och-anvandbarhet/tillganglighet-studentbostader/"}, "size": {"rule": "derived", "value_m2": null, "count": "per core", "strength": "law", "source": "Lift short side >= 1100 mm (BFS 2024:12 2 kap. 5 §); otherwise functional.", "url": "https://forfattningssamling.boverket.se/detaljer/BFS2024-12", "confidence": "verified"}, "constraints": {"min_ceiling_height_mm": null, "daylight_required": false, "facade_required": false}, "depends_on": [], "shareable_with": ["housing_apartment", "co_living", "hotel"], "shareable_note": "", "binding_constraint": "fire_egress", "layer": "structure", "notes": "Internal corridors inside a corridor dwelling are part of the dwelling, not public circulation."}], "variants": [{"id": "student_studio_variant", "label": "Studios with own kitchen and bathroom", "changes": "All functions inside each unit; Vk 3A; sound per BFS 2024:10 table 2:1 (normal dwellings); one wet room and one kitchenette per resident. Gross about 28-38 m² per resident (indicative)."}, {"id": "student_corridor_variant", "label": "Corridor rooms with shared kitchen", "changes": "Boendeenheter for one person (individual contracts). Shared kitchen <= 12 persons, shared living/dining; optional shared hygiene <= 3 units per room on the same floor. Vk 3B with stove guards and compartment per group of <= 6 persons or sprinkler. Sound table 2:3. Gross about 22-30 m² per resident (indicative)."}], "conversion_from_office": {"typical_blockers": ["Daylight DF >= 1.0 % in each unit AND in the shared kitchen/living rooms (BFS 2024:8 4 kap. 1 §); 0.8 % only with justification on conversion (13 kap. 5 §).", "Wet rooms per unit (studios) and their drainage through existing slabs.", "Fire class 3B for corridor layouts: compartment per group of at most 6 persons, or sprinklers (BFS 2024:7 5 kap. 25 §).", "Facade length per resident: many small rooms each need a window."], "typical_enablers": ["Deep plans: the 'utblick' requirement does not apply to shared socialising and meal rooms for one-person units (BFS 2024:8 4 kap. 2 §), so these can sit deeper (daylight factor still applies).", "Shared hygiene rooms (<= 3 units each) cut wet rooms.", "Accessibility relief: up to 80 % of units exempt (PBL 8 kap. 6 §), no bed help-space requirement (BFS 2024:12 2 kap. 10 §).", "Limited-stay sizing (BFS 2024:11 2 kap. 2 §) allows small units and short kitchen fittings.", "Boverket's archived guidance on old BBR 3:52 (repealed BBR, pre-2025) already accepted relaxations when converting deep buildings with load-bearing interior walls into student housing or one-person housing with shared spaces; BFS 2024:11 4 kap. 1 § carries similar adaptation grounds."]}, "sources": [{"ref": "BFS 2024:11 full text", "url": "https://rinfo.boverket.se/BFS2024-11/pdf/BFS2024-11.pdf", "accessed": "2026-10-19"}, {"ref": "Boverket PBL kunskapsbanken: Studentbostäder (bostäders lämplighet)", "url": "https://www.boverket.se/sv/PBL-kunskapsbanken/regler-om-byggande/bostaders-lamplighet/studentbostader/", "accessed": "2026-10-19"}, {"ref": "Boverket PBL kunskapsbanken: Bostäder med boendeenheter", "url": "https://www.boverket.se/sv/PBL-kunskapsbanken/regler-om-byggande/bostaders-lamplighet/boendeenheter/", "accessed": "2026-10-19"}, {"ref": "Boverket PBL kunskapsbanken: Tillgängliga studentbostäder (quotes PBL 8 kap. 6 §, PBF 3 kap. 5 a-5 b, 19 a-19 b §§; worked examples)", "url": "https://www.boverket.se/sv/PBL-kunskapsbanken/regler-om-byggande/tillganglighet-och-anvandbarhet/tillganglighet-studentbostader/", "accessed": "2026-10-19"}, {"ref": "BFS 2024:12 2 kap. 10 §", "url": "https://forfattningssamling.boverket.se/detaljer/BFS2024-12", "accessed": "2026-10-19"}, {"ref": "BFS 2024:10 2 kap. 4 § table 2:3", "url": "https://forfattningssamling.boverket.se/detaljer/BFS2024-10", "accessed": "2026-10-19"}, {"ref": "BFS 2024:8 4 kap. 1-3 §§, 13 kap. 5 §", "url": "https://forfattningssamling.boverket.se/detaljer/BFS2024-8", "accessed": "2026-10-19"}, {"ref": "BFS 2024:7 2 kap. 14-15 §§, 4 kap. 25 §, 5 kap. 25 §", "url": "https://forfattningssamling.boverket.se/detaljer/BFS2024-7", "accessed": "2026-10-19"}, {"ref": "Boverket (2026) archived guidance on old BBR bostadsutformning incl. studentbostäder, pp. 11-14, 16-18", "url": "https://www.boverket.se/globalassets/publikationer/dokument/2026/boverkets-byggregler-bbr---bostadsutformning-efter-1-december-2025.pdf", "accessed": "2026-10-19"}, {"ref": "Prop. 2024/25:132 Lättnader i byggkraven för studentbostäder (pp. 38-41 cited by Boverket)", "url": "https://www.riksdagen.se/sv/dokument-och-lagar/dokument/proposition/lattnader-i-byggkraven-for-studentbostader_hc03132/", "accessed": "2026-10-19"}, {"ref": "Boverket PBL kunskapsbanken: Hållbar mobilitet (BFS 2026:4)", "url": "https://www.boverket.se/sv/PBL-kunskapsbanken/regler-om-byggande/hallbar-mobilitet/", "accessed": "2026-10-19"}], "open_questions": ["No current source gives m² for studios, corridor rooms or shared kitchens. Collect actual programmes from operators (e.g. AF Bostäder, SGS Studentbostäder, Uppsala studentbostäder) or Studentbostadsföretagen to replace the indicative values.", "Does the student sound table (BFS 2024:10 table 2:3) also apply between corridor units when shared hygiene is used? (Assumed yes.)", "Boverket's student guidance mentions a separate page on noise protection for student housing (skydd-mot-buller/bostader/studentbostader); it was not read in detail.", "Old BBR 3:225 (repealed BBR, pre-2025) general advice had minimum kitchen fitting length and storage for student dwellings <=35 m². Under BFS 2024:11 there is no replacement figure. Check whether Boverket guidance or SS 91 42 21 revisions supply one.", "PBL 8 kap. 6 § wording changes on 1 Jan 2027 (Lag 2026:746: units in attics or suterräng need not be visitable). Re-check.", "Summer vacancy profile: no source used. Operator data would improve the hourly and seasonal presence."]}}, "rules": [{"id": "cou_bygglov_trigger", "topic": "When a change of use needs bygglov", "rule_plain_english": "Bygglov is required for a change to a building (other than an extension) if the building, or part of it, is taken into use or fitted out for a substantially different purpose than the one it was last used for. The same applies to the purpose it was last permitted for, if that use never started. Office to housing, school, care, hotel, retail or assembly is normally 'väsentligen annat ändamål'. Adding a dwelling also needs bygglov. Since 2025-12-01 this rule is PBL 9 kap. 15 § 1-2; before that it was 9 kap. 2 § första stycket 3 a-b.", "values": {"current_paragraph": "PBL 9 kap. 15 § 1 (ändrad användning) and 15 § 2 (ytterligare bostad)", "former_paragraph": "PBL 9 kap. 2 § 3 a och b (before 2025-12-01)", "exception_outside_plan": "PBL 9 kap. 16 § 1: no bygglov when, outside a detaljplan area and outside sammanhållen bebyggelse, premises of at most 50.0 m² gross area in total are fitted out", "detaljplan_can_add": "PBL 9 kap. 2 § andra stycket: a detaljplan or områdesbestämmelser can add further bygglov requirements"}, "applies_to_uses": ["all"], "strength": "law", "source": "Plan- och bygglag (2010:900) 9 kap. 2, 15, 16 §§ in the wording of Lag (2025:974), consolidated to SFS 2026:1583", "url": "https://rkrattsbaser.gov.se/sfst?bet=2010:900", "confidence": "verified", "conversion_note": "Every office-to-X conversion in a detaljplan area needs bygglov, and the new use must also be consistent with the detaljplan (e.g. B, C, D, K, S). If the plan only allows 'K' (kontor), housing usually needs a planändring or a liten avvikelse. Check the plan first: plan compliance is usually the first blocker, not the building rules.", "section": "change_of_use"}, {"id": "cou_anmalan", "topic": "Anmälan (notification) for works without bygglov", "rule_plain_english": "Even when no bygglov is needed, an anmälan to the byggnadsnämnd is required for changes that significantly affect the load-bearing structure or the fire protection, and for installing or significantly changing a lift, fireplace, flue, ventilation, or water and drainage system. A conversion almost always involves at least one of these.", "values": {"paragraph": "PBF 6 kap. 1 § 2-5", "rivning_threshold_m2": 50.0}, "applies_to_uses": ["all"], "strength": "law", "source": "Plan- och byggförordning (2011:338) 6 kap. 1 § in the wording of Förordning (2025:979)", "url": "https://rkrattsbaser.gov.se/sfst?bet=2011:338", "confidence": "verified", "conversion_note": "Even a use change exempt from bygglov still triggers anmälan, startbesked and a kontrollplan because ventilation, fire protection and often structure change.", "section": "change_of_use"}, {"id": "cou_requirements_scope", "topic": "Which technical requirements apply when an existing building is changed", "rule_plain_english": "Only the part that changes must meet today's technical requirements. Each new Boverket regulation (BFS 2024:6-12) has a final chapter on alterations. For a change of use, the scope of the alteration is judged by whether the new use places higher demands than the old one: higher loads, more people, more ventilation, stricter fire, accessibility or acoustic demands. Where it does, those properties must be brought up to standard for the changed part. The old BBR 1:2233 general advice gave examples: significantly increased loads, more people needing changed fire protection or more outdoor air, or a previously unheated space being heated.", "values": {"fire": "BFS 2024:7 9 kap. 4 §", "structure": "BFS 2024:6 8 kap. 3 § (explicitly includes 'eventuell ökning av lasteffekter')", "hygiene_health": "BFS 2024:8 12 kap. 3 §, 13 kap. 3 § (air), 13 kap. 6 § (moisture)", "noise": "BFS 2024:10 3 kap. 3 §", "accessibility": "BFS 2024:12 4 kap. 3 §", "dwellings": "BFS 2024:11 4 kap.", "old_rule": "BBR (BFS 2011:6) 1:2233"}, "applies_to_uses": ["all"], "strength": "law", "source": "BFS 2024:6 8 kap. 3 §; BFS 2024:7 9 kap. 4 §; BFS 2024:8 12 kap. 3 §; BFS 2024:10 3 kap. 3 §; BFS 2024:12 4 kap. 3 §", "url": "https://rinfo.boverket.se/BFS2024-7/pdf/BFS2024-7.pdf", "confidence": "verified", "conversion_note": "This is why 'office to housing' is often easier on structure (the load category drops from B 2.5 to A 2.0 kN/m²) but harder on fire (sleeping occupants), daylight, acoustics and sanitary rooms. 'Office to assembly, gym or retail' is the reverse: loads and egress increase.", "section": "change_of_use"}, {"id": "cou_adaptation_grounds", "topic": "Anpassning (adaptation) of requirements for existing buildings", "rule_plain_english": "The changed part must meet the requirements for new buildings, but the level may be adapted, as long as the result is still acceptable, if this is needed for any of these reasons: (1) to meet the varsamhet (care) requirement; (2) to respect the ban on förvanskning (disfigurement) of especially valuable buildings; (3) full compliance is unreasonable given the scope of the change; (4) compliance would only give a negligible improvement; (5) the cost is unreasonably high relative to the benefit; (6) there are technical reasons; (7) it is needed to achieve acceptable health, safety or accessibility properties, or to protect cultural values. The accessibility regulation is stricter: 'uppenbart oskäligt' (obviously unreasonable) and 'betydande tekniska skäl' (significant technical reasons). A deterioration of existing properties is allowed only if the building still meets the new-build requirements, if it is needed for another requirement or for cultural values, or if it is negligible. The fire regulation also requires a documented risk assessment for any adaptation (BFS 2024:7 1 kap. 14 §).", "values": {"fire": "BFS 2024:7 9 kap. 1 § (grounds), 9 kap. 3 § (deterioration), 1 kap. 13-14 §§ (survey of deficiencies, risk assessment)", "structure": "BFS 2024:6 8 kap. 1-2 §§", "hygiene_health": "BFS 2024:8 12 kap. 1-2 §§", "noise": "BFS 2024:10 3 kap. 1-2 §§", "accessibility": "BFS 2024:12 4 kap. 1-2 §§ ('uppenbart oskäligt', 'betydande tekniska skäl')", "dwellings": "BFS 2024:11 4 kap. 1-2 §§", "statutory_basis_until_2026_12_31": "PBL 8 kap. 7 § (anpassning och avsteg with regard to the scope of the change and the building's conditions; accessibility deviations only if 'uppenbart oskäligt'); PBF 3 kap. 23 § (for accessibility: in an ombyggnad only if obviously unreasonable; in another change, as appropriate to the building's conditions)", "statutory_basis_from_2027_01_01": "PBL 8 kap. 5 a § (requirements SHALL be adapted to the extent reasonable given the scope of the change, the building's conditions, resource conservation, varsamhet/förvanskning); 8 kap. 5 b § (större byggnadsändring: remove significant health and safety deficiencies in the whole building)", "deferred_compliance": "PBF 3 kap. 21 § lets the nämnd defer requirements on other parts of the building in a staged ombyggnad. Repealed 2027-01-01."}, "applies_to_uses": ["all"], "strength": "law", "source": "PBL 8 kap. 7 § (until 2026-12-31) and 8 kap. 5 a-5 b §§ (Lag 2026:746, from 2027-01-01); PBF 3 kap. 21, 23 §§; final chapters of BFS 2024:6, 2024:7, 2024:8, 2024:10, 2024:11, 2024:12", "url": "https://rkrattsbaser.gov.se/sfst?bet=2010:900", "confidence": "verified", "conversion_note": "This is the main lever in adaptive reuse. The applicant has to argue it: state, for each requirement not met in full, which ground applies and what makes the result acceptable. Fire and accessibility adaptation have hard limits (see fire_change_of_use_floor and access_change_lift). The prompt's 'PBF 3 kap 23-24 §§' is only partly right: 23 § is the accessibility adaptation rule (repealed 2027-01-01); 24 § is Boverket dispensation for experimental building, not general adaptation.", "section": "change_of_use"}, {"id": "cou_varsamhet_forvanskning", "topic": "Varsamhet (care) and förbud mot förvanskning (ban on disfigurement)", "rule_plain_english": "All changes must be carried out with care for the building's character and its technical, historical, cultural-historical, environmental and artistic values (PBL 8 kap. 17 §). Especially valuable buildings must not be disfigured (PBL 8 kap. 13 §). Each BFS 2024:x regulation repeats the same assessment criteria. For varsamhet: proportions, form and volume, materials and workmanship, colour, and level of detail, plus whether the qualities that matter for residents and users are kept. Buildings from before the 1920s building expansion that keep their main character are to be considered especially valuable unless something speaks against it.", "values": {"varsamhet_criteria": "BFS 2024:7 9 kap. 5 § (identical in the other BFS 2024:x regulations)", "forvanskning_criteria": "BFS 2024:7 9 kap. 6 §", "sarskilt_vardefull_criteria": "BFS 2024:7 9 kap. 7 §", "pre_1920s_presumption": true}, "applies_to_uses": ["all"], "strength": "law", "source": "PBL 8 kap. 13, 17 §§; BFS 2024:7 9 kap. 5-7 §§; BFS 2024:8 12 kap. 4-6 §§", "url": "https://rinfo.boverket.se/BFS2024-8/pdf/BFS2024-8.pdf", "confidence": "verified", "conversion_note": "Varsamhet can justify adapting requirements (ground 1), but it also limits facade changes, for example new windows for daylight or new balconies when converting offices to housing. Check the detaljplan for q- or k-markings.", "section": "change_of_use"}, {"id": "cou_old_vs_new_rules_choice", "topic": "Which rule set applies to a project", "rule_plain_english": "For applications or anmälan received on or after 2026-07-01, the new BFS 2024:x regulations apply. For earlier applications the builder could choose the old BBR/EKS as a complete package. PBL permit rules: cases started on or after 2025-12-01 follow the rewritten 9 kap. From 2027-01-01 the new alteration rules in PBL 8 kap. 5-5 d §§ apply. A project's rule set is fixed by its application date, so record that date per pilot.", "values": {"bbr_eks_last_application_date": "2026-06-30", "pbl_9kap_new_from": "2025-12-01", "pbl_8kap_alteration_rules_new_from": "2027-01-01"}, "applies_to_uses": ["all"], "strength": "law", "source": "BFS 2024:7 final clause 1-2 (in force 2025-07-01, refers to BFS 2024:14 transitional point 3); Lag (2025:974) transitional provisions 1-2; Lag (2026:746)", "url": "https://www.jpinfonet.se/kunskap/nyheter4/2025/augusti/boverkets-nya-byggregler/", "confidence": "sourced", "conversion_note": "The exact BFS 2024:14 transitional wording was taken from secondary sources (JP Infonet, crewless.io) and has not been re-read in BFS 2024:14 itself.", "section": "change_of_use"}, {"id": "fire_vk_overview", "topic": "Verksamhetsklasser (occupancy classes) under BFS 2024:7, and what changed from BBR", "rule_plain_english": "Spaces are classed by four questions: do occupants know the building, can they get to safety on their own, are they awake, and how many are there. BFS 2024:7 2 kap. 9-20 §§ defines Vk 0, 1, 2A, 2B, 2C, 3A, 3B, 3C, 4, 5A, 5B and 5C. Compared with old BBR 5:21: Vk 0 is new (very difficult evacuation, which must be designed by analysis). Old 5D (people held locked in) is now part of Vk 0, point 3. 3C is new (behovsprövat trygghetsboende, sprinkler required). Old Vk 6 (elevated fire-start risk) does not appear as a class in BFS 2024:7. The prescriptive rules (preciserade krav) may only be used for Vk 1-5 in byggnadsklass 1-3.", "values": {"classes_new": ["0", "1", "2A", "2B", "2C", "3A", "3B", "3C", "4", "5A", "5B", "5C"], "classes_old_bbr": ["1", "2A", "2B", "2C", "3A", "3B", "4", "5A", "5B", "5C", "5D", "6"], "prescriptive_route_allowed_for": "Vk 1-5 and byggnadsklass 1-3 (e.g. BFS 2024:7 7 kap. and 8 kap. 5 § andra stycket)"}, "applies_to_uses": ["all"], "strength": "law", "source": "BFS 2024:7 2 kap. 9-20 §§; BBR (BFS 2011:6, consolidated to BFS 2024:5) 5:21-5:216", "url": "https://rinfo.boverket.se/BFS2024-7/pdf/BFS2024-7.pdf", "confidence": "verified", "conversion_note": "A conversion that creates Vk 0 (e.g. more than 1,200 visitors, more than 600 with alcohol, more than 150 people who cannot self-evacuate) needs a fully analytical fire design.", "section": "fire_occupancy_classes"}, {"id": "fire_vk_0", "topic": "Vk 0: spaces where evacuation can be very difficult", "rule_plain_english": "Covers (1) more than 1,200 people without good knowledge of the premises; (2) more than 600 such people where alcohol is served beyond a limited extent; (3) spaces where people are held locked in; (4) more than 150 people with limited or no ability to self-evacuate; (5) health care for people who cannot self-evacuate where the activity has more than one functional unit, or evacuation cannot start without delay.", "values": {"thresholds_persons": {"unfamiliar": 1200, "unfamiliar_with_alcohol": 600, "cannot_self_evacuate": 150}}, "applies_to_uses": ["arena", "large_assembly", "nightclub", "prison", "hospital"], "strength": "law", "source": "BFS 2024:7 2 kap. 9 §", "url": "https://rinfo.boverket.se/BFS2024-7/pdf/BFS2024-7.pdf", "confidence": "verified", "conversion_note": "Outside the prescriptive route. Large hospital wards and detention also fall here.", "section": "fire_occupancy_classes"}, {"id": "fire_vk_1", "topic": "Vk 1: occupants who know the building, can self-evacuate and are awake", "rule_plain_english": "Industry, offices, residents' storage rooms (lägenhetsförråd) and similar.", "values": {"max_travel_to_exit_m": 45, "max_common_path_m": 30, "single_exit_allowed_if_persons_max": 50}, "applies_to_uses": ["office", "industry", "storage", "coworking"], "strength": "law", "source": "BFS 2024:7 2 kap. 10 §; 7 kap. 11 §, 19-20 §§", "url": "https://rinfo.boverket.se/BFS2024-7/pdf/BFS2024-7.pdf", "confidence": "verified", "conversion_note": "This is the starting class of most office buildings. Almost every conversion moves to a stricter class: shorter travel distances, alarms, more compartments.", "section": "fire_occupancy_classes"}, {"id": "fire_vk_2abc", "topic": "Vk 2A, 2B and 2C: public premises with awake occupants unfamiliar with the building", "rule_plain_english": "2A covers activities with at most 150 people; 2B more than 150; 2C more than 150 with alcohol served beyond a limited extent. Examples in 2A/2B: spaces for pupils in schools, shops, health-centre receptions, assembly rooms, restaurant dining areas, public parts of travel terminals and sports halls. 2C covers larger pubs and nightclubs. Consequences: 2B/2C need an automatic fire alarm (7 kap. 46 §) and an evacuation alarm (acoustic up to 600 people in 2B, spoken message above 600 in 2B and always in 2C; 7 kap. 43-44 §§). 2A-2C need exit signs (7 kap. 39 §). Emergency lighting is required in 2B/2C (7 kap. 40 §), as is a posted sign with the occupant number (always in 2B/2C, in 2A unless unnecessary; 7 kap. 41 §).", "values": {"threshold_persons": 150, "max_travel_to_exit_m": {"2A": 30, "2B": 30, "2C": 15}, "max_common_path_m": {"2A": 15, "2B": 15, "2C": 7.5}, "single_exit_to_open_air_allowed_if_persons_max_2A": 30, "evac_alarm_spoken_message_above_persons_2B": 600, "exit_hardware_2B_2C": "emergency exit device up to 1,000 people; panic bar above 1,000 (7 kap. 34 §)", "wheelchair_refuge_capacity_2B_2C": "at least 1% of occupants (7 kap. 32 §)"}, "applies_to_uses": ["school_compulsory", "school_upper_secondary", "retail_shop", "grocery_store", "restaurant_cafe", "assembly_event", "gym_fitness", "library", "primary_care_clinic", "nightclub"], "strength": "law", "source": "BFS 2024:7 2 kap. 11-13 §§; 7 kap. 19-20, 32, 34, 39-41, 43-46 §§", "url": "https://rinfo.boverket.se/BFS2024-7/pdf/BFS2024-7.pdf", "confidence": "verified", "conversion_note": "An office floor (Vk 1, up to 45 m travel) converted to a school, gym or restaurant must reach a 30 m travel distance (15 m in 2C). Deep office plans with central cores often fail this without new stairs. Sprinkler for occupant protection lets distances grow by one third (doubled in 2C) under 7 kap. 21 §.", "section": "fire_occupancy_classes"}, {"id": "fire_vk_3abc", "topic": "Vk 3A, 3B and 3C: dwellings (occupants know the building but may be asleep)", "rule_plain_english": "3A: dwellings in blocks of flats and houses, family day care. 3B: dwellings with boendeenheter (units sharing some dwelling functions) and their shared rooms, e.g. co-living or student corridors. 3C: needs-tested trygghetsboenden and other housing for people who may need support or care part of the day; these residents may have difficulty self-evacuating. 3A needs smoke alarms; 3B needs an automatic fire alarm and an evacuation alarm; 3C needs smoke alarms and the whole building must be sprinklered (automatic water sprinkler for occupant protection or a residential sprinkler system; 7 kap. 47-48 §§). Each dwelling (3A/3C) normally needs two independent exits (7 kap. 9 §); single-stair solutions are allowed under 7 kap. 11 § (Tr1 up to 20 storeys, Tr2 up to 16 storeys, at most 50 persons) or via rescue-service window evacuation (7 kap. 13-15 §§).", "values": {"max_travel_to_exit_m": 45, "max_common_path_m": 30, "3B_group_two_exits_up_to_persons": 6, "sprinkler_required": {"3A": false, "3B": false, "3C": true}, "window_escape_max_sill_above_ground_m": {"general_7kap13": 2.0, "3A_bkl2_3_7kap14": 5.0, "with_fixed_ladder": 8.0}, "rescue_service_window_max_sill_above_standing_m": 23, "rescue_service_window_max_compartment_m2": 200, "max_response_time_min": {"default": 10, "sprinklered_1_3A_3B": 20}}, "applies_to_uses": ["housing_apartment", "student_housing", "co_living", "senior_housing"], "strength": "law", "source": "BFS 2024:7 2 kap. 14-16 §§; 7 kap. 9, 11, 13-15, 19-20, 43, 46-48 §§", "url": "https://rinfo.boverket.se/BFS2024-7/pdf/BFS2024-7.pdf", "confidence": "verified", "conversion_note": "On change of use to 3A/3B/3C there are no adaptation exceptions for compartmentation (10 kap. 3 §) or for compartmentation of escape routes (10 kap. 2 §), and none for the number of exits (10 kap. 4 §). 3C sprinkler cannot be adapted away either (10 kap. 7 §). Office corridors must be rebuilt as fire-separated escape routes, and every flat becomes its own fire compartment.", "section": "fire_occupancy_classes"}, {"id": "fire_vk_4", "topic": "Vk 4: hotels and temporary lodging (occupants unfamiliar with the building, asleep)", "rule_plain_english": "Guest rooms, dormitories and similar in hotels, hostels, B&Bs and other temporary lodging. Buildings with at least 9 guests or at least 5 guest rooms need an automatic fire alarm and an evacuation alarm (7 kap. 43, 46 §§); smaller ones need smoke alarms (7 kap. 47 §). Each guest room or dormitory needs two exits (7 kap. 9 §), and an evacuation plan must be posted in each room (7 kap. 42 §).", "values": {"alarm_threshold": {"guests": 9, "guest_rooms": 5}, "max_travel_to_exit_m": 30, "max_common_path_m": 15}, "applies_to_uses": ["hotel"], "strength": "law", "source": "BFS 2024:7 2 kap. 17 §; 7 kap. 9, 19-20, 42-43, 46-47 §§", "url": "https://rinfo.boverket.se/BFS2024-7/pdf/BFS2024-7.pdf", "confidence": "verified", "conversion_note": "Office to hotel: every room becomes its own compartment with no adaptation allowed on change of use (10 kap. 3 §). The 30 m travel distance is stricter than the office's 45 m.", "section": "fire_occupancy_classes"}, {"id": "fire_vk_5abc", "topic": "Vk 5A, 5B and 5C: people with limited or no ability to self-evacuate", "rule_plain_english": "5A: preschools, day-activity premises and similar. 5B: dwellings and shared rooms in needs-tested special housing (e.g. SÄBO, LSS group homes). 5C: health care with one functional unit only, where moving patients can start without delay; larger or slower-to-evacuate care is Vk 0. Fire alarm is required in 5A, 5B and 5C (7 kap. 46 §) and an acoustic evacuation alarm in 5A and 5B (7 kap. 43 §). Sprinkler: required in fire compartments with 5B (occupant-protection sprinkler or residential sprinkler system), and in 5C as occupant-protection sprinkler with enhanced reliability (7 kap. 48 §). Every fire compartment in 5A/5B/5C must allow a return route after passage through an exit door (7 kap. 36 §).", "values": {"max_travel_to_exit_m": {"5A": 30, "5B": 45, "5C": 30}, "max_common_path_m": {"5A": 15, "5B": 30, "5C": 15}, "single_exit_to_open_air_allowed_if_persons_max": 30, "sprinkler_required": {"5A": false, "5B": true, "5C": "true, enhanced reliability"}}, "applies_to_uses": ["preschool", "elderly_care_home", "lss_group_home", "day_centre", "hospital"], "strength": "law", "source": "BFS 2024:7 2 kap. 18-20 §§; 7 kap. 11, 19-20, 36, 43, 46, 48 §§; 10 kap. 7 §", "url": "https://rinfo.boverket.se/BFS2024-7/pdf/BFS2024-7.pdf", "confidence": "verified", "conversion_note": "On change of use, sprinkler in 5B and 5C cannot be adapted away (10 kap. 7 §), and compartmentation in 5A/5B/5C cannot be relaxed (10 kap. 3 §). Budget for sprinkler from day one.", "section": "fire_occupancy_classes"}, {"id": "fire_byggnadsklass", "topic": "Byggnadsklasser (building classes, formerly Br0-Br3)", "rule_plain_english": "Class 0: more than 20 storeys above ground or more than 2 storeys below ground (analytical design only). Class 1: 3-20 storeys, except 3-storey one- or two-family houses and ancillary buildings. Class 2: 2 storeys with building footprint over 200 m², or 3-storey one- or two-family houses. Class 3: 1 storey, or 2 storeys with footprint up to 200 m². A top storey where nobody stays permanently is not counted, nor a mezzanine of at most 50% of the floor below and at most 100 m².", "values": {"bkl0_storeys_above_gt": 20, "bkl0_storeys_below_gt": 2, "bkl1_storeys": [3, 20], "bkl2_bkl3_footprint_split_m2": 200, "mezzanine_ignored_max_m2": 100}, "applies_to_uses": ["all"], "strength": "law", "source": "BFS 2024:7 2 kap. 5-8 §§", "url": "https://rinfo.boverket.se/BFS2024-7/pdf/BFS2024-7.pdf", "confidence": "verified", "conversion_note": "A change of use does not normally change the building class, but it does change the class-dependent requirements: structural fire resistance (3 kap.) differs for Vk 3A-5C versus Vk 1-2C.", "section": "fire_occupancy_classes"}, {"id": "fire_change_of_use_floor", "topic": "Where fire requirements may NOT be relaxed on change of use", "rule_plain_english": "When a space gets a new use, adaptation of the fire safety level is limited. The limits do not apply where compliance would be obviously unreasonable or only a negligible improvement (10 kap. 1 §). No deviation is allowed for: compartmentation of escape routes serving new 3A, 3B, 3C or 5B (2 §); compartmentation where the new use is 3A, 3B, 3C, 4, 5A, 5B or 5C (3 §); number of exits for new 2B, 2C, 3A, 3B, 3C or 5B (4 §); fire and evacuation alarms for any change of use (5 §); exit signs for any change of use (6 §); sprinkler for new 3C, 5B or 5C (7 §); smoke ventilation of stairwells when it is the only access route to the changed space, or serves new 3A, 3B or 3C (8 §); access to riser pipes (stigarledning) for any change of use (9 §).", "values": {"paragraphs": "BFS 2024:7 10 kap. 1-9 §§"}, "applies_to_uses": ["all"], "strength": "law", "source": "BFS 2024:7 10 kap. 1-9 §§ (section 1 reportedly amended by BFS 2025:10)", "url": "https://rinfo.boverket.se/BFS2024-7/pdf/BFS2024-7.pdf", "confidence": "verified", "conversion_note": "This list is the core of a fire 'fit test' for conversion: if the target use is in the list, treat the item as a hard requirement, not a negotiable adaptation.", "section": "fire_occupancy_classes"}, {"id": "fire_egress_dimensions", "topic": "Exit counts, widths and stair/riser triggers (prescriptive route)", "rule_plain_english": "Number of independent exits per activity: 2 up to 600 persons, 3 for 601-1,000, 4 above 1,000; at least 5 m apart. Clear width of exit doors: 0.80 m for up to 150 persons, 1.15 m above 150, and in total at least 1.00 m per 150 persons. Escape route passages: 0.90 m clear for up to 150 persons, 1.20 m above. Distances are reduced by four times any level difference (7 kap. 22 §). A riser pipe is needed when the most remote floor is more than 24 m above the access point (pressurised above 40 m); a firefighting lift is needed above 30 m (8 kap. 10, 13 §§). The maximum distance from the access route to the most remote point is 50 m, or 80 m with sprinkler (8 kap. 9 §).", "values": {"exits_by_persons": {"<=600": 2, "601-1000": 3, ">1000": 4}, "min_exit_spacing_m": 5, "door_clear_width_m": {"<=150": 0.8, ">150": 1.15}, "door_total_width_m_per_150_persons": 1.0, "passage_clear_width_m": {"<=150": 0.9, ">150": 1.2}, "riser_trigger_height_m": 24, "pressurised_riser_trigger_m": 40, "firefighting_lift_trigger_m": 30}, "applies_to_uses": ["all"], "strength": "law", "source": "BFS 2024:7 7 kap. 9, 22, 27-29 §§; 8 kap. 9, 10, 13 §§", "url": "https://rinfo.boverket.se/BFS2024-7/pdf/BFS2024-7.pdf", "confidence": "verified", "conversion_note": "Total door width (1.0 m per 150 persons) and the 600-person threshold for a third exit usually cap the capacity of an assembly or retail conversion on an office floor.", "section": "fire_occupancy_classes"}, {"id": "fire_load_density", "topic": "Default variable fire load per use", "rule_plain_english": "The design variable fire load is the 80th percentile for the use, but these fixed values may be used instead: 1,600 MJ/m² for archives, libraries, storage; 1,200 MJ/m² for malls and shopping centres; 600 MJ/m² for cinemas, dwellings, preschools, hotels, offices, food shops, residents' storage rooms, car garages, restaurants, schools, theatre and care premises; 50 MJ/m² for stables, concrete-products industry, breweries and similar.", "values": {"MJ_per_m2": {"archive_library_storage": 1600, "mall_shopping_centre": 1200, "office_housing_school_hotel_restaurant_care_cinema_theatre_foodshop_garage": 600, "stables_breweries": 50}}, "applies_to_uses": ["all"], "strength": "law", "source": "BFS 2024:7 2 kap. 3 §", "url": "https://rinfo.boverket.se/BFS2024-7/pdf/BFS2024-7.pdf", "confidence": "verified", "conversion_note": "Office to library, archive or storage raises the fire load from 600 to 1,600 MJ/m², which matters for structural fire resistance and compartment walls. Office to housing or school keeps it the same.", "section": "fire_occupancy_classes"}, {"id": "occ_density_law_2024", "topic": "Design number of persons: binding defaults in BFS 2024:7", "rule_plain_english": "The design number of persons is the maximum number expected in the space given its use and size. If that is not known, use 0.5 persons/m² for retail premises, 3 persons/m² for pubs and bars, and 2.5 persons/m² for assembly premises. These are the only densities left in the binding text.", "values": {"persons_per_m2": {"affarslokal_retail": 0.5, "pub_bar": 3.0, "samlingslokal_assembly": 2.5}}, "applies_to_uses": ["retail_shop", "grocery_store", "restaurant_cafe", "nightclub", "assembly_event"], "strength": "law", "source": "BFS 2024:7 2 kap. 4 §", "url": "https://rinfo.boverket.se/BFS2024-7/pdf/BFS2024-7.pdf", "confidence": "verified", "conversion_note": "Base area is not specified in the binding text (old BBR used net area). An assembly room at 2.5 persons/m² passes 150 persons, and so moves into Vk 2B, at about 60 m².", "section": "occupancy_density"}, {"id": "occ_density_bbr_table_5333", "topic": "Old BBR table 5:333 design densities (repealed general advice, still useful as a reference)", "rule_plain_english": "Old BBR general advice gave design densities in persons per m² of net area. It is repealed for new applications from 2026-07-01 but is still widely used as a starting point in fire strategies. Restaurants used the number of seats or 1.0/m²; fixed-seat assembly used the number of seats. For libraries, conference rooms and restaurants, the net area could exclude loose furniture.", "values": {"persons_per_m2_net": {"office_vk1": 0.1, "library": 0.1, "dance_hall": 2.5, "classroom": 0.5, "conference_room": 0.7, "church": 1.0, "mall_department_store_shop": 0.5, "museum_gallery": 0.25, "pub_bar": 3.0, "restaurant": "number of seats or 1.0", "assembly_seated_loose_chairs": 1.7, "assembly_standing_and_seated": 2.5, "assembly_fixed_seats": "number of seats"}}, "applies_to_uses": ["office", "library", "school_compulsory", "school_upper_secondary", "assembly_event", "retail_shop", "grocery_store", "museum", "restaurant_cafe", "nightclub", "church"], "strength": "guidance", "source": "BBR (BFS 2011:6) avsnitt 5:333, tabell 5:333 (allmänt råd, BFS 2011:26); consolidated version to BFS 2024:5, p. 52-53", "url": "https://rinfo.boverket.se/BFS2011-6/dok/BFS2024-5_Konsolidering.pdf", "confidence": "verified", "conversion_note": "Office at 0.1/m² versus classroom at 0.5/m² and restaurant at about 1.0/m²: converting an office floor raises occupant load 5-10 times. That drives exit width, toilets and ventilation. Strength is 'guidance' only for projects under the old BBR; for new applications treat these values as practice.", "section": "occupancy_density"}, {"id": "occ_density_gaps", "topic": "Densities for uses not covered", "rule_plain_english": "Neither BFS 2024:7 nor the old BBR table gives a density for gyms, healthcare, preschools, hotels or housing. For these the design number comes from the operator programme: places, beds, rooms. Boverket's analytical design guidance (BBRAD, BFS 2011:27) may contain further values but was not checked here.", "values": {}, "applies_to_uses": ["gym_fitness", "primary_care_clinic", "elderly_care_home", "lss_group_home", "preschool", "hotel", "housing_apartment", "student_housing", "co_living", "senior_housing"], "strength": "none", "source": "BFS 2024:7 2 kap. 4 § (method: the expected maximum number of persons)", "url": "https://rinfo.boverket.se/BFS2024-7/pdf/BFS2024-7.pdf", "confidence": "indicative", "conversion_note": "Take occupancy from the use file (occupancy.unit) rather than from area for these uses.", "section": "occupancy_density"}, {"id": "access_design_dimensions", "topic": "Dimensioning wheelchair: plan, turning circle and clear passage", "rule_plain_english": "Where buildings, fixed furniture or equipment must be accessible, design for a wheelchair of 0.70 x 1.30 m, a 1.50 m turning circle and at least 0.80 m clear passage. Inside individual dwellings the figures are smaller: 0.70 x 1.20 m, 1.30 m turning circle and 0.76 m clear passage. The same 1.50 m and 0.80 m figures appear in the fire regulation for wheelchair refuges (BFS 2024:7 2 kap. 32 §) and in the AFS 2023:12 general advice for accessible workplaces.", "values": {"general": {"wheelchair_plan_m": [0.7, 1.3], "turning_circle_d_m": 1.5, "clear_passage_min_m": 0.8}, "inside_dwelling": {"wheelchair_plan_m": [0.7, 1.2], "turning_circle_d_m": 1.3, "clear_passage_min_m": 0.76}}, "applies_to_uses": ["all"], "strength": "law", "source": "BFS 2024:12 1 kap. 6 §", "url": "https://rinfo.boverket.se/BFS2024-12/pdf/BFS2024-12.pdf", "confidence": "verified", "conversion_note": "These are binding dimensioning figures (old BBR 3:12 had the same values). Office doors (often 0.8-0.9 m leafs) can fall short of 0.80 m clear passage once frame and leaf thickness are subtracted. Check every door on the accessible route.", "section": "accessibility"}, {"id": "access_level_changes_ramps_lifts", "topic": "Level changes, ramps and lifts in new buildings", "rule_plain_english": "Circulation spaces with level changes need a ramp or lift as well as stairs; a lift is required for level changes over 1 m. A ramp may slope at most 1:12, with landings long enough for a wheelchair pushed by a helper. An accessibility lift must fit a wheelchair user plus a helper, with a clear car short side of at least 1,100 mm. Buildings over ten storeys must give access to more than one passenger lift. In dwelling blocks over four storeys a stretcher must fit in a lift (3 kap. 5 §). Under PBF 3 kap. 4 §, dwellings in buildings with fewer than three storeys need not be reached by lift, but a lift must be installable without difficulty.", "values": {"lift_required_if_level_difference_gt_m": 1.0, "ramp_max_slope": "1:12", "lift_car_min_short_side_mm": 1100, "multiple_lifts_if_storeys_gt": 10, "stretcher_lift_if_dwelling_storeys_gt": 4}, "applies_to_uses": ["all"], "strength": "law", "source": "BFS 2024:12 2 kap. 2, 4, 5 §§; 3 kap. 5 §; PBF 3 kap. 4 §", "url": "https://rinfo.boverket.se/BFS2024-12/pdf/BFS2024-12.pdf", "confidence": "verified", "conversion_note": "These are new-build rules; for the changed part they apply subject to BFS 2024:12 4 kap. 1 § (adaptation only if obviously unreasonable or for significant technical reasons). Raised office entrance floors and split levels are common blockers.", "section": "accessibility"}, {"id": "access_change_lift", "topic": "Lift requirement when altering multi-dwelling buildings", "rule_plain_english": "When a multi-dwelling building with more than two storeys is altered, an accessible lift must be installed if there is none and the alteration includes major work in the stairwell, a re-planned layout or extensive work on the structure. Exceptions apply for förvanskning, negligible improvement, significant technical reasons, health and safety or cultural values, or if a lift is unsuitable for residential quality. From 2027-01-01 a new PBF 3 kap. 4 b § says that a building with fewer than four storeys after a change need not get a lift to make dwellings accessible, though an existing lift may not be taken out of use.", "values": {"storeys_trigger_gt": 2, "pbf_from_2027_no_lift_needed_if_storeys_lt": 4}, "applies_to_uses": ["housing_apartment", "student_housing", "co_living", "senior_housing", "elderly_care_home"], "strength": "law", "source": "BFS 2024:12 4 kap. 5 §; PBF 3 kap. 4 b § (Förordning 2026:1265, in force 2027-01-01)", "url": "https://rinfo.boverket.se/BFS2024-12/pdf/BFS2024-12.pdf", "confidence": "verified", "conversion_note": "Office buildings usually already have lifts, but check car size (1,100 mm short side) and whether every new dwelling level is served. How BFS 2024:12 4 kap. 5 § (more than 2 storeys) interacts with the new PBF 4 b § (fewer than 4 storeys) from 2027 is unclear; see open_questions.", "section": "accessibility"}, {"id": "access_public_premises_wc", "topic": "Accessible WC in public premises (publik lokal)", "rule_plain_english": "If a public premises has toilets for the public, at least one must be accessible, with room to turn a wheelchair and for sideways transfer between toilet and wheelchair on both sides. Its fixed furniture and equipment must be usable by people with limited mobility or orientation ability. BFS 2024:12 gives no room size. The old BBR 3:1453 general advice said at least 2.2 x 2.2 m and, in premises with public WCs on several floors, one accessible WC per such floor.", "values": {"min_accessible_wc_if_public_wc_exist": 1, "transfer_both_sides": true, "old_bbr_advice_room_m": [2.2, 2.2], "old_bbr_advice_one_per_floor_with_public_wc": true}, "applies_to_uses": ["retail_shop", "grocery_store", "restaurant_cafe", "assembly_event", "library", "gym_fitness", "primary_care_clinic", "school_compulsory", "school_upper_secondary", "hotel"], "strength": "law", "source": "BFS 2024:12 2 kap. 7 §, 3 kap. 7 §; old BBR (BFS 2011:6) 3:1453 allmänt råd (repealed)", "url": "https://rinfo.boverket.se/BFS2024-12/pdf/BFS2024-12.pdf", "confidence": "verified", "conversion_note": "The 2.2 x 2.2 m figure lives on in AFS 2023:12 3 kap. 58 § (general advice) for workplaces. It is a safe planning value: about 4.8 m² per accessible WC. Note: the prompt's 'BBR 3:146' is actually accessibility in single-level dwellings; the public WC rule was 3:1453.", "section": "accessibility"}, {"id": "access_public_premises_other", "topic": "Other public-premises accessibility requirements", "rule_plain_english": "In public premises where the sound environment is essential for people with limited orientation ability to receive important information, it must be designed for good audibility, speech intelligibility and orientation. Assembly halls and receptions must have a hearing-loop or similar sound transfer system. Not all audience places in an assembly hall need to be wheelchair-accessible. Main entrances must be accessible and clearly perceivable.", "values": {"hearing_loop_required_in": ["samlingssalar", "receptioner"]}, "applies_to_uses": ["assembly_event", "library", "primary_care_clinic", "school_compulsory", "school_upper_secondary", "hotel", "retail_shop", "grocery_store"], "strength": "law", "source": "BFS 2024:12 2 kap. 1, 6 §§; 3 kap. 1, 6 §§", "url": "https://rinfo.boverket.se/BFS2024-12/pdf/BFS2024-12.pdf", "confidence": "verified", "conversion_note": "Hearing loops in receptions are cheap to add but often forgotten in office-to-clinic or office-to-library conversions.", "section": "accessibility"}, {"id": "access_dwellings", "topic": "Accessibility inside dwellings", "rule_plain_english": "At least one hygiene room per dwelling must be accessible, with space for fixed fittings. Kitchens must have space for fittings that can be made accessible. In at least one sleeping room it must be possible to arrange free space for assistance along both long sides and at the foot of a bed; in housing with boendeenheter this applies in every unit, but not in student housing. In multi-level dwellings at least the entrance level must be accessible. A stretcher must be able to reach every dwelling or boendeenhet. PBL 8 kap. 6 § lets up to 80% of student dwellings in a building be exempt from accessibility, though they must still be visitable.", "values": {"student_housing_max_exempt_share": 0.8}, "applies_to_uses": ["housing_apartment", "student_housing", "co_living", "senior_housing"], "strength": "law", "source": "BFS 2024:12 2 kap. 8-12 §§, 3 kap. 2, 8, 9 §§; PBL 8 kap. 6 § (Lag 2025:519)", "url": "https://rinfo.boverket.se/BFS2024-12/pdf/BFS2024-12.pdf", "confidence": "verified", "conversion_note": "The 80% student-housing exemption is a major enabler for compact office-to-student-housing conversions.", "section": "accessibility"}, {"id": "access_workplace_exemption", "topic": "Exemption for work premises", "rule_plain_english": "The PBL accessibility requirements do not apply to a work premises (arbetslokal) where they are unjustified given the type of activity. Separately, AFS 2023:12 requires existing workplaces to be accessible to employees who need it. In new builds and ombyggnad, workplaces must be designed for a small outdoor electric wheelchair, with at least one accessible WC per floor.", "values": {"afs_new_or_rebuilt_accessible_wc_per_floor": 1, "afs_advice_turning_circle_m": 1.5, "afs_advice_door_clear_m": 0.8}, "applies_to_uses": ["office", "industry", "storage", "coworking", "retail_shop", "grocery_store", "restaurant_cafe", "food_hall"], "strength": "law", "source": "PBL 8 kap. 6 § första stycket 1; AFS 2023:12 3 kap. 3-4 §§", "url": "https://www.av.se/globalassets/filer/publikationer/foreskrifter/utformning-av-arbetsplatser-afs2023-12.pdf", "confidence": "verified", "conversion_note": "Staff areas in any converted use (school, care, retail back-of-house) fall under AFS 2023:12 3 kap. 4 §, which requires one accessible WC per floor when a building is newly built or rebuilt.", "section": "accessibility"}, {"id": "access_hin", "topic": "Enkelt avhjälpta hinder (easily remedied obstacles) in existing public premises: HIN", "rule_plain_english": "Retroactive rule: in existing public premises and public places, obstacles that are easy to remedy given practical and economic conditions must be removed. Covered obstacles include small level differences, heavy doors and poorly placed controls; missing contrast or warning markings; poor signage; poor sound environment; poor or glaring lighting; missing handrails; poorly designed fixed furniture (e.g. hygiene rooms); and, on public places, accessible parking. The general advice includes: ramps no steeper than 1:12, with 1:20 or flatter preferred; a light-reflectance contrast of at least 0.40 (NCS) on stairs and glazed areas; handrails extending at least 30 cm beyond the stair or ramp; and door-opener push buttons centred about 80 cm above floor and at least 70 cm from corners.", "values": {"ramp_max_slope_advice": "1:12", "ramp_preferred_slope_advice": "1:20", "contrast_ncs_min": 0.4, "handrail_extension_cm": 30, "door_button_height_cm": 80}, "applies_to_uses": ["retail_shop", "grocery_store", "restaurant_cafe", "assembly_event", "library", "primary_care_clinic", "hotel", "school_compulsory", "school_upper_secondary", "gym_fitness"], "strength": "law", "source": "Boverkets föreskrifter och allmänna råd (2011:13) om avhjälpande av enkelt avhjälpta hinder till och i lokaler dit allmänheten har tillträde och på allmänna platser, HIN 3 (amended by BFS 2013:9), 5-17 §§ (ramp, contrast and handrail values are allmänt råd = guidance); PBL 8 kap. 12 § andra stycket", "url": "https://rinfo.boverket.se/BFS2011-13/pdf/BFS2013-9.pdf", "confidence": "sourced", "conversion_note": "HIN applies to existing public premises even without a building permit, and the first public use after conversion triggers it. HIN is not among the BFS 2024:x regulations; it appears to still apply, and a secondary source mentions new PBL provisions on enkelt avhjälpta hinder from 2027-01-01 (Lag 2026:746). Not verified; see open_questions.", "section": "accessibility"}, {"id": "access_alm", "topic": "Accessibility of public places (allmänna platser): ALM", "rule_plain_english": "Boverket's regulations on accessibility and usability of public places and areas for buildings other than buildings (ALM 2, BFS 2011:5) apply to new or changed public places. They matter for conversion only where the project also changes adjoining public space or site paths.", "values": {}, "applies_to_uses": ["all"], "strength": "law", "source": "BFS 2011:5 (ALM 2)", "url": "https://www.boverket.se/", "confidence": "indicative", "conversion_note": "Status after the 2025 reform not verified (it may be affected by BFS 2024:13 'krav på tomter m.m.'). See open_questions.", "section": "accessibility"}, {"id": "staff_afs_status", "topic": "Which workplace regulation applies", "rule_plain_english": "AFS 2023:12 'Utformning av arbetsplatser' took effect on 2025-01-01 and repealed AFS 2020:1 'Arbetsplatsens utformning', as part of the Work Environment Authority's restructured AFS series. Personalutrymmen (staff facilities) are covered by 3 kap. 37-65 §§. The employer is responsible; the designer is responsible for 3 kap. 4 § (accessible workplaces in new builds and ombyggnad).", "values": {"in_force": "2025-01-01", "repealed": "AFS 2020:1"}, "applies_to_uses": ["office", "coworking", "retail_shop", "grocery_store", "restaurant_cafe", "food_hall"], "strength": "law", "source": "AFS 2023:12 övergångsbestämmelser 1-2; 2 kap. 7 §", "url": "https://www.av.se/globalassets/filer/publikationer/foreskrifter/utformning-av-arbetsplatser-afs2023-12.pdf", "confidence": "verified", "conversion_note": "Every use with employees (school, care, hotel, shop, gym) needs staff facilities on top of the user-facing programme. Do not forget them in the area schedule.", "section": "staff_facilities"}, {"id": "staff_personalutrymmen_general", "topic": "Staff facilities: number, location and size", "rule_plain_english": "The number, location, size and furnishing of staff facilities must suit the type and duration of work, the number of employees normally using them at the same time, and their functional ability. They must be easy to reach and may not be used for activities or storage that reduce their usefulness. No m² values are given.", "values": {"area_m2": null}, "applies_to_uses": ["office", "coworking", "retail_shop", "grocery_store", "restaurant_cafe", "food_hall"], "strength": "law", "source": "AFS 2023:12 3 kap. 38-39 §§", "url": "https://www.av.se/globalassets/filer/publikationer/foreskrifter/utformning-av-arbetsplatser-afs2023-12.pdf", "confidence": "verified", "conversion_note": "Size is 'strength: none' at law level; take m² from operator programmes.", "section": "staff_facilities"}, {"id": "staff_changing_showers_storage", "topic": "Clothes storage, changing rooms and showers", "rule_plain_english": "There must be storage for private clothes, lockable if kept in changing rooms, plus lockable storage for valuables. Changing rooms (or another suitable space, such as a roomy toilet) are required for dirty or sweaty work or where special work clothes must be worn. Changing rooms must normally be separate for men and women if used at the same time, with seats for those who normally sit at the same time. A shower is normally required for sweaty or dirty work and always where there is a risk of infection or strong-smelling or hazardous substances; the shower must be in a washroom next to the changing rooms.", "values": {"changing_room_trigger": "smutsande/svettdrivande arbete or särskilda arbetskläder", "sex_separation": "normally, if used simultaneously"}, "applies_to_uses": ["primary_care_clinic", "elderly_care_home", "lss_group_home", "preschool", "school_compulsory", "school_upper_secondary", "restaurant_cafe", "gym_fitness", "hotel", "industry"], "strength": "law", "source": "AFS 2023:12 3 kap. 40-55 §§", "url": "https://www.av.se/globalassets/filer/publikationer/foreskrifter/utformning-av-arbetsplatser-afs2023-12.pdf", "confidence": "verified", "conversion_note": "Care, preschool and kitchen staff wear work clothes, so they need changing rooms with showers. Office conversions rarely have the drainage in place for these; that is a plumbing (services layer) cost.", "section": "staff_facilities"}, {"id": "staff_eating_rest", "topic": "Eating space, pause space, rest room and on-call room", "rule_plain_english": "Employees must be able to eat in suitable spaces with tables and chairs with backrests, with a fridge, food heating and dishwashing nearby. There must be a place for pauses with enough seats with backrests. A rest space for temporary, undisturbed lying-down rest must exist or be quick to arrange. General advice: a dedicated rest room may be needed when more than 50 people work at the same time in the same area, with a toilet nearby. Staff on on-call duty (jour) need an undisturbed single on-call room, with a toilet and shower nearby.", "values": {"dedicated_rest_room_advice_if_simultaneous_staff_gt": 50}, "applies_to_uses": ["office", "coworking", "retail_shop", "grocery_store", "restaurant_cafe", "food_hall"], "strength": "law", "source": "AFS 2023:12 3 kap. 60-65 §§ (the over-50 threshold is allmänt råd = guidance)", "url": "https://www.av.se/globalassets/filer/publikationer/foreskrifter/utformning-av-arbetsplatser-afs2023-12.pdf", "confidence": "verified", "conversion_note": "On-call rooms matter for 24/7 care (SÄBO, LSS, healthcare).", "section": "staff_facilities"}, {"id": "staff_room_height_daylight", "topic": "Room height, daylight and outlook at workplaces", "rule_plain_english": "Workplaces must have enough area and free height to limit risk of ill health. General advice: room height at least 2.40 m; in limited parts, at least 2.10 m under horizontal ceilings or 1.90 m under sloping ceilings where standing height is needed; at least 2.70 m in teaching rooms and rooms for larger numbers of people. Workplaces must give satisfactory daylight and outlook during the working day. If that is impossible because neither rebuilding nor moving is reasonable, or because of the type of activity, compensating measures are required. SS-EN 17037:2018 is referenced as an example assessment method.", "values": {"room_height_advice_m": {"general": 2.4, "local_standing_min_flat": 2.1, "local_standing_min_sloped": 1.9, "teaching_or_many_people": 2.7}, "daylight_method_example": "SS-EN 17037:2018"}, "applies_to_uses": ["office", "coworking", "retail_shop", "grocery_store", "restaurant_cafe", "food_hall"], "strength": "law", "source": "AFS 2023:12 3 kap. 5 § (heights are allmänt råd); 5 kap. 25 §", "url": "https://www.av.se/globalassets/filer/publikationer/foreskrifter/utformning-av-arbetsplatser-afs2023-12.pdf", "confidence": "verified", "conversion_note": "The daylight and outlook duty applies to permanent workplaces in every converted use. Deep office cores turned into staff rooms or back-of-house need a justification. With Boverket's room-height figures removed (old BBR 3:3112-3:3113: 2.70 m in public premises), the AFS 2.70 m advice for teaching rooms is now the main national reference for schools.", "section": "staff_facilities"}, {"id": "staff_workplace_area", "topic": "Workplace floor area per employee", "rule_plain_english": "No m² per employee is set; only 'sufficient area and free height' (3 kap. 5 §) and normally a free working space of at least 0.8 m where work involves force, twisting, crouching or bending (3 kap. 6 §).", "values": {"area_per_employee_m2": null, "free_working_space_min_m": 0.8}, "applies_to_uses": ["office", "coworking", "retail_shop", "grocery_store", "restaurant_cafe", "food_hall"], "strength": "law", "source": "AFS 2023:12 3 kap. 5-6 §§", "url": "https://www.av.se/globalassets/filer/publikationer/foreskrifter/utformning-av-arbetsplatser-afs2023-12.pdf", "confidence": "verified", "conversion_note": "A size of null with strength 'none' is the honest answer for m² per workplace.", "section": "staff_facilities"}, {"id": "san_dwelling", "topic": "WC and hygiene in dwellings", "rule_plain_english": "Every dwelling must have a room for personal hygiene with fixed fittings for hygiene. At least one hygiene room must be accessible (BFS 2024:12 2 kap. 9 §). In housing with boendeenheter (one-person units), a hygiene room may be shared by at most three units; it must be on the same floor as, and adjacent to, those units. This sharing is not allowed in särskilda boendeformer för äldre or special housing for disabled people (2 kap. 10-11 §§). Laundry may be shared and outside the dwelling, sized for the dwellings sharing it.", "values": {"hygiene_rooms_per_dwelling_min": 1, "max_units_sharing_one_hygiene_room": 3}, "applies_to_uses": ["housing_apartment", "student_housing", "co_living", "senior_housing"], "strength": "law", "source": "BFS 2024:11 2 kap. 3, 4, 7, 8, 10, 11 §§; 3 kap. 1-2 §§", "url": "https://rinfo.boverket.se/BFS2024-11/pdf/BFS2024-11.pdf", "confidence": "verified", "conversion_note": "Shared bathrooms (1 per 3 units) are a strong enabler for co-living or student conversion of offices with few drainage risers: fewer bathrooms means fewer new vertical drains.", "section": "sanitary"}, {"id": "san_workplace", "topic": "Toilets at workplaces", "rule_plain_english": "There must be enough toilets and washbasins, normally near the workplace, pause spaces, changing and shower rooms. Toilet rooms must be large enough, separate, have a lockable door and no direct connection to an eating space, with a washbasin in or next to the room. General advice: one toilet per started group of 15 employees. Existing workplaces must have toilets accessible to all who need them; general advice: at least 2.2 x 2.2 m, with alarm, contrast markings and suitable fittings. In new builds and ombyggnad, at least one accessible toilet per floor.", "values": {"employees_per_wc_advice": 15, "rounding": "per påbörjat 15-tal (round up)", "accessible_wc_room_advice_m": [2.2, 2.2], "accessible_wc_per_floor_new_or_rebuild": 1}, "applies_to_uses": ["office", "coworking", "retail_shop", "grocery_store", "restaurant_cafe", "food_hall"], "strength": "law", "source": "AFS 2023:12 3 kap. 4 § p. 6, 56-58 §§ (1/15 and 2.2 x 2.2 m are allmänt råd = guidance)", "url": "https://www.av.se/globalassets/filer/publikationer/foreskrifter/utformning-av-arbetsplatser-afs2023-12.pdf", "confidence": "verified", "conversion_note": "Staff WC count = ceil(staff_on_site / 15), separate from any public WC count.", "section": "sanitary"}, {"id": "san_public", "topic": "Toilets for the public in public premises", "rule_plain_english": "Boverket's rules do not say WHEN public toilets are required or HOW MANY. They only say that if public toilets exist, at least one must be accessible. Whether and how many follows from other legislation, e.g. the food-premises rules for restaurants, the Skollagen and AFS for schools, and municipal programmes, or from practice.", "values": {"count_rule": null}, "applies_to_uses": ["retail_shop", "grocery_store", "restaurant_cafe", "assembly_event", "library", "gym_fitness", "primary_care_clinic"], "strength": "none", "source": "BFS 2024:12 2 kap. 7 §", "url": "https://rinfo.boverket.se/BFS2024-12/pdf/BFS2024-12.pdf", "confidence": "verified", "conversion_note": "Public WC counts must come from the use files (operator or municipal programme, or practice), not from national law.", "section": "sanitary"}, {"id": "san_wv_installations_change", "topic": "Water and drainage installations on alteration", "rule_plain_english": "When a building is altered, the changed part must meet the water and drainage requirements (BFS 2024:8 8 kap. 3-6 §§). These may be adapted only if the improvement would be negligible. Installations taken out of use must be dismantled or plugged as close to the live pipe as possible.", "values": {}, "applies_to_uses": ["all"], "strength": "law", "source": "BFS 2024:8 13 kap. 8-9 §§", "url": "https://rinfo.boverket.se/BFS2024-8/pdf/BFS2024-8.pdf", "confidence": "verified", "conversion_note": "Little room for adaptation, so plan new wet rooms around existing drainage risers.", "section": "sanitary"}, {"id": "vent_dwelling", "topic": "Ventilation flow in dwellings", "rule_plain_english": "Ventilation systems in dwellings must be designed for an outdoor-air flow of at least 0.35 l/s per m² floor area, and at least 4.0 l/s per person for rooms. Dwellings must allow increased air exchange, and cooking pollutants must be captured at source. In the new rules the 0.35 figure applies only to dwellings; for other buildings the requirement is functional ('acceptable air quality for the intended use', 3 kap. 1, 4 §§).", "values": {"outdoor_air_l_s_m2_min": 0.35, "per_person_l_s_min": 4.0, "radon_bq_m3_max": 200}, "applies_to_uses": ["housing_apartment", "student_housing", "co_living", "senior_housing", "elderly_care_home"], "strength": "law", "source": "BFS 2024:8 3 kap. 2, 4-6 §§; old BBR 6:251 (0.35 l/s per m² for all buildings)", "url": "https://rinfo.boverket.se/BFS2024-8/pdf/BFS2024-8.pdf", "confidence": "verified", "conversion_note": "Office systems usually far exceed 0.35 l/s/m², but they are designed for daytime only and without kitchen extraction per unit. Housing needs continuous 24/7 ventilation and cooker hoods: often new risers or per-flat FTX.", "section": "ventilation_daylight_acoustics"}, {"id": "vent_workplace", "topic": "Ventilation flow at workplaces", "rule_plain_english": "Indoor workplaces must normally be able to receive at least 7 l/s outdoor air per person plus at least 0.35 l/s per m² floor area while work is going on.", "values": {"l_s_per_person_min": 7, "l_s_per_m2_min": 0.35}, "applies_to_uses": ["office", "coworking", "retail_shop", "grocery_store", "restaurant_cafe", "food_hall", "school_compulsory", "school_upper_secondary", "primary_care_clinic", "elderly_care_home", "lss_group_home"], "strength": "law", "source": "AFS 2023:12 5 kap. 4 §", "url": "https://www.av.se/globalassets/filer/publikationer/foreskrifter/utformning-av-arbetsplatser-afs2023-12.pdf", "confidence": "verified", "conversion_note": "Pupils and visitors are not employees, but this per-person figure is the usual design basis for schools and premises (via Folkhälsomyndigheten guidance, not checked here). Raising density from office (0.1 p/m²) to classroom (0.5 p/m²) needs roughly 2.5-3x the air flow, often the binding constraint in shafts and plant rooms.", "section": "ventilation_daylight_acoustics"}, {"id": "vent_change_of_use", "topic": "Ventilation on change of use", "rule_plain_english": "When use changes, the scope of the alteration is judged by whether the new use demands more air exchange than the old one. Ventilation ducts taken out of use must be dismantled or sealed.", "values": {}, "applies_to_uses": ["all"], "strength": "law", "source": "BFS 2024:8 13 kap. 3-4 §§", "url": "https://rinfo.boverket.se/BFS2024-8/pdf/BFS2024-8.pdf", "confidence": "verified", "convers
