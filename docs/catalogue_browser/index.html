 "none", "layer": "stuff", "notes": ""}, {"id": "cowork_reception", "label_en": "Reception / host desk", "label_sv": "Reception", "required": {"strength": "practice", "basis": "Operator practice. Receptions in publika lokaler need sound transfer to hearing aids (BFS 2024:12 3 kap. 6 §, new build).", "url": "https://rinfo.boverket.se/BFS2024-12/pdf/BFS2024-12.pdf"}, "size": {"rule": "per_building", "value_m2": null, "range_m2": null, "count": "", "strength": "none", "source": "", "url": "", "confidence": "indicative"}, "constraints": {"min_ceiling_height_mm": null, "daylight_required": false, "facade_required": false}, "depends_on": [], "shareable_with": ["office"], "shareable_note": "", "binding_constraint": "accessibility", "layer": "space_plan", "notes": ""}], "variants": [{"id": "cowork_desk_led", "label": "Desk-led (hot desks dominate)", "changes": "Highest density; ventilation and WC count drive the fit."}, {"id": "cowork_office_suites", "label": "Serviced office suites", "changes": "Mostly small enclosed offices; each needs facade, daylight and per-room ventilation — behaves like cellular office."}, {"id": "cowork_community_event", "label": "Community / event-led", "changes": "Large event space; may become samlingslokal 2B (>150 persons) with fire alarm, evacuation alarm and two exits; possible food registration for café."}], "conversion_from_office": {"typical_blockers": ["Ventilation capacity for higher density and many small rooms (AFS 2023:12 5 kap. 4 §).", "Event space >150 persons: 2B requirements (BFS 2024:7 7 kap. 9, 17, 29, 43, 46 §§; no relaxation of exit numbers at change of use, 10 kap. 4 §).", "WC count at high density (1 per started 15 — AFS allmänna råd)."], "typical_enablers": ["Same verksamhetsklass 1 for work areas; usually no change-of-use permit.", "Existing office cores, WCs and pantries can be reused directly."]}, "sources": [{"ref": "AFS 2023:12 Utformning av arbetsplatser — 2 kap. 7 §, 3 kap. 2–6, 36–63 §§, 5 kap. 4, 25 §§", "url": "https://www.av.se/globalassets/filer/publikationer/foreskrifter/utformning-av-arbetsplatser-afs2023-12.pdf", "accessed": "2026-10-19"}, {"ref": "BFS 2024:7 — 2 kap. 4, 10–13 §§; 7 kap. 9, 17, 19, 29, 40, 43, 46 §§; 10 kap. 4 §", "url": "https://rinfo.boverket.se/BFS2024-7/pdf/BFS2024-7.pdf", "accessed": "2026-10-19"}, {"ref": "BFS 2024:12 — 2 kap. 7 §, 3 kap. 6 §", "url": "https://rinfo.boverket.se/BFS2024-12/pdf/BFS2024-12.pdf", "accessed": "2026-10-19"}, {"ref": "LIVSFS 2022:8 registrering och godkännande — 2 §, 9 §", "url": "https://www.livsmedelsverket.se/globalassets/om-oss/lagstiftning/offentlig-kontroll/livsfs-2022-8_web_t.pdf", "accessed": "2026-10-19"}, {"ref": "Riksrevisionen RiR 2025:17 / Skr. 2025/26:65", "url": "https://www.riksdagen.se/sv/dokument-och-lagar/dokument/regeringens-skrivelse/riksrevisionens-rapport-om-statens-anvandning-och_hd0365/html/", "accessed": "2026-10-19"}], "open_questions": ["Who carries AFS 2023:12 duties towards members? AFS 2023:12 2 kap. 7 §: an employer who does not 'råda över' the workplace need only follow a few provisions; allmänna råd says an employer does not råda if it neither owns nor has a lease for the workplace. Whether a coworking membership counts as a lease is not settled in the text — ask Arbetsmiljöverket or check case practice.", "Self-employed members without employees are covered as both employer and employee (2 kap. 7 § fourth paragraph) with listed exceptions — implications for operator obligations unclear.", "BFS 2025:10 amended BFS 2024:7 from 2025-12-01 (per cross_cutting.json); 7 kap./10 kap. paragraph numbers here are from the original text — re-check.", "No Swedish public source for m2 per coworking desk or desk-to-member ratio; value is borrowed from office benchmark.", "Does a members-only event space count as samlingslokal 2A/2B, or vk1 because members know the premises? BFS 2024:7 2 kap. 10–12 §§ turn on 'god lokalkännedom' — needs fire consultant judgment."]}, "culture_makerspace": {"id": "culture_makerspace", "label_en": "Culture house / makerspace / studios / gallery / rehearsal rooms", "label_sv": "Kulturhus / makerspace / ateljéer / galleri / replokaler", "family": "community", "summary": "A cluster of cultural production and display spaces: artists' studios (ateljéer), shared workshops and makerspace (wood, metal, textile, digital fabrication), a gallery or exhibition room, and music rehearsal rooms (replokaler). No Swedish law is specific to these uses and no national space norm was found. Requirements come from generic rules: fire class depending on whether users know the premises (members: Vk 1; public gallery or open house: Vk 2A/2B); sound insulation (BFS 2024:10, functional for lokaler; 56 dB minimum to dwellings), which is decisive for rehearsal rooms; workplace and machine safety for staffed workshops (AFS); ventilation and fire safety for fumes, dust and flammable goods (LBE 2010:1011). These uses are among the most tolerant of office-building constraints (moderate loads, small rooms, deep plans acceptable for studios without permanent occupancy), except for loud music, heavy machines and kilns.", "regulatory": {"bbr_verksamhetsklass": "Mixed. Studios and workshops used by members with good knowledge of the premises can be argued as Vk 1 (BFS 2024:7 2 kap. 10 §, like offices; assessment, not sourced). A gallery, open workshop or public events is Vk 2A (max 150) or 2B (more than 150) (2 kap. 11–12 §§). Rehearsal rooms are Vk 1 for regular members, or Vk 2A if used for audiences. See cross_cutting.json fire_vk_2abc.", "key_laws": [{"ref": "BFS 2024:10 skydd mot buller: 2 kap. 2 § tabell 2:1, 5 § tabell 2:4, 9 §", "url": "https://rinfo.boverket.se/BFS2024-10/pdf/BFS2024-10.pdf"}, {"ref": "BFS 2024:7 brandskydd: 2 kap. 3–4, 10–12 §§", "url": "https://rinfo.boverket.se/BFS2024-7/pdf/BFS2024-7.pdf"}, {"ref": "BFS 2024:8 hygien, hälsa och miljö: 3 kap. 4 § (removal of pollutants from the intended use), 4 kap. 3 § (daylight in lokaler)", "url": "https://rinfo.boverket.se/BFS2024-8/pdf/BFS2024-8.pdf"}, {"ref": "AFS 2023:12 Utformning av arbetsplatser (staffed workshops; 3 kap. 7 § separate rooms for particular risks)", "url": "https://www.av.se/globalassets/filer/publikationer/foreskrifter/utformning-av-arbetsplatser-afs2023-12.pdf"}, {"ref": "Lag (2010:1011) om brandfarliga och explosiva varor (LBE): gases for welding and brazing, solvents (thresholds in MSB regulations, not verified here)", "url": "https://www.riksdagen.se/sv/dokument-och-lagar/dokument/svensk-forfattningssamling/lag-20101011-om-brandfarliga-och-explosiva_sfs-2010-1011/"}, {"ref": "Folkhälsomyndighetens allmänna råd om höga ljudnivåer (FoHMFS 2014:15)", "url": "https://www.fohm.se/contentassets/af078ffb8b8c41e5ad7c35de0e20420d/fohmfs-2014-15.pdf"}], "permits": ["Bygglov for change of use from office (PBL 9 kap. 15 § 1 since 2025-12-01; formerly 9 kap. 2 § första stycket 3 a; see cross_cutting.json cou_bygglov_trigger) where the new use is 'väsentligen annat'. Studios used as offices for creative work may not need it (assessment by the byggnadsnämnd).", "Permit for flammable gases or liquids above MSB thresholds (LBE permit regime; paragraph numbers and threshold values not verified here).", "Detaljplan: workshops with noise or dust may conflict with housing or office plans; check permitted use (e.g. C, K, J småindustri). Not verified."], "cross_cutting_refs": ["cou_bygglov_trigger", "cou_anmalan", "cou_requirements_scope", "fire_vk_1", "fire_vk_2abc", "fire_load_density", "occ_density_law_2024", "occ_density_bbr_table_5333", "access_design_dimensions", "access_public_premises_wc", "access_hin", "san_public", "san_workplace", "staff_personalutrymmen_general", "staff_changing_showers_storage", "staff_eating_rest", "vent_workplace", "acoustics_premises", "acoustics_dwellings", "loads_imposed_table_4_1"], "operator_oversight": "Kommunens byggnadsnämnd; räddningstjänsten (LBE permits, LSO); miljö- och hälsoskyddsnämnd (noise, emissions); Arbetsmiljöverket (staffed workshops)"}, "occupancy": {"unit": "user", "gross_m2_per_unit": {"value": null, "range": null, "strength": "none", "source": "No Swedish law, guidance or public programme found that gives m2 per artist, member or rehearsal band.", "confidence": "verified"}, "staff_per_unit": {"value": null, "strength": "none", "source": "Often volunteer- or member-run."}, "egress_design_density": {"persons_per_m2": 0.25, "strength": "practice", "source": "Old BBR (repealed BBR, pre-2025) general advice, practice: BBR tabell 5:333 'Museum, konsthall' 0.25 persons/m2 (gallery). Studios and workshops: furnished maximum (BFS 2024:7 2 kap. 4 §). Vernissage or events use the samlingslokal default 2.5 p/m2.", "url": "https://rinfo.boverket.se/BFS2011-6/dok/BFS2024-5_konsolidering.pdf", "confidence": "verified"}, "hours_profile": "evening_weekend", "hourly_presence": [0.02, 0.01, 0, 0, 0, 0, 0, 0.02, 0.1, 0.25, 0.35, 0.35, 0.3, 0.35, 0.4, 0.4, 0.45, 0.6, 0.75, 0.8, 0.7, 0.5, 0.2, 0.05], "hourly_presence_note": "Modelling assumption (indicative, not sourced). Studios used by day by professional artists; makerspace and rehearsal rooms peak in the evening and at weekends. Rehearsal rooms are often booked until 22–23."}, "spaces": [{"id": "culture_studios", "label_en": "Artists' studios (individual or shared)", "label_sv": "Ateljéer", "required": {"strength": "practice", "basis": "Defining space; not regulated. If used as a permanent workplace by employees, AFS 2023:12 applies; for self-employed artists, BFS 2024:8 4 kap. 3 § applies (rooms in lokaler where people stay more than temporarily need sufficient daylight and view unless unreasonable).", "url": "https://rinfo.boverket.se/BFS2024-8/pdf/BFS2024-8.pdf"}, "size": {"rule": "per_unit", "value_m2": null, "range_m2": null, "count": "per artist or collective", "strength": "none", "source": "No Swedish public source found.", "url": "", "confidence": "verified"}, "constraints": {"min_ceiling_height_mm": 2400, "daylight_required": true, "facade_required": true}, "depends_on": [], "shareable_with": ["coworking", "office"], "shareable_note": "Studio clusters often sit beside coworking. Clean studios (illustration, design) are close to office use.", "binding_constraint": "daylight_and_view", "layer": "space_plan", "notes": "Office floors suit studios well: facade-adjacent cellular offices become studios with little intervention (high reversibility). Painting with solvents needs extract ventilation (BFS 2024:8 3 kap. 4 §)."}, {"id": "culture_workshop", "label_en": "Shared workshop / makerspace (wood, metal, textile, digital fabrication)", "label_sv": "Verkstad / makerspace", "required": {"strength": "practice", "basis": "Not required. Where staffed, AFS 2023:12 3 kap. 7 § (processes with particular risks normally in separate rooms) and machine rules apply. Process ventilation and dust extraction follow from BFS 2024:8 3 kap. 4 § and AFS 2023:12 5 kap.", "url": "https://www.av.se/globalassets/filer/publikationer/foreskrifter/utformning-av-arbetsplatser-afs2023-12.pdf"}, "size": {"rule": "per_building", "value_m2": null, "range_m2": null, "count": "", "strength": "none", "source": "No Swedish public source found.", "url": "", "confidence": "verified"}, "constraints": {"min_ceiling_height_mm": 2700, "daylight_required": false, "facade_required": false}, "depends_on": ["culture_storage"], "shareable_with": ["school_compulsory", "community_hybrid"], "shareable_note": "Schools (slöjd) and study associations can book workshop time; evening members.", "binding_constraint": "ventilation", "layer": "services", "notes": "Heavy machines and material stacks: storage loads E1 5.0 kN/m2 (BFS 2024:6 tabell 4:1) vs office 2.5; machine bases may need local strengthening. Wood dust (explosion and fire risk) and welding fumes need local extraction; welding gases fall under LBE. Machine noise and vibration to neighbours (BFS 2024:10). Goods access (lift or ground floor, wide doors) is often decisive. Ceiling height of 2,700 mm is guidance only (AFS 2023:12 3 kap. 5 § allmänna råd)."}, {"id": "culture_kiln_hot_work", "label_en": "Kiln, hot-work and spray room", "label_sv": "Brännugn / heta arbeten / sprutbox", "required": {"strength": "practice", "basis": "Optional. If present, fire separation and ventilation follow from BFS 2024:7 (fire cells) and BFS 2024:8 3 kap. 4 §; flammable products under LBE.", "url": "https://rinfo.boverket.se/BFS2024-7/pdf/BFS2024-7.pdf"}, "size": {"rule": "fixed", "value_m2": null, "range_m2": null, "count": "", "strength": "none", "source": "", "url": "", "confidence": "verified"}, "constraints": {"min_ceiling_height_mm": null, "daylight_required": false, "facade_required": true}, "depends_on": [], "shareable_with": [], "shareable_note": "", "binding_constraint": "ventilation", "layer": "services", "notes": "Ceramic kilns need high power supply and exhaust; spray painting needs a separate fire cell and exhaust. Facade or roof access for exhaust is the typical binding constraint in office conversions (indicative)."}, {"id": "culture_rehearsal", "label_en": "Music rehearsal rooms", "label_sv": "Replokaler / musikrum", "required": {"strength": "law", "basis": "Required only if the programme includes music, but then sound insulation is law: BFS 2024:10 2 kap. 9 § (lokaler: dampen noise to the extent the intended use requires) and, where dwellings adjoin, tabell 2:1 (DnT,w,50 at least 56 dB from lokaler) and tabell 2:4 (L'nT,w,50 at most 52 dB). Miljöbalken 9 kap. nuisance rules apply in operation.", "url": "https://rinfo.boverket.se/BFS2024-10/pdf/BFS2024-10.pdf"}, "size": {"rule": "per_unit", "value_m2": null, "range_m2": null, "count": "per band or ensemble", "strength": "none", "source": "No Swedish public source found for rehearsal-room size.", "url": "", "confidence": "verified"}, "constraints": {"min_ceiling_height_mm": 2700, "daylight_required": false, "facade_required": false}, "depends_on": [], "shareable_with": ["community_hybrid", "school_compulsory"], "shareable_note": "Kulturskola by day, bands in the evening. Only if box-in-box construction is in place.", "binding_constraint": "noise_to_neighbours", "layer": "skin", "notes": "Amplified band rehearsal far exceeds what the 56 dB building minimum is designed for. Box-in-box rooms (floating floor, independent walls and ceiling) are standard practice (engineering judgement, indicative), costing floor area and height and loading the slab. Best placed in basements or on slab-on-grade, away from dwellings and sleeping rooms. Musicians' exposure: FoHMFS 2014:15 (audiences) and AFS rules on noise at work (not opened). Windowless rooms are acceptable when the use is temporary per room (no daylight needed under BFS 2024:8 4 kap. 3 § where unreasonable for the intended use)."}, {"id": "culture_gallery", "label_en": "Gallery / exhibition room", "label_sv": "Galleri / utställningsrum", "required": {"strength": "practice", "basis": "Optional. If open to the public it is a publik lokal: accessible (BFS 2024:12 2 kap.) and Vk 2A/2B.", "url": "https://rinfo.boverket.se/BFS2024-12/pdf/BFS2024-12.pdf"}, "size": {"rule": "per_building", "value_m2": null, "range_m2": null, "count": "", "strength": "none", "source": "", "url": "", "confidence": "verified"}, "constraints": {"min_ceiling_height_mm": 2700, "daylight_required": false, "facade_required": true}, "depends_on": ["culture_storage"], "shareable_with": ["shared_amenities", "library", "assembly_event", "community_hybrid"], "shareable_note": "A shared lobby or library foyer can host exhibitions.", "binding_constraint": "accessibility", "layer": "space_plan", "notes": "Load C3 'without obstacles for moving persons' 3.0 kN/m2 (BFS 2024:6 tabell 4:1), slightly above office B 2.5; heavy sculptures need local checks. Egress density 0.25 p/m2 (old BBR (repealed BBR, pre-2025) advice, practice), or 2.5 p/m2 at vernissage. Street-level facade is valuable for visibility. 2,700 mm is guidance (old BBR (repealed BBR, pre-2025) 3:3112 for publika lokaler; AFS allmänna råd)."}, {"id": "culture_storage", "label_en": "Material and artwork storage, goods access", "label_sv": "Materialförråd / konstförråd / godsmottagning", "required": {"strength": "practice", "basis": "Not regulated.", "url": ""}, "size": {"rule": "derived", "value_m2": null, "range_m2": null, "count": "", "strength": "none", "source": "", "url": "", "confidence": "indicative"}, "constraints": {"min_ceiling_height_mm": null, "daylight_required": false, "facade_required": false}, "depends_on": [], "shareable_with": ["shared_amenities"], "shareable_note": "Goods lift and loading bay shared with other tenants.", "binding_constraint": "floor_load", "layer": "stuff", "notes": "E1 storage 5.0 kN/m2 (BFS 2024:6 tabell 4:1)."}, {"id": "culture_wc_staff", "label_en": "WCs, wash-up sink and staff/member facilities", "label_sv": "Toaletter, utslagsvask, personalutrymmen", "required": {"strength": "law", "basis": "FMH 35 § (sufficient toilets); BFS 2024:12 2 kap. 7 § (accessible public WC if public WCs exist); AFS 2023:12 for staff. See cross_cutting.json sanitary and staff_facilities.", "url": "https://rinfo.boverket.se/BFS2024-12/pdf/BFS2024-12.pdf"}, "size": {"rule": "per_building", "value_m2": null, "range_m2": null, "count": "", "strength": "none", "source": "See cross_cutting.json.", "url": "", "confidence": "verified"}, "constraints": {"min_ceiling_height_mm": null, "daylight_required": false, "facade_required": false}, "depends_on": [], "shareable_with": ["shared_amenities"], "shareable_note": "", "binding_constraint": "plumbing_shafts", "layer": "services", "notes": "Clay and plaster traps on sinks in ceramic and sculpture workshops (practice)."}], "variants": [{"id": "culture_studio_cluster", "label": "Studio cluster (ateljéhus)", "changes": "Mostly individual studios along the facade, shared wash-up and storage. Closest to office use; minimal fire or acoustic change."}, {"id": "culture_makerspace_open", "label": "Open makerspace / fablab", "changes": "Public or member workshop with machines, laser cutters and 3D printers. Ventilation and extraction, goods access and machine safety bind. Vk 2A if open to the public."}, {"id": "culture_rehearsal_house", "label": "Rehearsal house (replokaler)", "changes": "Box-in-box rooms, basement or ground floor preferred. Noise to dwellings is the hard constraint."}, {"id": "culture_house", "label": "Culture house (kulturhus) with gallery and event room", "changes": "Adds a gallery (publik lokal) and an event room (see assembly_event), often combined with library and community_hybrid."}], "conversion_from_office": {"typical_blockers": ["Music: BFS 2024:10 minima to dwellings (56 dB DnT,w,50; 52 dB L'nT,w,50) do not cover amplified music. Box-in-box rooms are needed, costing height and load.", "Workshops: dust and fume extraction, hot work and flammable goods (LBE), and machine noise and vibration in a building designed for quiet office work.", "Goods handling (sheet materials, artworks) on upper floors without a goods lift.", "Storage and machine loads (E1 5.0 kN/m2) vs office 2.5 kN/m2."], "typical_enablers": ["Cellular office rooms convert directly to studios (high reversibility, low cost).", "Deep interior zones suit storage, darkrooms and rehearsal rooms that need no daylight.", "Basement or ground floor and former garages suit workshops and rehearsal.", "Moderate public density (gallery 0.25 p/m2, repealed advice) rarely binds egress."]}, "sources": [{"ref": "BFS 2024:10 buller: 2 kap. 2, 5, 9 §§ (text extracted from PDF)", "url": "https://rinfo.boverket.se/BFS2024-10/pdf/BFS2024-10.pdf", "accessed": "2026-10-19"}, {"ref": "BFS 2024:7: 2 kap. 4, 10–12 §§", "url": "https://lagen.nu/bfs/2024:7", "accessed": "2026-10-19"}, {"ref": "BFS 2024:8: 3 kap. 4 §, 4 kap. 3 §", "url": "https://rinfo.boverket.se/BFS2024-8/pdf/BFS2024-8.pdf", "accessed": "2026-10-19"}, {"ref": "BFS 2024:6 4 kap. 10 § tabell 4:1", "url": "https://www.boverket.se/sv/PBL-kunskapsbanken/regler-om-byggande/barformaga-stadga-bestandighet/laster/nyttiga-laster/", "accessed": "2026-10-19"}, {"ref": "AFS 2023:12: 3 kap. 5, 7 §§; 5 kap.", "url": "https://www.av.se/globalassets/filer/publikationer/foreskrifter/utformning-av-arbetsplatser-afs2023-12.pdf", "accessed": "2026-10-19"}, {"ref": "Old BBR (repealed BBR, pre-2025) tabell 5:333 (consolidated BBR p. 52)", "url": "https://rinfo.boverket.se/BFS2011-6/dok/BFS2024-5_konsolidering.pdf", "accessed": "2026-10-19"}, {"ref": "FoHMFS 2014:15", "url": "https://www.fohm.se/contentassets/af078ffb8b8c41e5ad7c35de0e20420d/fohmfs-2014-15.pdf", "accessed": "2026-10-19"}], "open_questions": ["No Swedish public programme for ateljéhus, makerspace or replokaler was found (municipal kulturförvaltning or KRO/Konstnärernas Riksorganisation could have studio guidance; Studiefrämjandet/Sensus for rehearsal rooms). Not searched in depth.", "LBE permit thresholds for welding gases and solvents (MSB föreskrifter) were not verified.", "Vk 1 vs Vk 2A for member-only studios and workshops is an assessment; confirm with Boverket guidance.", "Folkhälsomyndigheten FoHMFS 2014:13 (buller inomhus) values for dwellings next to music rooms were not verified; add them if the fit test needs operational limits.", "AFS rules on noise exposure for staff and musicians (and their current AFS number after the 2025 restructuring) were not opened."]}, "elderly_care_home": {"id": "elderly_care_home", "label_en": "Residential care home for older people (SÄBO), incl. dementia unit", "label_sv": "Särskilt boende för äldre (SÄBO) / vård- och omsorgsboende", "family": "care", "summary": "Needs-assessed special housing for older people with extensive care needs. Legally it is the residents' home (own apartment with own tenancy) and at the same time a 24/7 workplace and a place where municipal health care is given. The law requires the housing form, round-the-clock staff access, couples' right to live together, fire class 5B with sprinkler, and dwelling functions in each apartment; it sets almost no areas. Areas come from municipal programmes: apartments of about 30-35 m², grouped in units of roughly 8-16 apartments around a shared kitchen/dining/living room, with staff, medication and utility rooms per unit or floor.", "regulatory": {"bbr_verksamhetsklass": "5B", "bbr_verksamhetsklass_source": "BBR (BFS 2011:6) was replaced on 1 July 2025 by Boverket's new building regulations. The transition period ended 1 July 2026. Class 5B is now defined in BFS 2024:7 2 kap. 19 §: 'bostäder och gemensamhetsutrymmen i behovsprövade särskilda boenden för personer som kan förväntas ha begränsade, eller inga, förutsättningar att själva sätta sig i säkerhet'. That § is amended by BFS 2025:10, whose text was not checked. https://rinfo.boverket.se/BFS2024-7/pdf/BFS2024-7.pdf", "fire_consequences_of_5B": ["Automatic sprinkler for personal protection or a residential sprinkler system in every 5B fire cell (BFS 2024:7 7 kap. 48 §). No deviation is allowed on change of use (10 kap. 7 §).", "Each apartment (bostad/boendeenhet) in 5B is its own fire cell (BFS 2024:7 5 kap. 25 § p. 9).", "Two independent escape doors for a group of 5B units (7 kap. 9 § p. 5). Max. 45 m to an escape door (7 kap. 19 §) and 30 m in a shared escape route (7 kap. 20 §).", "Fire alarm (7 kap. 46 §) and evacuation alarm (7 kap. 43 §) are required. The evacuation alarm may be adapted to staff intervention and to residents' ability to perceive signals.", "Load-bearing main structure must be at least R 30 (3 kap. 15 §).", "Apartment doors need no door closer if at most eight units open onto the same common space (5 kap. 43 § p. 4). This rule supports groups of 8.", "Stairs in escape routes serving 5B must have constant tread depth (7 kap. 26 §).", "Scale limit: an activity with more than 150 people who cannot be expected to evacuate themselves becomes Vk 0 (BFS 2024:7 2 kap. 9 § p. 4). It then needs analytical fire design. Check this for homes of 80-100+ residents counted together with staff and visitors. How a home is split into separate activities is a fire-engineering question.", "General fire class and change-of-use rules are in data/catalogue/cross_cutting.json (fire_vk_5abc, fire_change_of_use_floor) and are not repeated here."], "key_laws": [{"ref": "Socialtjänstlag (2025:400) 8 kap. 4 § första stycket: the municipality shall set up special housing for older people who need care and special support", "url": "https://lagen.nu/2025:400", "note": "In force 1 July 2025. It replaced SoL (2001:453), whose former 5 kap. 5 § is cited in older municipal programmes."}, {"ref": "SoL (2025:400) 11 kap. 3 §: right to live together with a spouse or cohabitant (parboende)", "url": "https://lagen.nu/2025:400"}, {"ref": "SoL (2025:400) 10 kap. 7 §: fixed care contact (fast omsorgskontakt)", "url": "https://lagen.nu/2025:400"}, {"ref": "Socialtjänstförordning (2025:468) 2 kap. 2 §: access to staff around the clock in housing under SoL 8 kap. 4 § första stycket. Staff must be able to notice at once when help is needed. 2 kap. 1 §: couples who are both granted a place may live in the same housing.", "url": "https://www.riksdagen.se/sv/dokument-och-lagar/dokument/svensk-forfattningssamling/socialtjanstforordning-2025468_sfs-2025-468/"}, {"ref": "Hälso- och sjukvårdslag (2017:30) 5 kap. 1-2 §§: good hygienic standard; the premises and equipment needed for good care", "url": "https://lagen.nu/2017:30"}, {"ref": "BFS 2024:11 (bostäders lämplighet) 2 kap. 1, 3, 10 §§ and 3 kap. 3 §", "url": "https://rinfo.boverket.se/BFS2024-11/pdf/BFS2024-11.pdf"}, {"ref": "BFS 2024:12 (tillgänglighet och användbarhet) 2 kap. 2-5, 9-10 §§ and 3 kap. 2, 5 §§", "url": "https://rinfo.boverket.se/BFS2024-12/pdf/BFS2024-12.pdf"}, {"ref": "BFS 2024:7 (brandskydd)", "url": "https://rinfo.boverket.se/BFS2024-7/pdf/BFS2024-7.pdf"}, {"ref": "AFS 2023:12 Utformning av arbetsplatser, 3 kap. (replaced AFS 2020:1 from 1 January 2025)", "url": "https://www.av.se/globalassets/filer/publikationer/foreskrifter/utformning-av-arbetsplatser-afs2023-12.pdf"}, {"ref": "SOSFS 2015:10 basal hygien i vård och omsorg (cited in the Uppsala programme)", "url": "https://www.uppsala.se/contentassets/7608aa284a64481bb52150f3fa6ee3a7/funktionsprogram-for-nytt-vard--och-omsorgsboende-for-aldre_slutversion_210924.pdf"}], "permits": ["Bygglov for change of use under PBL 9 kap. 15 § 1, in force from 2025-12-01 (Lag 2025:974). Formerly 9 kap. 2 § 3 a/b. See cross_cutting.json cou_bygglov_trigger.", "Private operators need a permit from IVO (SoL 2025:400 26 kap. 1 § första stycket 2). A municipality running the service itself must notify IVO before starting (26 kap. 2 §). Source: lagen.nu summary, paragraph text not re-read.", "Registration of the food establishment (unit kitchens, production kitchen) with the municipal food control authority under (EG) 852/2004, cited in the Uppsala programme"], "operator_oversight": "IVO (Inspektionen för vård och omsorg); municipal MAS (medically responsible nurse) for the health care part"}, "occupancy": {"unit": "resident", "gross_m2_per_unit": {"value": 65, "range": [55, 120], "strength": "programme", "source": "Uppsala kommun funktionsprogram 2021 p. 10: 'Den totala ytan bör vara max 65 kvm per boende'. Göteborgs Stad, förstudie Önneredsvägen p. 3-4: 100-120 m² LOA per resident at early stage, including a production kitchen, restaurant and assembly hall; rentable housing area incl. common spaces and storage about 55 m² LOA per resident. Lidköping riktlinje lokalförsörjning bilaga 1: max 75 m² per resident in total.", "confidence": "verified", "notes": "The measures are not the same. Uppsala gives total area as a ceiling, Göteborg gives LOA (excluding technical rooms), and 55 m² covers housing plus common space only. Convert to BTA before use. Lidköping was not re-checked."}, "group_size": {"value": 10, "range": [8, 16], "strength": "programme", "source": "Botkyrka lokalfunktionsprogram 2017 p. 7: groups of at most 10 apartments, about 60 apartments per home. Göteborg förstudie Önneredsvägen p. 3: units of 10-16, 80-100 apartments per home. Lidköping: 9-12 per unit, 60-100 per home (not re-checked). BFS 2024:7 5 kap. 43 § makes groups of at most 8 easier for door closers.", "confidence": "verified"}, "staff_per_unit": {"value": null, "strength": "law", "source": "SoF (2025:468) 2 kap. 2 § requires access to staff around the clock based on residents' current needs. No national staff ratio exists, and no source was found for typical day and night ratios.", "confidence": "sourced"}, "hours_profile": "24_7", "hourly_presence": [1, 1, 1, 1, 1, 1, 1, 1, 1, 0.95, 0.95, 0.95, 0.95, 0.95, 0.95, 0.95, 0.95, 1, 1, 1, 1, 1, 1, 1], "hourly_presence_note": "Residents' presence, indicative. Staff presence follows day, evening and night shifts with clearly fewer staff at night. No sourced shift ratios."}, "spaces": [{"id": "sabo_apartment", "label_en": "Resident apartment (one person)", "label_sv": "Lägenhet (enpersons)", "required": {"strength": "law", "basis": "SoL 8 kap. 4 § creates the housing form. BFS 2024:11 2 kap. 1 §: a dwelling must be designed for the dwelling functions (sleep/rest, socialising, cooking, meals, hygiene, storage). 2 kap. 10 §: in SÄBO with boendeenheter, socialising, cooking and meals may be shared only partly, as a complement to the functions in each unit. BFS 2024:12 2 kap. 10 §: free space for assistance along both long sides and the foot of at least one bed, in each boendeenhet. BFS 2024:12 3 kap. 2 §: stretcher transport must be possible from each boendeenhet.", "url": "https://rinfo.boverket.se/BFS2024-11/pdf/BFS2024-11.pdf"}, "size": {"rule": "per_unit", "value_m2": 32, "range_m2": [30, 40], "count": "1 per resident (minus couple apartments)", "strength": "programme", "source": "Uppsala funktionsprogram 2021 p. 16: 'Lägenheten bör vara 30-35 kvm' (hall, sleeping/living room with pentry, bathroom). Göteborg förstudie Önneredsvägen p. 4: 32-35 m² LOA. Botkyrka 2017 p. 7 and p. 20: minimum 31 m², about 31-40 m².", "url": "https://www.uppsala.se/contentassets/7608aa284a64481bb52150f3fa6ee3a7/funktionsprogram-for-nytt-vard--och-omsorgsboende-for-aldre_slutversion_210924.pdf", "confidence": "verified"}, "constraints": {"min_ceiling_height_mm": 2600, "daylight_required": true, "facade_required": true, "bed_clearance_both_sides_mm": 900, "hall_turning_diameter_mm": 1500, "door_clear_width_mm": 1000, "ceiling_hoist": "required_or_prepared"}, "constraints_sources": "Ceiling height 2600 mm, 'motivated by ceiling-track hoist': Botkyrka 2017 p. 52. Bed 900 mm free on both sides in care position: Botkyrka p. 20. Hall turning 1300 mm minimum, preferably 1500 mm: Botkyrka p. 20. Doors used by residents 1100 mm frame and 1000 mm clear at 90°: Botkyrka p. 45. Ceiling hoist: Uppsala p. 17, 'Rummet ska vara utrustat med travers'; Botkyrka p. 53, ceiling structure prepared for hoists in apartment and bathroom; Göteborg Morans 2022, primary and secondary hoist beams in each apartment. Daylight and facade: dwelling requirement (Uppsala p. 16, view out from bed and wheelchair). AFS 2023:12 3 kap. 6 §: normally at least 0.8 m free working space where care work involves force or bending.", "depends_on": ["sabo_bathroom", "sabo_kitchenette"], "shareable_with": [], "binding_constraint": "facade_length_and_floor_depth", "layer": "space_plan", "notes": "Programmes differ on whether the residents' common area is in the rent. Ground-floor apartments should have their own door outside (Uppsala p. 16). Medicines are kept in a locked cabinet in the apartment, linked to the access-control system (Uppsala p. 16; Göteborg Morans)."}, {"id": "sabo_bathroom", "label_en": "Apartment bathroom (WC/shower)", "label_sv": "Hygienrum / badrum i lägenheten", "required": {"strength": "law", "basis": "BFS 2024:11 2 kap. 3 § and 3 kap. 1 §: the dwelling must have a room for personal hygiene with fixed fittings. Shared hygiene rooms (2 kap. 8 §) may NOT be used in SÄBO (2 kap. 10 § andra stycket). BFS 2024:12 2 kap. 9 §: at least one hygiene room accessible to a person with reduced mobility.", "url": "https://rinfo.boverket.se/BFS2024-11/pdf/BFS2024-11.pdf"}, "size": {"rule": "per_unit", "value_m2": 6.5, "range_m2": [6.5, 6.5], "count": "1 per apartment (included in apartment area)", "strength": "programme", "source": "Botkyrka 2017 p. 23: 'måtten skall vara 2,4 x 2,7 meter' with space to assist on both sides of WC and shower. Uppsala p. 17: room for two staff assisting, plus washing machine and tumble dryer. BOV 2025 (SFVH) p. 134: every SÄBO apartment needs its own hygiene room with room for washer and dryer.", "url": "https://www.botkyrka.se/download/18.13554ca8173e7b670d1ec11/1598379351184/Riktlinjer%20f%C3%B6r%20lokalfunktionsprogram%20f%C3%B6r%20s%C3%A4rskilda%20boenden%20m%20m.pdf", "confidence": "verified"}, "constraints": {"daylight_required": false, "facade_required": false, "ceiling_hoist": "prepared", "floor_drain_required": true}, "depends_on": ["sabo_apartment"], "binding_constraint": "drainage_and_shafts", "layer": "services", "notes": "Office floors usually lack drainage stacks at each apartment position. This is often the costliest conversion item."}, {"id": "sabo_kitchenette", "label_en": "Kitchenette in apartment", "label_sv": "Pentry", "required": {"strength": "law", "basis": "BFS 2024:11 2 kap. 10 §: cooking may be shared only partly, as a complement to the function in the unit. 3 kap. 3 §: a cooking space must have fixed fittings, BUT boendeenheter for people with dementia in SÄBO are exempt, provided the installations are prepared.", "url": "https://rinfo.boverket.se/BFS2024-11/pdf/BFS2024-11.pdf"}, "size": {"rule": "per_unit", "value_m2": null, "strength": "none", "source": "No area given. Contents per Uppsala p. 17: sink, fridge with freezer compartment, space for coffee maker or hotplate. Stove guard, timer outlets and a separately fused fridge per Botkyrka p. 21.", "confidence": "verified"}, "depends_on": ["sabo_apartment"], "binding_constraint": "none", "layer": "services"}, {"id": "sabo_couple_apartment", "label_en": "Couple apartment / connectable apartments", "label_sv": "Parboende / dubblettlägenhet", "required": {"strength": "law", "basis": "SoL (2025:400) 11 kap. 3 § and SoF (2025:468) 2 kap. 1 §: right to live together. No source sets a number of couple apartments.", "url": "https://lagen.nu/2025:400"}, "size": {"rule": "per_unit", "value_m2": 52, "range_m2": [50, 55], "count": "a few per home, by project", "strength": "programme", "source": "Botkyrka 2017 p. 21: dubblettlägenhet about 50-55 m² with separate bedroom. Uppsala p. 16 uses instead a door between two adjacent apartments.", "confidence": "verified"}, "binding_constraint": "none", "layer": "space_plan"}, {"id": "sabo_apartment_storage", "label_en": "Resident storage outside apartment", "label_sv": "Lägenhetsförråd", "required": {"strength": "law", "basis": "Storage is a dwelling function (BFS 2024:11 1 kap. 5 §). Storage not for daily use may be outside the dwelling, nearby and separated off (2 kap. 5 §).", "url": "https://rinfo.boverket.se/BFS2024-11/pdf/BFS2024-11.pdf"}, "size": {"rule": "per_unit", "value_m2": 1, "count": "1 per apartment", "strength": "programme", "source": "Botkyrka 2017 p. 25: about 1 m² per resident for older people. Uppsala p. 24 sizes it to the minimum requirement and requires access with a rollator or wheelchair.", "confidence": "verified"}, "layer": "space_plan"}, {"id": "sabo_group_common_living_dining", "label_en": "Shared kitchen-dining-living room per group", "label_sv": "Gemensam matsal och vardagsrum per boendegrupp", "required": {"strength": "law", "basis": "BFS 2024:11 2 kap. 10 §: when socialising, cooking and meals are partly shared, the shared functions must be next to the units. In practice this is required because apartments of 30-35 m² do not hold full living and dining. Uppsala p. 17-18 and Botkyrka p. 25 require a dining room and living room per group.", "url": "https://rinfo.boverket.se/BFS2024-11/pdf/BFS2024-11.pdf"}, "size": {"rule": "per_group", "value_m2": null, "count": "1 per boendegrupp (about 8-16 apartments)", "strength": "none", "source": "No law or checked programme gives m². Botkyrka p. 25: dining room sized for all residents plus a couple of staff. Uppsala p. 18: two groups should be able to sit together, and daylight from two directions. The 4 m²/resident in data/standards/space_requirements.json is unverified.", "confidence": "indicative"}, "constraints": {"daylight_required": true, "facade_required": true, "daylight_two_directions": "programme (Uppsala p. 18)"}, "depends_on": ["sabo_group_kitchen", "sabo_group_balcony"], "binding_constraint": "acoustics_and_daylight", "layer": "space_plan"}, {"id": "sabo_group_kitchen", "label_en": "Unit kitchen (warming / partial cooking)", "label_sv": "Avdelningskök / boendegruppens kök", "required": {"strength": "programme", "basis": "Uppsala p. 18: each group kitchen for some meal preparation and receiving ready-cooked food, accessible so residents can take part. Botkyrka p. 27: separate clean and dirty zones, two sinks, hand-wash basin at the door. Food hygiene law (EG 852/2004) applies to professional food handling.", "url": "https://www.uppsala.se/contentassets/7608aa284a64481bb52150f3fa6ee3a7/funktionsprogram-for-nytt-vard--och-omsorgsboende-for-aldre_slutversion_210924.pdf"}, "size": {"rule": "per_group", "value_m2": null, "strength": "none", "source": "Size depends on the meal concept chosen per project (Uppsala p. 18).", "confidence": "verified"}, "binding_constraint": "ventilation_and_drainage", "layer": "services"}, {"id": "sabo_group_balcony", "label_en": "Shared balcony / terrace per group", "label_sv": "Gemensam balkong / uteplats", "required": {"strength": "programme", "basis": "Uppsala p. 18-19: every group has a balcony or terrace next to the common rooms, may be shared between groups, preferably glazed.", "url": "https://www.uppsala.se/contentassets/7608aa284a64481bb52150f3fa6ee3a7/funktionsprogram-for-nytt-vard--och-omsorgsboende-for-aldre_slutversion_210924.pdf"}, "size": {"rule": "per_group", "value_m2": null, "strength": "none", "source": "Must fit residents and staff at the same time (Uppsala). No m² given.", "confidence": "verified"}, "constraints": {"facade_required": true, "level_threshold_free": true}, "binding_constraint": "structure_new_balcony", "layer": "skin"}, {"id": "sabo_staff_base", "label_en": "Staff documentation room / unit office", "label_sv": "Dokumentationsrum / expedition", "required": {"strength": "programme", "basis": "Uppsala p. 19: shared documentation room between groups for each boendeenhet (floor). Botkyrka p. 29: one office per unit or department, staff WC nearby, at least one per floor.", "url": "https://www.uppsala.se/contentassets/7608aa284a64481bb52150f3fa6ee3a7/funktionsprogram-for-nytt-vard--och-omsorgsboende-for-aldre_slutversion_210924.pdf"}, "size": {"rule": "per_group", "value_m2": null, "strength": "none", "source": "No m² in the checked programmes. The 12 m² in space_requirements.json is unverified.", "confidence": "indicative"}, "layer": "space_plan"}, {"id": "sabo_medication_room", "label_en": "Medication room", "label_sv": "Läkemedelsrum / läkemedelsförråd", "required": {"strength": "law", "basis": "HSL 5 kap. 2 §: premises needed for good care. Socialstyrelsen's medicines-handling rules (HSLF-FS 2017:37, cited by BOV) require locked storage inaccessible to unauthorised people; the paragraph was not checked. The room form is programme: Uppsala p. 21, separate room, no window, max 25 °C, access control for nurses only.", "url": "https://lagen.nu/2017:30"}, "size": {"rule": "per_building", "value_m2": 7, "count": "1 per home, or per floor in large homes", "strength": "programme", "source": "Botkyrka 2017 p. 36: 'Ytbehov ca 7 kvm', door only to the nurses' office, no windows.", "confidence": "verified"}, "constraints": {"daylight_required": false, "facade_required": false, "max_room_temp_c": 25}, "binding_constraint": "cooling", "layer": "space_plan", "notes": "BOV 2025 p. 77: preparation bench, medicine fridge with temperature monitoring, space for trolley, administrative place, delivery area inside the door, no wash basin next to the bench."}, {"id": "sabo_sluice_room", "label_en": "Sluice / dirty utility with bedpan washer", "label_sv": "Sköljrum med spoldesinfektor (städ/avfall)", "required": {"strength": "programme", "basis": "Uppsala p. 19: at least one sluice room with bedpan washer per floor, clean and dirty sides. Botkyrka p. 29: washer-disinfector on every floor. AFS 2023:12 3 kap. 2 § allmänt råd names 'sköljrum inom vården' as an example of a needed space (guidance).", "url": "https://www.uppsala.se/contentassets/7608aa284a64481bb52150f3fa6ee3a7/funktionsprogram-for-nytt-vard--och-omsorgsboende-for-aldre_slutversion_210924.pdf"}, "size": {"rule": "per_floor", "value_m2": null, "strength": "none", "source": "No m² given. Must hold waste interim storage and a cleaning trolley (Uppsala).", "confidence": "verified"}, "constraints": {"floor_drain_required": true, "daylight_required": false}, "binding_constraint": "drainage_and_odour_extract", "layer": "services"}, {"id": "sabo_disinfection_room", "label_en": "Disinfection room (washer-disinfector for reusable items)", "label_sv": "Desinfektionsrum", "required": {"strength": "programme", "basis": "Uppsala p. 21: next to the medication room and health staff office, with washer-disinfector and stainless bench. Göteborg Morans 2022: washer-disinfector near nurse spaces.", "url": "https://www.uppsala.se/contentassets/7608aa284a64481bb52150f3fa6ee3a7/funktionsprogram-for-nytt-vard--och-omsorgsboende-for-aldre_slutversion_210924.pdf"}, "size": {"rule": "per_building", "value_m2": null, "strength": "none", "source": "no m² found", "confidence": "verified"}, "layer": "services"}, {"id": "sabo_clean_store", "label_en": "Clean supplies / sterile store", "label_sv": "Materialförråd / sterilförråd / närförråd", "required": {"strength": "programme", "basis": "Uppsala p. 18, 19 and 21: närförråd per group, materialförråd per floor, small sterile store by the health staff office. BOV 2025: sterile goods kept apart from other cleanliness grades.", "url": "https://www.uppsala.se/contentassets/7608aa284a64481bb52150f3fa6ee3a7/funktionsprogram-for-nytt-vard--och-omsorgsboende-for-aldre_slutversion_210924.pdf"}, "size": {"rule": "per_group", "value_m2": null, "strength": "none", "source": "no m² found", "confidence": "verified"}, "layer": "space_plan"}, {"id": "sabo_aid_storage", "label_en": "Assistive-device store (clean / returned), with charging", "label_sv": "Hjälpmedelsförråd", "required": {"strength": "programme", "basis": "Uppsala p. 24: storage, adjustment and cleaning of aids near goods reception. Botkyrka p. 32: space for hoist, shower trolley and transport chair, at least two 16 A outlets. Göteborg Morans 2022: clean and dirty aids must not be mixed, separate rooms for returned and clean. BOV p. 133: secure space for bulky aids.", "url": "https://www.botkyrka.se/download/18.13554ca8173e7b670d1ec11/1598379351184/Riktlinjer%20f%C3%B6r%20lokalfunktionsprogram%20f%C3%B6r%20s%C3%A4rskilda%20boenden%20m%20m.pdf"}, "size": {"rule": "per_group", "value_m2": null, "strength": "none", "source": "No m² in checked programmes. The 1.2 m²/resident in space_requirements.json is unverified.", "confidence": "indicative"}, "binding_constraint": "none", "layer": "space_plan", "notes": "If this room is missing, corridors fill with equipment and escape width is lost."}, {"id": "sabo_laundry", "label_en": "Laundry for house textiles; separate staff workwear laundry", "label_sv": "Tvättstuga (verksamhet) och tvätt för arbetskläder", "required": {"strength": "programme", "basis": "Uppsala p. 21-22: at least one laundry for the whole house with separate clean and dirty zones, a second one for workwear by the changing rooms, plus machines in every apartment bathroom.  e.g. infection risk), 52 § (shower always when work carries infection risk), 40-41 §§ (lockable storage).", "url": "https://www.av.se/globalassets/filer/publikationer/foreskrifter/utformning-av-arbetsplatser-afs2023-12.pdf"}, "size": {"rule": "per_staff", "value_m2": null, "count": "lockers for all staff; sized to the largest shift overlap", "strength": "none", "source": "AFS gives no m². Uppsala p. 22 sizes to staff numbers per project.", "confidence": "verified"}, "layer": "space_plan"}, {"id": "sabo_staff_wc", "label_en": "Staff WCs", "label_sv": "Personaltoaletter", "required": {"strength": "law", "basis": "AFS 2023:12 3 kap. 56-58 §§. Allmänt råd to 56 §: generally one toilet per started group of about 15 workers. 3 kap. 4 § p. 6: in new or rebuilt workplaces, at least one accessible toilet per floor.", "url": "https://www.av.se/globalassets/filer/publikationer/foreskrifter/utformning-av-arbetsplatser-afs2023-12.pdf"}, "size": {"rule": "fixed", "value_m2": 4.84, "count": "1 per ~15 staff (guidance); at least one accessible per floor", "strength": "guidance", "source": "AFS 2023:12 3 kap. 58 § allmänt råd: an accessible toilet should be at least 2.2 x 2.2 m.", "url": "https://www.av.se/globalassets/filer/publikationer/foreskrifter/utformning-av-arbetsplatser-afs2023-12.pdf", "confidence": "verified"}, "layer": "services"}, {"id": "sabo_staff_room", "label_en": "Staff dining / break room", "label_sv": "Personalmatsal / pausutrymme", "required": {"strength": "law", "basis": "AFS 2023:12 3 kap. 60 § (eat at table with chairs with backrest), 61 § (fridge, heating, washing up), 62 § (break space).", "url": "https://www.av.se/globalassets/filer/publikationer/foreskrifter/utformning-av-arbetsplatser-afs2023-12.pdf"}, "size": {"rule": "per_staff", "value_m2": null, "strength": "none", "source": "No m² in AFS or the programmes. Göteborg Morans 2022: about 80-90 staff in total in one home.", "confidence": "verified"}, "layer": "space_plan"}, {"id": "sabo_staff_rest_room", "label_en": "Staff rest room", "label_sv": "Vilrum", "required": {"strength": "law", "basis": "AFS 2023:12 3 kap. 63 §: a suitable space for temporary, undisturbed lying rest. Allmänt råd: a separate rest room may be needed when more than 50 people work in the same area. Uppsala p. 23: rest room with bed, bedside table and chair.", "url": "https://www.av.se/globalassets/filer/publikationer/foreskrifter/utformning-av-arbetsplatser-afs2023-12.pdf"}, "size": {"rule": "per_building", "value_m2": null, "strength": "none", "source": "no m² found", "confidence": "verified"}, "layer": "space_plan"}, {"id": "sabo_main_entrance", "label_en": "Main entrance with seating, transport-wheelchair store and visitors' WC", "label_sv": "Huvudentré med RWC och förråd för transportrullstolar", "required": {"strength": "law", "basis": "BFS 2024:12 2 kap. 1 § and 3 kap. 1 §: main entrances must be accessible and easy to perceive. Uppsala p. 20 (programme): seating inside, accessible WC at the main entrance, store for transport wheelchairs with charging, entrance kept separate from goods handling.", "url": "https://rinfo.boverket.se/BFS2024-12/pdf/BFS2024-12.pdf"}, "size": {"rule": "per_building", "value_m2": null, "strength": "none", "source": "no m² found", "confidence": "verified"}, "layer": "space_plan"}, {"id": "sabo_corridors", "label_en": "Corridors (bed-transport capable, rest seating)", "label_sv": "Korridorer", "required": {"strength": "law", "basis": "BFS 2024:12 2 kap. 2 §: width set by use, layout and length. 3 kap. 2 §: stretcher transport possible from each boendeenhet. BFS 2024:7: escape route rules for 5B.", "url": "https://rinfo.boverket.se/BFS2024-12/pdf/BFS2024-12.pdf"}, "size": {"rule": "derived", "value_m2": null, "strength": "none", "source": "No width is set in the new regulations, which are functional and have no allmänna råd for widths. The 1800 mm in space_requirements.json is unverified. Uppsala p. 20 asks for walking routes with rest places and loops back to the start.", "confidence": "indicative"}, "binding_constraint": "corridor_width", "layer": "space_plan"}, {"id": "sabo_lift", "label_en": "Lift (stretcher / bed)", "label_sv": "Hiss", "required": {"strength": "law", "basis": "BFS 2024:12 2 kap. 2 § (lift where level difference over 1 m), 2 kap. 5 § (wheelchair user plus helper, free space short side at least 1100 mm), 3 kap. 5 § (stretcher transport by lift in a residential building with more than four storeys). Bed-sized lift is programme practice.", "url": "https://rinfo.boverket.se/BFS2024-12/pdf/BFS2024-12.pdf"}, "size": {"rule": "per_building", "value_m2": null, "strength": "none", "source": "dimension rule only (1100 mm short side)", "confidence": "verified"}, "binding_constraint": "lift_car_size", "layer": "structure"}, {"id": "sabo_garden", "label_en": "Enclosed garden / outdoor space", "label_sv": "Trädgård / friyta", "required": {"strength": "programme", "basis": "Uppsala p. 24-25: garden reachable easily, one central larger seating area and several smaller ones, loop paths. Göteborg förstudie p. 4: open space dedicated to residents next to the building.", "url": "https://www4.goteborg.se/prod/intraservice/namndhandlingar/samrumportal.nsf/BA5E0FA0592B43F9C125897900478B70/$File/21. TU Forstudie gallande nybyggnation av vard och omsorgsboende vid Onneredsvagen.pdf"}, "size": {"rule": "per_unit", "value_m2": 15, "range_m2": [15, 20], "count": "per resident", "strength": "programme", "source": "Göteborgs Stad förstudie Önneredsvägen p. 4: open-space key figure 15-20 m² per resident or apartment. Partly compensated by large glazed balconies if the site is tight.", "confidence": "verified"}, "constraints": {"ground_level_access": true}, "binding_constraint": "site_open_space", "layer": "site"}, {"id": "sabo_guest_room", "label_en": "Guest room for relatives", "label_sv": "Gästrum", "required": {"strength": "programme", "basis": "Botkyrka 2017 p. 32 (for relatives keeping vigil, long-distance visitors).", "url": "https://www.botkyrka.se/download/18.13554ca8173e7b670d1ec11/1598379351184/Riktlinjer%20f%C3%B6r%20lokalfunktionsprogram%20f%C3%B6r%20s%C3%A4rskilda%20boenden%20m%20m.pdf"}, "size": {"rule": "per_building", "value_m2": null, "strength": "none", "source": "no m² found", "confidence": "verified"}, "layer": "space_plan"}], "variants": [{"id": "dementia_unit", "label": "Dementia unit (demensboende)", "changes": "Apartments may omit fixed cooking fittings, but installations must be prepared (BFS 2024:11 3 kap. 3 § tredje stycket). Simple, overviewable plan without long corridors. Walking loops inside and in the garden (Uppsala p. 11, 24-25). The garden boundary is enclosed without feeling locked in. Calm acoustics and colour/contrast for orientation. Nyköping and Uppsala plan all apartments to be dementia-capable. The legal basis for locking unit doors is unresolved, see open_questions."}, {"id": "production_kitchen", "label": "Cooking (production) kitchen vs receiving kitchen", "changes": "Uppsala leaves the choice to each project. A production kitchen needs goods delivery, a reception room, food stores and extra staff facilities next to it (Uppsala p. 22). Göteborg's 100-120 m² LOA per resident includes a production kitchen, restaurant and café."}, {"id": "short_term_stay", "label": "Short-term stay (korttidsboende)", "changes": "Same hygiene principles as health care. Single rooms each with their own hygiene room (BOV 2025 p. 133-134). Botkyrka uses the 31-40 m² apartment type."}], "conversion_from_office": {"typical_blockers": ["Sprinkler is mandatory in 5B and cannot be waived on change of use (BFS 2024:7 7 kap. 48 §, 10 kap. 7 §). Each apartment is its own fire cell. Fire alarm, evacuation alarm and two escape routes are required. Avsteg on fire cells, number of escape doors and alarms is not allowed on change of use (10 kap. 2-5 §§).", "Deep office floor plates: 30-35 m² apartments need facade length (about 3.6-4 m width each). The core zone then becomes too large unless filled with group common rooms, utilities and staff rooms.", "A wet room in every apartment means drainage, floor drains and shafts at each apartment position.", "Ceiling height: Botkyrka asks for 2600 mm clear, for the hoist track above sprinkler and ducts. Office floor-to-floor heights with raised floors and suspended ceilings may not fit.", "Stretcher transport from every unit, and a stretcher lift above 4 storeys (BFS 2024:12 3 kap. 2 § and 5 §).", "Dwelling acoustics between apartments, and residential daylight and outlook. A bedridden resident must be able to see out (Uppsala), so office sill heights may need lowering.", "Outdoor space of 15-20 m² per resident at ground level (Göteborg) is rare on office sites."], "typical_enablers": ["Generous structural grid and load capacity for ceiling hoists and balconies.", "Existing large lifts and central cores; goods entrance and loading bay from office logistics.", "Ground floor suits entrance, activity room, kitchen, goods reception and staff areas, which are not dwellings and not facade-critical.", "Office ventilation capacity can usually meet the BOV targets of at least 2 air changes per hour in apartments and at least 3 in common rooms (BOV 2025)."]}, "sources": [{"ref": "Socialtjänstlag (2025:400), lagen.nu (8 kap. 4 §, 10 kap. 7 §, 11 kap. 3 §, 26 kap. 1-2 §§)", "url": "https://lagen.nu/2025:400", "accessed": "2026-10-19"}, {"ref": "Socialtjänstförordning (2025:468) 2 kap. 1-2 §§", "url": "https://www.riksdagen.se/sv/dokument-och-lagar/dokument/svensk-forfattningssamling/socialtjanstforordning-2025468_sfs-2025-468/", "accessed": "2026-10-19"}, {"ref": "Hälso- och sjukvårdslag (2017:30) 5 kap. 1-2 §§", "url": "https://lagen.nu/2017:30", "accessed": "2026-10-19"}, {"ref": "BFS 2024:7 Boverkets föreskrifter om brandskydd (original text, as issued)", "url": "https://rinfo.boverket.se/BFS2024-7/pdf/BFS2024-7.pdf", "accessed": "2026-10-19"}, {"ref": "BFS 2024:11 Boverkets föreskrifter om bostäders lämplighet n kitchen, dining and living room, the staff base, the aid storage or the sluice room. All are null.", "Whether a SÄBO counts as a 'publik lokal' under BFS 2024:12 2 kap. 7 §, which would make an accessible public toilet a legal requirement rather than programme.", "Paragraph numbers in HSLF-FS 2017:37 for medicine storage have not been checked.", "Areas in the programmes are given as BOA, LOA or 'total' without a stated standard. A conversion to BTA (SS 21054) is needed for the fit test."]}, "food_hall": {"id": "food_hall", "label_en": "Food hall / market hall", "label_sv": "Food hall / saluhall", "family": "hospitality", "summary": "Several independent food vendors (stalls with own preparation and sales counters) around shared seating, often with a bar. Swedish law has no 'food hall' category: each stall is its own livsmedelsanläggning to register (LIVSFS 2022:8), the shared seating is a serving/assembly area in verksamhetsklass 2A/2B (2C with alcohol beyond limited extent and >150 persons), and the hall operator typically provides shared back-of-house (goods reception, waste, dishwashing, grease separator, staff facilities, guest WCs). The large open volume, many kitchen exhausts and high occupancy make it one of the most demanding conversions of an office ground floor.", "regulatory": {"bbr_verksamhetsklass": "Shared seating and circulation: 2A (≤150 persons) / 2B (>150) per BFS 2024:7 2 kap. 11–12 §§ (serveringsutrymmen, butiksutrymmen, samlingslokaler); 2C (13 §) if alcohol beyond limited extent and >150 persons; vk 0 (9 §) if >1 200 persons unfamiliar with the premises, or >600 with alcohol. See cross_cutting.json fire_vk_2abc, fire_vk_0.", "key_laws": [{"ref": "Förordning (EG) nr 852/2004 om livsmedelshygien, bilaga II", "url": "https://eur-lex.europa.eu/legal-content/SV/TXT/?uri=CELEX:32004R0852"}, {"ref": "LIVSFS 2022:8 registrering och godkännande", "url": "https://www.livsmedelsverket.se/globalassets/om-oss/lagstiftning/offentlig-kontroll/livsfs-2022-8_web_t.pdf"}, {"ref": "BFS 2024:7 brandskydd", "url": "https://rinfo.boverket.se/BFS2024-7/pdf/BFS2024-7.pdf"}, {"ref": "BFS 2024:8 hygien, hälsa och miljö", "url": "https://rinfo.boverket.se/BFS2024-8/pdf/BFS2024-8.pdf"}, {"ref": "Alkohollag (2010:1622) 8 kap. 14 § (defined serving area; shared serving area), 16 §", "url": "https://www.riksdagen.se/sv/dokument-och-lagar/dokument/svensk-forfattningssamling/alkohollag-20101622_sfs-2010-1622/"}, {"ref": "AFS 2023:12 Utformning av arbetsplatser", "url": "https://www.av.se/globalassets/filer/publikationer/foreskrifter/utformning-av-arbetsplatser-afs2023-12.pdf"}], "permits": ["Bygglov for change of use (PBL 9 kap. 15 § 1, cross_cutting.json cou_bygglov_trigger); detaljplan should allow Centrum (C) — mixed retail, restaurants and assembly (Boverket kunskapsbanken 'Centrum').", "Anmälan (PBF 6 kap. 1 §) for ventilation, VA and fire protection; each later stall fit-out may need its own anmälan.", "One registration per vendor's livsmedelsanläggning (LIVSFS 2022:8 2 §), lodged with the municipal control authority; start on registration or two weeks after notification (9 §).", "Serveringstillstånd for alcohol; Alkohollag 8 kap. 14 § allows a permit for a shared serving area (wording read via summary only).", "Municipal VA: grease separator(s)."], "operator_oversight": "Kommunal livsmedelskontroll (per vendor); alkoholhandläggning; räddningstjänsten; byggnadsnämnd; VA-huvudman; Arbetsmiljöverket (each employer, plus samordning)", "cross_cutting_refs": ["cou_bygglov_trigger", "cou_anmalan", "fire_vk_0", "fire_vk_2abc", "fire_egress_dimensions", "fire_change_of_use_floor", "occ_density_law_2024", "occ_density_bbr_table_5333", "access_public_premises_wc", "san_public", "staff_personalutrymmen_general", "staff_changing_showers_storage", "staff_eating_rest", "loads_imposed_table_4_1"]}, "occupancy": {"unit": "seat", "gross_m2_per_unit": {"value": null, "range": null, "strength": "none", "source": "No Swedish public source found for m2 per seat or per vendor in food halls.", "confidence": "verified"}, "staff_per_unit": {"value": null, "strength": "none", "source": "No public source found."}, "egress_design_density": {"persons_per_m2": null, "strength": "law", "source": "BFS 2024:7 2 kap. 4 §: design number = maximum expected persons; defaults only for affärslokal 0.5, pub/bar 3.0, samlingslokal 2.5 persons/m2. A food hall mixes seated dining, queueing and standing; which default applies to which zone is a fire-engineering judgment. At 2.5/m2 the 150-person 2B threshold is passed at ~60 m2.", "url": "https://rinfo.boverket.se/BFS2024-7/pdf/BFS2024-7.pdf", "confidence": "verified"}, "hours_profile": "evening_weekend", "hourly_presence": [0, 0, 0, 0, 0, 0, 0, 0, 0.05, 0.1, 0.2, 0.6, 0.9, 0.7, 0.35, 0.3, 0.4, 0.6, 0.8, 0.8, 0.6, 0.4, 0.15, 0.05], "hourly_presence_note": "Modelling assumption (indicative, not sourced): lunch and evening peaks, share of seats occupied; weekends flatter and later."}, "spaces": [{"id": "fh_shared_seating", "label_en": "Shared seating hall", "label_sv": "Gemensam sittyta", "required": {"strength": "practice", "basis": "Defining space of the concept; no regulated size.", "url": ""}, "size": {"rule": "per_seat", "value_m2": null, "range_m2": null, "count": "seats", "strength": "none", "source": "", "url": "", "confidence": "verified"}, "constraints": {"min_ceiling_height_mm": null, "daylight_required": false, "facade_required": true}, "depends_on": ["fh_vendor_stalls", "fh_guest_wc", "fh_ventilation"], "shareable_with": ["coworking", "office", "restaurant_cafe"], "shareable_note": "Morning work café, events and markets outside meal peaks.", "binding_constraint": "egress", "layer": "space_plan", "notes": "Most food halls exceed 150 persons → 2B (fire alarm, evacuation alarm, emergency lighting, two independent exits, alternative exit to main entrance, door width 1.00 m per 150 persons — cross_cutting.json fire_vk_2abc, fire_egress_dimensions). Exit count cannot be relaxed at change of use for 2B/2C. Large open volume: fire-gas control and fire-cell size limits (BFS 2024:7 5 kap. 27 §) may need checking — not analysed here."}, {"id": "fh_vendor_stalls", "label_en": "Vendor stalls with preparation and sales counter", "label_sv": "Matstånd med beredning och disk", "required": {"strength": "law", "basis": "Each stall where food is prepared is a food room under EU 852/2004 Annex II ch. II (hygienic design, cleaning facilities, food-washing where necessary) and needs hand-wash basins (ch. I p. 4).", "url": "https://www.legislation.gov.uk/eur/2004/852/annex/II"}, "size": {"rule": "per_unit", "value_m2": null, "range_m2": null, "count": "number of vendors", "strength": "none", "source": "No size in regulation; no public Swedish benchmark found.", "url": "", "confidence": "verified"}, "constraints": {"min_ceiling_height_mm": null, "daylight_required": false, "facade_required": false}, "depends_on": ["fh_exhaust", "fh_grease_separator", "fh_handwash"], "shareable_with": [], "shareable_note": "", "binding_constraint": "exhaust_shaft_and_drainage", "layer": "services", "notes": "Stalls with frying/grilling are likely 'storkök' for fire purposes (imkanal EI 60/EI 30, non-combustible hoods, deposit control: BFS 2024:7 4 kap. 23–24 §§, 5 kap. 20 §; surface classes 5 kap. 17 §; own fire cell if particular fire risk unless automatic extinguishing, 5 kap. 26 §). Open stalls inside a 2B hall make the 'own fire cell' option hard — automatic extinguishing per hood is the usual route (practice). Stall staff are at permanent workplaces (AFS 2023:12 5 kap. 25 § daylight/view or compensation)."}, {"id": "fh_exhaust", "label_en": "Kitchen exhaust ducts and outlets (per stall or collected)", "label_sv": "Imkanaler och avluft", "required": {"strength": "law", "basis": "BFS 2024:7 4 kap. 22–24 §§, 5 kap. 20 §; BFS 2024:8 9 kap. 1 § (outlets placed so no nuisance in surroundings) — see restaurant_cafe.rest_exhaust.", "url": "https://rinfo.boverket.se/BFS2024-7/pdf/BFS2024-7.pdf"}, "size": {"rule": "derived", "value_m2": null, "range_m2": null, "count": "one duct per cooking stall or collected system", "strength": "none", "source": "", "url": "", "confidence": "verified"}, "constraints": {"min_ceiling_height_mm": null, "daylight_required": false, "facade_required": false}, "depends_on": [], "shareable_with": [], "shareable_note": "", "binding_constraint": "vertical_shaft_to_roof", "layer": "services", "notes": "Multiplies the restaurant exhaust problem by the number of cooking vendors; a collected system needs rating and cleaning access for all branches."}, {"id": "fh_ventilation", "label_en": "Hall ventilation and make-up air", "label_sv": "Hallventilation och ersättningsluft", "required": {"strength": "law", "basis": "BFS 2024:8 3 kap. 1, 3–4 §§ (acceptable air quality, no spread of pollutants, continuous air exchange; functional). Staff: AFS 2023:12 5 kap. 4 § (7 l/s per person + 0.35 l/s per m2).", "url": "https://rinfo.boverket.se/BFS2024-8/pdf/BFS2024-8.pdf"}, "size": {"rule": "derived", "value_m2": null, "range_m2": null, "count": "", "strength": "none", "source": "No national l/s per guest found for public dining.", "url": "", "confidence": "verified"}, "constraints": {"min_ceiling_height_mm": null, "daylight_required": false, "facade_required": false}, "depends_on": [], "shareable_with": [], "shareable_note": "", "binding_constraint": "ventilation", "layer": "services", "notes": "Large kitchen extract volumes need balanced make-up air; office air-handling units rarely suffice."}, {"id": "fh_handwash", "label_en": "Hand-wash basins (each stall)", "label_sv": "Handtvättställ (per stånd)", "required": {"strength": "law", "basis": "EU 852/2004 Annex II ch. I p. 4; kontrollwiki art. 1045.", "url": "https://kontrollwiki.livsmedelsverket.se/artikel/1045"}, "size": {"rule": "derived", "value_m2": null, "range_m2": null, "count": "at least one per food-handling stall (practice reading of 'suitably located')", "strength": "none", "source": "", "url": "", "confidence": "verified"}, "constraints": {"min_ceiling_height_mm": null, "daylight_required": false, "facade_required": false}, "depends_on": [], "shareable_with": [], "shareable_note": "", "binding_constraint": "plumbing_shafts", "layer": "services", "notes": "Water and drainage to every stall position across an office slab is a key cost driver."}, {"id": "fh_grease_separator", "label_en": "Grease separator(s)", "label_sv": "Fettavskiljare", "required": {"strength": "programme", "basis": "Municipal VA rules (e.g. MittSverige Vatten & Avfall: restaurants, cafés, bakeries etc. require SS-EN 1825 separator). BFS 2024:8 8 kap. 15 §: WC wastewater not to grease separator.", "url": "https://msva.se/vatten-och-avlopp/verksamheter/riktlinjer-for-verksamheter/riktlinjer-for-verksamheter-i-sundsvall/restaurang-och-storkok"}, "size": {"rule": "derived", "value_m2": null, "range_m2": null, "count": "sized per SS-EN 1825-2 for combined flow", "strength": "none", "source": "", "url": "", "confidence": "sourced"}, "constraints": {"min_ceiling_height_mm": null, "daylight_required": false, "facade_required": false}, "depends_on": [], "shareable_with": ["restaurant_cafe", "grocery_store"], "shareable_note": "Typically one shared separator owned by the hall operator.", "binding_constraint": "drainage_and_emptying_access", "layer": "services", "notes": "Responsibility for a shared separator among several food businesses should be agreed with the VA utility."}, {"id": "fh_shared_dishwash", "label_en": "Shared dishwashing (if reusable tableware)", "label_sv": "Gemensam disk", "required": {"strength": "practice", "basis": "Concept-dependent; if present EU 852/2004 Annex II ch. II p. 2 applies (cleaning/disinfecting facilities, hot and cold water).", "url": "https://www.legislation.gov.uk/eur/2004/852/annex/II"}, "size": {"rule": "per_building", "value_m2": null, "range_m2": null, "count": "", "strength": "none", "source": "", "url": "", "confidence": "verifi _hall", "label": "Street-food hall (many cooking vendors, shared seating, bar)", "changes": "Many storkök-type exhausts and extinguishing systems; 2B/2C; high evening occupancy."}], "conversion_from_office": {"typical_blockers": ["Multiple fire-rated kitchen exhaust routes to roof through occupied office floors.", "Water, drainage and grease-separator routes to many stall positions in an office slab.", "Change to 2B/2C (or vk 0) occupancy: exits, alarms, travel distances; exit count not relaxable at change of use.", "Detaljplan must allow mixed Centrum use.", "Make-up air and plant space far beyond office capacity."], "typical_enablers": ["Large, high, column-light ground floor or atrium with several street entrances.", "Office population above as lunch market; seating can double as daytime work café."]}, "sources": [{"ref": "EU 852/2004 bilaga II kap. I p. 3, 4, 9; kap. II p. 1–2; kap. VI (legislation.gov.uk copy of original text)", "url": "https://www.legislation.gov.uk/eur/2004/852/annex/II", "accessed": "2026-10-19"}, {"ref": "LIVSFS 2022:8 — 2, 6, 9 §§", "url": "https://www.livsmedelsverket.se/globalassets/om-oss/lagstiftning/offentlig-kontroll/livsfs-2022-8_web_t.pdf", "accessed": "2026-10-19"}, {"ref": "Livsmedelsverket kontrollwiki art. 1045 (toaletter och handfat)", "url": "https://kontrollwiki.livsmedelsverket.se/artikel/1045", "accessed": "2026-10-19"}, {"ref": "BFS 2024:7 — 2 kap. 4, 9, 11–13 §§; 4 kap. 22–24 §§; 5 kap. 17, 20, 26–27 §§", "url": "https://rinfo.boverket.se/BFS2024-7/pdf/BFS2024-7.pdf", "accessed": "2026-10-19"}, {"ref": "BFS 2024:8 — 3 kap. 1–4 §§, 8 kap. 15 §, 9 kap. 1 §, 11 kap.", "url": "https://rinfo.boverket.se/BFS2024-8/pdf/BFS2024-8.pdf", "accessed": "2026-10-19"}, {"ref": "Alkohollag (2010:1622) 8 kap. 14, 16 §§ (as amended to SFS 2026:511)", "url": "https://www.riksdagen.se/sv/dokument-och-lagar/dokument/svensk-forfattningssamling/alkohollag-20101622_sfs-2010-1622/", "accessed": "2026-10-19"}, {"ref": "MittSverige Vatten & Avfall od rooms, changing facilities where needed and waste storage, but no sizes. Heavy goods flows make the goods reception (AFS 2023:12 3 kap. 32 §) and floor loads the typical blockers in an office building.", "regulatory": {"bbr_verksamhetsklass": "2A (≤150 persons) or 2B (>150 persons) — BFS 2024:7 2 kap. 11–12 §§ 'butiksutrymmen'. See cross_cutting.json fire_vk_2abc.", "key_laws": [{"ref": "Förordning (EG) nr 852/2004 om livsmedelshygien, bilaga II", "url": "https://eur-lex.europa.eu/legal-content/SV/TXT/?uri=CELEX:32004R0852"}, {"ref": "LIVSFS 2022:8 Livsmedelsverkets föreskrifter om registrering och godkännande", "url": "https://www.livsmedelsverket.se/globalassets/om-oss/lagstiftning/offentlig-kontroll/livsfs-2022-8_web_t.pdf"}, {"ref": "AFS 2023:12 Utformning av arbetsplatser", "url": "https://www.av.se/globalassets/filer/publikationer/foreskrifter/utformning-av-arbetsplatser-afs2023-12.pdf"}, {"ref": "BFS 2024:7 brandskydd", "url": "https://rinfo.boverket.se/BFS2024-7/pdf/BFS2024-7.pdf"}, {"ref": "BFS 2024:8 hygien, hälsa och miljö (8 kap. 15 §, 11 kap.)", "url": "https://rinfo.boverket.se/BFS2024-8/pdf/BFS2024-8.pdf"}], "permits": ["Bygglov for change of use from office (PBL 9 kap. 15 § 1, see cross_cutting.json cou_bygglov_trigger); detaljplan must allow Detaljhandel (H) or Centrum (C).", "Anmälan (PBF 6 kap. 1 §) for ventilation, VA (incl. any grease separator), refrigeration-related structural or fire changes.", "Registration of the livsmedelsanläggning: written notification to the municipal control authority (LIVSFS 2022:8 2 §, 6 §); activity may start when registered, or two weeks after the notification arrived even if not yet registered (9 §).", "Municipal VA approval/notification of grease separator where required by local ABVA rules."], "operator_oversight": "Kommunal livsmedelskontroll (miljöförvaltning); byggnadsnämnd; räddningstjänsten; Arbetsmiljöverket", "cross_cutting_refs": ["cou_bygglov_trigger", "cou_anmalan", "fire_vk_2abc", "fire_egress_dime
