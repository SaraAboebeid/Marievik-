lows from PBL 8 kap. 9 § (tomt arrangements) and municipal waste regulations. Malmö p. 11 calls for teknik- och miljöhus.", "url": "https://malmo2.miljobarometern.se/content/docs/Friytor%20vid%20f%C3%B6rskolor%20och%20skolor%20rev%2020211216.pdf"}, "size": {"rule": "per_building", "value_m2": null, "strength": "none", "source": "No size found in the reviewed sources. The Göteborg project (p. 12) gives a maximum 25 m carrying distance from the truck to the inside of the waste house (10 m preferred).", "url": "https://www4.goteborg.se/prod/intraservice/namndhandlingar/samrumportal.nsf/1CCC028724FEEA1DC1258B9C00395D64/$File/13%20Bilaga%202.pdf", "confidence": "sourced"}, "constraints": {"vehicle_access_required": true}, "depends_on": [], "shareable_with": ["housing_apartment", "student_housing", "co_living", "senior_housing"], "binding_constraint": "site_access", "layer": "site"}, {"id": "preschool_outdoor_friyta", "label_en": "Outdoor play area (friyta)", "label_sv": "Friyta för lek och utevistelse (förskolegård)", "required": {"strength": "law", "basis": "PBL 8 kap. 9 § andra stycket: a tomt with premises for förskola must have sufficiently large friyta suitable for play and outdoor stay, on the tomt or nearby. 8 kap. 10-11 §§ apply this 'i skälig utsträckning' to built tomter and changes needing bygglov. If space is short, friyta takes priority over parking (8 kap. 9 §).", "url": "https://www.riksdagen.se/sv/dokument-och-lagar/dokument/svensk-forfattningssamling/plan-och-bygglag-2010900_sfs-2010-900/"}, "size": {"rule": "per_unit", "value_m2": 40, "range_m2": [25, 40], "count": "children; Boverket also says the total friyta should preferably exceed 3 000 m²", "strength": "guidance", "source": "Boverket & Movium, 'Gör plats för barn och unga!' (Boverket rapport 2015:8), faktaruta 10, p. 42: 'Ett rimligt dimensionerande mått utifrån antalet barn kan vara 40 m2 friyta per barn i förskolan'; research suggests total friyta should preferably exceed 3 000 m². BFS 2015:1 itself sets no number. Municipal programmes: Malmö ambition 30 m² per child, minimum 25 m² per child next to a public park, and at least 2 000 m² contiguous on the property (not required for ≤60 children) (Malmö friyta guideline 2021, pp. 9-10). Göteborg project uses 40 m² per child under Göteborg's TKA Mark och utemiljö (project report p. 12).", "url": "https://www.boverket.se/globalassets/publikationer/dokument/2015/gor-plats-for-barn-och-unga.pdf", "confidence": "verified"}, "constraints": {"direct_link_to_building": true, "fenced": true, "noise_max_dBA_eq_day": 50, "facade_required": false}, "depends_on": ["preschool_rough_entrance"], "shareable_with": ["park"], "shareable_note": "Can be opened as neighbourhood play space evenings and weekends.", "binding_constraint": "site_area", "layer": "site", "notes": "This decides most urban office-to-preschool conversions. Boverket (p. 44, citing BFS 2015:1) says that for förskola the friyta should lie at the building, so children need not cross a trafficked street. Roof friyta has limited accessibility and counts as complementary. Malmö requires direct connection to the entrance, with no exceptions, and a plantable deck if the yard is on a roof or over a garage. Noise: Boverket faktaruta 11 (p. 43) says at most 50 dBA equivalent daytime level is desirable on play areas. Malmö uses 50 dBA eq / 70 dBA max. The existing data/standards/space_requirements.json says Boverket points to 'roughly 30 m²/child'. Boverket's figure for förskola is 40; 30 is its grundskola figure and Malmö's förskola figure."}, {"id": "preschool_outdoor_shelter", "label_en": "Covered outdoor sleeping / weather shelter", "label_sv": "Väderskydd / sovplats utomhus under tak", "required": {"strength": "programme", "basis": "Uppsala 2015 programme p. 12 §7.2: the förskolegård shall have space for sleeping outdoors under a roof, wind-sheltered, next to the building and overlooked from e.g. the allrum. Sambandsanalys p. 14 lists 'SOVALTAN' and 'VÄDERSKYDD'.", "url": "https://bygg.uppsala.se/globalassets/uppsala-vaxer/dokument/stadsplanering--utveckling/planerade-omraden/bostadsomraden/ulleraker/markanvisning/uppsala-kommuns-generella-lokalprogram-for-forskolelokaler.pdf"}, "size": {"rule": "per_building", "value_m2": null, "strength": "none", "source": "No size found", "confidence": "sourced"}, "constraints": {"direct_link_to_building": true}, "depends_on": ["preschool_outdoor_friyta"], "shareable_with": [], "binding_constraint": "site_area", "layer": "site"}, {"id": "preschool_dropoff_parking", "label_en": "Drop-off, cycle and cargo-bike parking, delivery turning", "label_sv": "Hämtning/lämning, cykel- och lådcykelparkering, angöring", "required": {"strength": "law", "basis": "PBL 8 kap. 9 § (space for parking, loading and unloading on the tomt or nearby, i skälig utsträckning, with friyta given priority over parking)", "url": "https://www.riksdagen.se/sv/dokument-och-lagar/dokument/svensk-forfattningssamling/plan-och-bygglag-2010900_sfs-2010-900/"}, "size": {"rule": "per_building", "value_m2": null, "strength": "none", "source": "No m² found. Malmö (p. 11) requires cycle parking and disabled parking on the site but outside the friyta, and deliveries without reversing. Uppsala (p. 12) asks that reversing vehicle movements be avoided.", "url": "https://malmo2.miljobarometern.se/content/docs/Friytor%20vid%20f%C3%B6rskolor%20och%20skolor%20rev%2020211216.pdf", "confidence": "sourced"}, "constraints": {"vehicle_access_required": true}, "depends_on": [], "shareable_with": [], "binding_constraint": "site_access", "layer": "site"}], "variants": [{"id": "kitchen_cooking", "label": "Tillagningskök (cooking kitchen)", "changes": "Uppsala: about 65 m² for 72 children, about 100 m² for 144 children. Needs a kitchen exhaust duct to roof, a grease separator (municipal ABVA; Växjö, for example, requires one above 25 portions/day), goods delivery, cold and dry stores, and kitchen staff changing and WC (AFS 2023:12). Registered food establishment with a higher risk class because it cooks for small children."}, {"id": "kitchen_receiving", "label": "Mottagningskök (receiving kitchen)", "changes": "Food is cooked elsewhere and delivered. Smaller area (no size found), still registered as a food establishment, still needs goods delivery and handwashing and washing-up facilities under EU 852/2004 bilaga II. Grease separator depends on the municipality (Årjäng exempts receiving-only kitchens; Växjö and Kristinehamn list mottagningskök). Removes most of the exhaust and grease constraint."}, {"id": "upper_floor", "label": "Förskola above ground floor", "changes": "Malmö (p. 9): needs its own entrance with a lift, ground-floor pram and cargo-bike storage, and at least 2 000 m² contiguous friyta in one place. Balconies under 50 m² do not count. Evacuation of Vk5A children from upper floors drives the fire design."}, {"id": "night_open", "label": "Night-open förskola (nattis)", "changes": "Sleeping children overnight. Boverket's report 'Brandskydd på nattis' notes these fit badly into the occupancy classes. Requires kitchen access (Uppsala p. 13). Treat as a separate fire case."}, {"id": "preschool_in_school", "label": "Förskola initially in grundskola premises", "changes": "Uppsala (pp. 8, 11) designs F-3 school premises so they can host förskola for some years. Skötrum, kapprum and a fenced outdoor area must then be added."}], "conversion_from_office": {"typical_blockers": ["No friyta on or next to the site. 40 m²/child (Boverket) or 25-30 m²/child (Malmö) plus a contiguous area of 2 000-3 000 m² rarely exists beside an office building.", "Upper-floor location: children in Vk5A must be evacuated by staff. Requires lift, ground-floor entrance and a fire strategy.", "Deep floor plates: group rooms need daylight and a facade, and the yard should be reachable directly from the group rooms.", "Drainage: many small WCs, changing rooms, laundry and kitchen spread across the plan.", "Ventilation: a much higher air flow per m² than an office (Uppsala's 72-child unit has a 40 m² plant room).", "Noise and air quality on the yard (≤50 dBA eq desirable) at urban office sites.", "Detaljplan: an office (K/C) zoning often does not allow förskola (S)."], "typical_enablers": ["Ground floor with a direct link to a courtyard or adjacent park (Malmö accepts 25 m²/child next to a park).", "Shallow wings with windows on both sides.", "Existing office rooms convert easily to staff workrooms, expedition and conversation rooms.", "Using a receiving kitchen avoids most of the kitchen exhaust and grease constraints."]}, "sources": [{"ref": "Skollagen (2010:800), 2 kap. 35 §, 8 kap. 8 §", "url": "https://www.riksdagen.se/sv/dokument-och-lagar/dokument/svensk-forfattningssamling/skollag-2010800_sfs-2010-800/", "accessed": "2026-10-19"}, {"ref": "Plan- och bygglagen (2010:900) 8 kap. 9-11 §§ (text as reproduced in Boverket rapport 2015:8 faktaruta 14)", "url": "https://www.riksdagen.se/sv/dokument-och-lagar/dokument/svensk-forfattningssamling/plan-och-bygglag-2010900_sfs-2010-900/", "accessed": "2026-10-19"}, {"ref": "Boverket & Movium, 'Gör plats för barn och unga! En vägledning för planering, utformning och förvaltning av skolans och förskolans utemiljö', Boverket rapport 2015:8 — faktaruta 10 p. 42, faktaruta 11 p. 43, placement p. 44", "url": "https://www.boverket.se/globalassets/publikationer/dokument/2015/gor-plats-for-barn-och-unga.pdf", "accessed": "2026-10-19"}, {"ref": "BFS 2024:7 Boverkets föreskrifter och allmänna råd om säkerhet i händelse av brand i byggnader, 2 kap. 18 § (Vk5A)", "url": "https://lagen.nu/bfs/2024:7", "accessed": "2026-10-19"}, {"ref": "AFS 2023:12 Utformning av arbetsplatser, kap. 3 §§ 38-63 (pp. 23-27); in force 2025-01-01, repeals AFS 2020:1", "url": "https://www.av.se/globalassets/filer/publikationer/foreskrifter/utformning-av-arbetsplatser-afs2023-12.pdf", "accessed": "2026-10-19"}, {"ref": "Skolverket, 'Rätt till förskola' (barngrupp riktmärke; SKOLFS 2025:440 kommentarer p. 11)", "url": "https://www.skolverket.se/styrning-och-ansvar/regler-och-ansvar/ansvar-i-skolfragor/ratt-till-forskola", "accessed": "2026-10-19"}, {"ref": "Skolverket, 'Barn och personal i förskola hösten 2025' (beskrivande statistik), pp. 4, 6, 15, 19", "url": "https://www.skolverket.se/download/18.338b7ccc19d8ac2fb50b56e/1776321721245/pdf13405.pdf", "accessed": "2026-10-19"}, {"ref": "Uppsala kommun, 'Program för lokaler i förskola och grundskola F-9' (UBF/SBF 2015-10-22) incl. lokalförteckning förskola 72 barn, pp. 6-17", "url": "https://bygg.uppsala.se/globalassets/uppsala-vaxer/dokument/stadsplanering--utveckling/planerade-omraden/bostadsomraden/ulleraker/markanvisning/uppsala-kommuns-generella-lokalprogram-for-forskolelokaler.pdf", "accessed": "2026-10-19"}, {"ref": "Malmö stad, Stadsbyggnadsnämnden, 'Friytor vid förskolor och skolor' (2016-08-26, rev. 2021-12-16), pp. 9-11", "url": "https://malmo2.miljobarometern.se/content/docs/Friytor%20vid%20f%C3%B6rskolor%20och%20skolor%20rev%2020211216.pdf", "accessed": "2026-10-19"}, {"ref": "Göteborgs Stad, Förstudierapport, beställande nämnd Förskoleförvaltningen, förskola Solvädersbyn (Biskopsgården 103:1), 2024-06-13 (nämndhandling '13 Bilaga 2'), pp. 3-4, 12", "url": "https://www4.goteborg.se/prod/intraservice/namndhandlingar/samrumportal.nsf/1CCC028724FEEA1DC1258B9C00395D64/$File/13%20Bilaga%202.pdf", "accessed": "2026-10-19"}, {"ref": "Livsmedelsverket, Kontrollwiki 'Registrering och godkännande'; registration at least two weeks before start", "url": "https://kontrollwiki.livsmedelsverket.se/artikel/106/registrering-och-godkannande", "accessed": "2026-10-19"}, {"ref": "Förordning (EG) nr 852/2004 om livsmedelshygien", "url": "https://eur-lex.europa.eu/legal-content/SV/TXT/?uri=CELEX:32004R0852", "accessed": "2026-10-19"}, {"ref": "Förordning (1998:899) om miljöfarlig verksamhet och hälsoskydd 38 § (anmälan for förskola, skola etc.); wording taken from municipal forms, not re-checked against SFS", "url": "https://www.riksdagen.se/sv/dokument-och-lagar/dokument/svensk-forfattningssamling/forordning-1998899-om-miljofarlig-verksamhet-och_sfs-1998-899/", "accessed": "2026-10-19"}, {"ref": "Växjö kommun, 'Riktlinjer fettavskiljare' (mars 2021): grease separator required above 25 portions per day", "url": "https://foretag.vaxjo.se/download/18.6b72feac17955ce547beae9/1621603100508/riktlinjer-fettavskiljare_mars-21.pdf", "accessed": "2026-10-19"}, {"ref": "Neufert, Bauentwurfslehre — kindergarten chapter may be consulted for layout practice only; no values copied", "url": null, "accessed": "2026-10-19"}], "open_questions": ["Fire: BFS 2024:7 (in force 2025-07-01) replaced BBR section 5. Confirm the exact Vk5A requirements (alarm, evacuation, compartmentation) for an upper-floor förskola; general rules are in cross_cutting.json.", "Size of a mottagningskök for a förskola: no programme figure found. Uppsala refers to a separate storkök programme that is not public in the reviewed documents.", "Uppsala lists the groventré as 40 m² × 1 for 72 children but describes it as shared per 36 children with 40 m² in the illustration. Clarify which applies.", "The 7.5 m² indoor vistelseyta per child is cited by Malmö (miljönämndens vägledning) and Luleå. Find the primary source; it is widely attributed to older Socialstyrelsen advice, not re-checked.", "Sleeping and rest: no national rule or programme gives a dedicated sleep-room size. Confirm with operators whether project rooms with mattresses are acceptable for 1-2-year-olds.", "Does Göteborg have a public standard förskola lokalprogram (Förskoleförvaltningen 'behovsbeskrivning/funktionsprogram' referenced on p. 4 of the project report)? That would give a city-wide norm rather than a single project figure.", "Daylight, ventilation and acoustic thresholds are left to cross_cutting.json. The daylight requirement formerly in BBR 6:3 (repealed BBR, pre-2025) now sits in the BFS 2024:x set; see cross_cutting.json."]}, "primary_care_clinic": {"id": "primary_care_clinic", "label_en": "Primary care clinic (health centre)", "label_sv": "Vårdcentral / hälsocentral", "family": "health", "summary": "Outpatient primary care under the Health and Medical Services Act (HSL). The law requires only that the premises and equipment needed for good, hygienic care exist (HSL 5 kap. 1-2 §§). Room lists and sizes come from the national PTS concept programme for primary care (2022) and regional standard rooms (typrum): general consulting rooms 12-16 m², specialised ones 16-20 m². Hygiene layout follows the professional guideline BOV (Svensk Förening för Vårdhygien). Fire class is 2A (or 2B above 150 persons) for the reception areas. Office buildings convert well, apart from separate infection entrances, ventilation and wet installations in every consulting room.", "regulatory": {"bbr_verksamhetsklass": "2A (2B if more than 150 persons); staff-only areas 1; 5C only if care is given to people who cannot self-evacuate", "bbr_verksamhetsklass_source": "BFS 2024:7 2 kap. 11 § (2A, at most 150 persons) and 12 § (2B, more than 150 persons) both list 'mottagning på vårdcentraler'. 2 kap. 10 § (1, offices). 2 kap. 20 § (5C). Boverket PBL kunskapsbanken: a health centre where care under 5C is given is classed 5C for that part. https://rinfo.boverket.se/BFS2024-7/pdf/BFS2024-7.pdf", "key_laws": [{"ref": "Hälso- och sjukvårdslag (2017:30) 5 kap. 1 § (good care, good hygienic standard, easily accessible) and 5 kap. 2 § (the staff, premises, medical devices and equipment needed for good care)", "url": "https://lagen.nu/2017:30"}, {"ref": "HSL 2 kap. 6 § (definition of primary care) and 13 a kap. 1 § (primary care basic mission)", "url": "https://lagen.nu/2017:30"}, {"ref": "SOSFS 2015:10 basal hygien i vård och omsorg (staff hygiene, so hand-wash basins and disinfection points are needed)", "url": "https://www.regiondalarna.se/contentassets/0094a97d15394247bf70887bbce88169/byggnation-och-vardhygien-bov-2025-06-24.pdf"}, {"ref": "HSLF-FS 2017:37 läkemedelshantering (locked storage). Paragraph numbers not checked.", "url": "https://www.regiondalarna.se/contentassets/0094a97d15394247bf70887bbce88169/byggnation-och-vardhygien-bov-2025-06-24.pdf"}, {"ref": "BFS 2024:12 2 kap. 7 § and 3 kap. 7 § (public premises: if public toilets exist, at least one accessible with wheelchair turning and side transfer on both sides); 3 kap. 6 § (hearing loop in receptions)", "url": "https://rinfo.boverket.se/BFS2024-12/pdf/BFS2024-12.pdf"}, {"ref": "AFS 2023:12 Utformning av arbetsplatser (staff facilities; see cross_cutting.json staff_*)", "url": "https://www.av.se/globalassets/filer/publikationer/foreskrifter/utformning-av-arbetsplatser-afs2023-12.pdf"}], "permits": ["Bygglov for change of use (PBL 9 kap. 15 § 1, from 2025-12-01) if office use changes to health care. See cross_cutting.json cou_bygglov_trigger. Whether office to clinic counts as a change of use under the plan is case-specific.", "Care-provider registration with IVO (vårdgivarregistret). The legal reference was not checked in this research.", "Contract with the region under vårdval (LOV) for private providers"], "operator_oversight": "IVO; the region (vårdval contract)"}, "occupancy": {"unit": "listed_patient", "gross_m2_per_unit": {"value": 0.13, "range": [0.07, 0.2], "strength": "practice", "source": "PTS/CVA Konceptprogram lokaler för primärvård 2022, bilaga 2 case examples (m² BRA per listed patient): Lindesberg about 2670 m² / 13 000 listed (0.2); Linköping example about 1640 m² / about 21 000 (0.07); Råslätt about 1750 m² / 10 700 (0.16); Capio Landskrona about 1000 m² / 11 200 (0.09); further examples 0.2 and 0.09. The value 0.13 is the approximate median of these examples (derived).", "url": "https://www.ptsforum.se/media/3522/konceptprogram-primaervaard-220520.pdf", "confidence": "verified", "notes": "PTS itself warns that listed patients are an uncertain basis for sizing. It recommends calculating from visits per consulting room (bilaga 1). Typical clinics hold about 10 000-20 000 listed patients in about 1000-2700 m² BRA."}, "staff_per_unit": {"value": 0.00067, "strength": "practice", "source": "PTS förstudie primärvård 2022 (search snippet): Region Kalmar län plans for 1500 listed persons per doctor (about 0.00067 doctors per listed patient). Total staff not given.", "url": "https://www.ptsforum.se/media/3523/foerstudie-primaervaard-220520.pdf", "confidence": "sourced"}, "hours_profile": "office_hours", "hourly_presence": [0, 0, 0, 0, 0, 0, 0, 0.3, 0.8, 1, 1, 1, 0.7, 1, 1, 1, 0.6, 0.2, 0, 0, 0, 0, 0, 0], "hourly_presence_note": "Patients and staff relative to capacity on a weekday, indicative and not sourced. Råslätt (PTS): about 100-150 visits per day for 10 700 listed patients. Some clinics have evening or weekend drop-in hours."}, "spaces": [{"id": "pc_entrances", "label_en": "Entrances: main, infection (separate flow), ambulance, staff/goods", "label_sv": "Entréer: huvudentré, infektionsentré, ambulansentré, personal-/godsentré", "required": {"strength": "programme", "basis": "PTS konceptprogram 2022 p. 16: infection entrance with a flow separate from the rest, ambulance entrance next to the acute room. BOV 2025 p. 128: consider a separate entrance from outside to examination rooms. BFS 2024:12 2 kap. 1 § (law): accessible main entrance.", "url": "https://www.ptsforum.se/media/3522/konceptprogram-primaervaard-220520.pdf"}, "size": {"rule": "per_building", "value_m2": null, "strength": "none", "source": "no m² given", "confidence": "verified"}, "constraints": {"facade_required": true, "ground_level_access": true}, "binding_constraint": "ground_floor_frontage", "layer": "site"}, {"id": "pc_reception_backoffice", "label_en": "Reception with back office", "label_sv": "Reception med backoffice", "required": {"strength": "programme", "basis": "PTS p. 16 and 19: overview of entrance and waiting room, back office directly behind for retreat, acoustic privacy. BFS 2024:12 3 kap. 6 § (law): hearing loop in receptions.", "url": "https://www.ptsforum.se/media/3522/konceptprogram-primaervaard-220520.pdf"}, "size": {"rule": "per_building", "value_m2": null, "strength": "none", "source": "no m² given", "confidence": "verified"}, "layer": "space_plan"}, {"id": "pc_waiting", "label_en": "Waiting room(s), incl. children's, lab and rehab waiting", "label_sv": "Väntrum (allmänt, barn, lab, BVC/BMM, rehab)", "required": {"strength": "practice", "basis": "BOV 2025 p. 128: waiting rooms sized to the activity and planned to minimise infection spread; more than one waiting room helps separate patient groups. PTS p. 16: distance between patients per infection-control advice, drop-in separated, separate waiting for BVC, BMM and rehab.", "url": "https://www.regiondalarna.se/contentassets/0094a97d15394247bf70887bbce88169/byggnation-och-vardhygien-bov-2025-06-24.pdf"}, "size": {"rule": "per_building", "value_m2": null, "strength": "none", "source": "No m² or seats-per-visit figure found. Höllviken filial (PTS bilaga 2): 8 seats plus 4 in the corridor for 1600 listed patients.", "confidence": "verified"}, "constraints": {"daylight_required": true}, "layer": "space_plan"}, {"id": "pc_consulting_room_general", "label_en": "Consulting / examination room, general", "label_sv": "Mottagningsrum allmän (undersökning, behandling, samtal)", "required": {"strength": "law", "basis": "HSL 5 kap. 2 § (premises needed for good care). Function and size per PTS.", "url": "https://lagen.nu/2017:30"}, "size": {"rule": "derived", "value_m2": 14, "range_m2": [12, 16], "count": "visits per day / (target visits per room per day); see PTS bilaga 1", "strength": "programme", "source": "PTS/CVA Konceptprogram lokaler för primärvård 2022 p. 15 and 17: 'Mottagningsrum allmän (12-16 m2)' from PTS typrum. The most common consulting-room areas in regional typrum are 12-16 m², with recommendations up to 20 and 24 m². Contents: wash basin, couch, visitor chair, small documentation place.", "url": "https://www.ptsforum.se/media/3522/konceptprogram-primaervaard-220520.pdf", "confidence": "verified"}, "constraints": {"daylight_required": true, "facade_required": false, "hand_wash_basin": true}, "binding_constraint": "water_and_drainage_to_every_room", "layer": "space_plan", "notes": "PTS recommends generic, interchangeable rooms (multirum) usable as consulting, conversation or admin rooms. Whether daylight is legally required in consulting rooms is in cross_cutting.json daylight_premises."}, {"id": "pc_consulting_room_special", "label_en": "Consulting rooms, specialised (acute, minor surgery, gyn, ear/eye, triage, BVC, DSK)", "label_sv": "Mottagningsrum akut, enklare operationer, gyn/rektoskopi, ögon/öron, triage, BVC, DSK", "required": {"strength": "programme", "basis": "PTS p. 17. Which rooms are needed depends on the clinic's mission. Gyn needs an adjoining RWC. Minor-surgery rooms follow BOV p. 128 (hygiene class 3 standard for minimal invasive surgery).", "url": "https://www.ptsforum.se/media/3522/konceptprogram-primaervaard-220520.pdf"}, "size": {"rule": "per_unit", "value_m2": 18, "range_m2": [12, 20], "count": "by mission", "strength": "programme", "source": "PTS 2022 p. 17: acute, minor operations, gyn, BVC, DSK 16-20 m²; ear/eye and triage 12-20 m².", "confidence": "verified"}, "layer": "space_plan"}, {"id": "pc_infection_room", "label_en": "Infection consulting room with anteroom, own entrance and RWC", "label_sv": "Mottagningsrum infektion med förrum och RWC", "required": {"strength": "programme", "basis": "PTS p. 17-18: direct entrance from outside or from the infection entrance; staff enter via an anteroom; toilet directly adjoining. BOV p. 128: for high-risk airborne infection (only for children's and infection clinics), isolation room with airlock and separate outdoor entrance.", "url": "https://www.ptsforum.se/media/3522/konceptprogram-primaervaard-220520.pdf"}, "size": {"rule": "per_building", "value_m2": null, "strength": "none", "source": "no m² given", "c er acute room near ambulance access if far from a hospital (PTS p. 20)."}], "conversion_from_office": {"typical_blockers": ["A wash basin in every consulting room and drainage for disinfection room, lab and sluice: many new drainage points in an office slab.", "Infection entrance and infection room need a ground-floor facade with direct outdoor access and pressure-controlled ventilation.", "Consulting-room ventilation recommendations in BOV table 2 (not read in detail) may exceed what office systems deliver.", "More than 150 persons at the same time moves the class to 2B, with alarm and egress consequences."], "typical_enablers": ["Office floor plates and cellular-office grids map directly onto 12-16 m² consulting rooms and admin rooms.", "Ground floor with a street entrance plus an upper floor for admin. Lifts exist.", "Fire class 2A/1 is close to office class 1, with no sprinkler requirement unlike 5B/5C."]}, "sources": [{"ref": "PTS forum / Chalmers CVA, Konceptprogram – Lokaler för primärvård med fokus på vård- och hälsocentraler (2022-05-20)", "url": "https://www.ptsforum.se/media/3522/konceptprogram-primaervaard-220520.pdf", "accessed": "2026-10-19"}, {"ref": "PTS forum, Förstudie till konceptprogram lokaler för primärvård (2022-05-20) (search snippet only)", "url": "https://www.ptsforum.se/media/3523/foerstudie-primaervaard-220520.pdf", "accessed": "2026-10-19"}, {"ref": "Svensk Förening för Vårdhygien, Byggnation och vårdhygien (BOV) 2025-06-24, s. 77, 127-129", "url": "https://www.regiondalarna.se/contentassets/0094a97d15394247bf70887bbce88169/byggnation-och-vardhygien-bov-2025-06-24.pdf", "accessed": "2026-10-19"}, {"ref": "Hälso- och sjukvårdslag (2017:30)", "url": "https://lagen.nu/2017:30", "accessed": "2026-10-19"}, {"ref": "BFS 2024:7 brandskydd, 2 kap. 10-12, 20 §§", "url": "https://rinfo.boverket.se/BFS2024-7/pdf/BFS2024-7.pdf", "accessed": "2026-10-19"}, {"ref": "Boverket PBL kunskapsbanken: Verksamhetsklasser", "url": "https://www.boverket.se/sv/P safety viewpoint (8 kap. 16 §). Kitchen, food and seat requirements abolished from 2026-06-01.", "Municipal VA: grease separator installation and notification per local rules.", "Outdoor seating on public land: police permit (ordningslagen) — not verified here."], "operator_oversight": "Kommunal livsmedelskontroll; kommunal alkoholhandläggning (tillstånd); räddningstjänsten; byggnadsnämnd; VA-huvudman; Arbetsmiljöverket", "cross_cutting_refs": ["cou_bygglov_trigger", "cou_anmalan", "fire_vk_2abc", "fire_egress_dimensions", "occ_density_law_2024", "occ_density_bbr_table_5333", "access_public_premises_wc", "access_hin", "san_public", "staff_personalutrymmen_general", "staff_changing_showers_storage", "staff_eating_rest", "vent_workplace", "loads_imposed_table_4_1"]}, "occupancy": {"unit": "seat", "gross_m2_per_unit": {"value": null, "range": null, "strength": "none", "source": "No Swedish public source found for m2 per restaurant seat (dining or gross). Old BBR general advice (table 5:333, repealed) used number of seats or 1.0 person/m2 net for restaurants as egress design load — not a space standard.", "confidence": "verified"}, "staff_per_unit": {"value": null, "strength": "none", "source": "No public source found."}, "egress_design_density": {"persons_per_m2": null, "strength": "law", "source": "BFS 2024:7 2 kap. 4 §: design number = maximum expected persons (furnished seats + standing + staff). Default densities exist only for affärslokal 0.5, pub/bar 3.0 and samlingslokal 2.5 persons/m2; restaurants are not listed. Old BBR advice: seats or 1.0/m2 (cross_cutting.json occ_density_bbr_table_5333, practice for new applications). A bar-type café would fall under pub/bar 3.0/m2.", "url": "https://rinfo.boverket.se/BFS2024-7/pdf/BFS2024-7.pdf", "confidence": "verified"}, "hours_profile": "evening_weekend", "hourly_presence": [0, 0, 0, 0, 0, 0, 0, 0, 0.02, 0.05, 0.1, 0.5, 0.9, 0.6, 0.2, 0.1, 0.15, 0.4, 0.8, 0.9, 0.7, 0.4, 0.15, 0.05], "hourly_presence_note": "Modelling assumption (indicative, not sourced): full-service restaurant with lunch peak 12 and dinner peak 18–20; share of seats occupied. Café variant: see variants."}, "spaces": [{"id": "rest_dining", "label_en": "Dining room / serving area", "label_sv": "Matsal / serveringsutrymme", "required": {"strength": "practice", "basis": "Defining space. No national seat or size requirement (alcohol-licence seat requirement abolished 2026-06-01). If alcohol is served the licensed area must be defined (Alkohollag 8 kap. 14 §).", "url": "https://www.riksdagen.se/sv/dokument-och-lagar/dokument/svensk-forfattningssamling/alkohollag-20101622_sfs-2010-1622/"}, "size": {"rule": "per_seat", "value_m2": null, "range_m2": null, "count": "seats", "strength": "none", "source": "No Swedish public source for m2 per seat.", "url": "", "confidence": "verified"}, "constraints": {"min_ceiling_height_mm": null, "daylight_required": false, "facade_required": true}, "depends_on": ["rest_kitchen", "rest_guest_wc"], "shareable_with": ["food_hall", "coworking", "office"], "shareable_note": "Lunch restaurant can double as staff eating place for office tenants (AFS 2023:12 3 kap. 60 § allmänna råd names restaurants as suitable eating places); evening events.", "binding_constraint": "egress", "layer": "space_plan", "notes": ">150 persons → 2B: fire alarm, evacuation alarm, emergency lighting, two exits with the alternative exit leading to the main entrance or equivalent; with alcohol beyond limited extent → 2C with 15 m travel distance (cross_cutting.json fire_vk_2abc). In 2A a single exit is acceptable only for ≤30 persons with a door to safe place (BFS 2024:7 7 kap. 11 §). Facade_required reflects practice (street visibility), not law. Guest ventilation: no national l/s per guest found for restaurants (staff: AFS 2023:12 5 kap. 4 §)."}, {"id": "rest_kitchen", "label_en": "Kitchen (storkök or simple preparation)", "label_sv": "Kök (storkök eller enkel beredning)", "required": {"strength": "law", "basis": "Food preparation rooms must meet EU 852/2004 Annex II ch. II (design and layout permitting good hygiene, protection against contamination; facilities for cleaning/disinfecting tools; food-washing facilities where necessary) and ch. I (ventilation, drainage, lighting). Fire: storkök surfaces B-s1,d0 ceiling / C-s2,d0 wall (BFS 2024:7 5 kap. 17 §); storkök with particular fire risk = own fire cell unless an automatic extinguishing system limits the risk (5 kap. 26 §).", "url": "https://rinfo.boverket.se/BFS2024-7/pdf/BFS2024-7.pdf"}, "size": {"rule": "per_seat", "value_m2": null, "range_m2": null, "count": "", "strength": "none", "source": "No Swedish public source for kitchen m2 per seat; 852/2004 is functional.", "url": "", "confidence": "verified"}, "constraints": {"min_ceiling_height_mm": null, "daylight_required": false, "facade_required": false}, "depends_on": ["rest_exhaust", "rest_grease_separator", "rest_handwash", "rest_goods_in"], "shareable_with": ["food_hall"], "shareable_note": "Commissary/ghost-kitchen use outside service hours.", "binding_constraint": "exhaust_shaft_and_drainage", "layer": "services", "notes": "Kitchen staff are at permanent workplaces: daylight/view per AFS 2023:12 5 kap. 25 § or compensating measures (cross_cutting.json staff_room_height_daylight). Floor drains not a food-law requirement (kontrollwiki art. 343) but standard in cooking kitchens; BFS 2024:8 7 kap. 7–11 §§ require watertight layers and floor drains where floors are often exposed to water."}, {"id": "rest_exhaust", "label_en": "Kitchen exhaust duct (imkanal) and outlet", "label_sv": "Imkanal och avluft", "required": {"strength": "law", "basis": "BFS 2024:7 4 kap. 23 §: imkanaler serving storkök at least EI 60 in byggnadsklass 1, EI 30 in byggnadsklass 2–3 (non-insulated parts allowed inside the served room with 0.10 m clearance, outdoors with 0.5 m); 24 §: storkök ducts with large combustible deposits need assured fire resistance inside the duct unless a deposit-limiting system is fitted; 5 kap. 20 §: imkanaler and hoods in storkök of non-combustible material; 4 kap. 22 §: household-type cooking (café) EI 15 or E 15. BFS 2024:8 9 kap. 1 §: exhaust outlets placed so pollutants/odours are not drawn back and no nuisance arises in the surroundings.", "url": "https://rinfo.boverket.se/BFS2024-7/pdf/BFS2024-7.pdf"}, "size": {"rule": "derived", "value_m2": null, "range_m2": null, "count": "vertical shaft through all floors above, plus fan space", "strength": "none", "source": "No size in regulation.", "url": "", "confidence": "verified"}, "constraints": {"min_ceiling_height_mm": null, "daylight_required": false, "facade_required": false}, "depends_on": [], "shareable_with": [], "shareable_note": "", "binding_constraint": "vertical_shaft_to_roof", "layer": "services", "notes": "Outlet above roof is the usual way to meet BFS 2024:8 9 kap. 1 § and avoid odour nuisance (miljöbalken tillsyn); Danish municipal rules (e.g. Gentofte, Copenhagen) explicitly require outlet above the ridge — no equivalent Swedish national rule found, so 'via roof' is practice. Typically the single most decisive feature of an office building for a full restaurant."}, {"id": "rest_grease_separator", "label_en": "Grease separator", "label_sv": "Fettavskiljare", "required": {"strength": "programme", "basis": "Municipal VA rules. MittSverige Vatten & Avfall (Sundsvall): restaurants, cafés, bakeries, staff canteens etc. must have a grease separator meeting SS-EN 1825-1/-2, reported to the VA utility; exemption possible for small/packaged-only businesses. Kristinehamn similarly lists cafés and restaurants. BFS 2024:8 8 kap. 15 §: WC wastewater may not be connected to grease separators.", "url": "https://msva.se/vatten-och-avlopp/verksamheter/riktlinjer-for-verksamheter/riktlinjer-for-verksamheter-i-sundsvall/restaurang-och-storkok"}, "size": {"rule": "derived", "value_m2": null, "range_m2": null, "count": "sized per SS-EN 1825-2", "strength": "none", "source": "", "url": "", d": false, "facade_required": false}, "depends_on": ["rest_goods_in"], "shareable_with": ["food_hall"], "shareable_note": "", "binding_constraint": "floor_load", "layer": "space_plan", "notes": ""}, {"id": "rest_handwash", "label_en": "Hand-wash basins", "label_sv": "Handtvättställ", "required": {"strength": "law", "basis": "EU 852/2004 Annex II ch. I p. 4 (adequate number, suitably located, hot and cold water, hygienic drying); kontrollwiki art. 1045 (separate from food-rinsing where necessary; must not be blocked by food/dishes).", "url": "https://kontrollwiki.livsmedelsverket.se/artikel/1045"}, "size": {"rule": "derived", "value_m2": null, "range_m2": null, "count": "in kitchen near each food-handling station and at staff WCs", "strength": "none", "source": "'Tillräckligt antal' — no number.", "url": "https://kontrollwiki.livsmedelsverket.se/artikel/1045", "confidence": "verified"}, "constraints": {"min_ceiling_height_mm": null, "daylight_required": false, "facade_required": false}, "depends_on": [], "shareable_with": [], "shareable_note": "", "binding_constraint": "plumbing_shafts", "layer": "services", "notes": ""}, {"id": "rest_staff_wc_changing", "label_en": "Staff WC, changing room and shower", "label_sv": "Personaltoalett, omklädningsrum och dusch", "required": {"strength": "law", "basis": "EU 852/2004 Annex II ch. I p. 3 (lavatories not opening directly into food-handling rooms) and p. 9 (changing facilities where necessary); AFS 2023:12 3 kap. 46 § changing room when special work clothes are worn, 48 § normally separate for men/women if used simultaneously, 51 § shower normally if work is sweaty or dirty. Kontrollwiki art. 1045: food-law WC requirement concerns staff WCs; an antechamber may be needed if the WC is close to unprotected food.", "url": "https://kontrollwiki.livsmedelsverket.se/artikel/1045"}, "size": {"rule": "per_unit", "value_m2": 4.84, "range_m2": null, "count": "1 WC per started 15 employees (AFS allmänna råd to 3 kap. 56 §)", "strength": not require a cooled waste room only because of odour.", "url": "https://kontrollwiki.livsmedelsverket.se/artikel/343", "confidence": "verified"}, "constraints": {"min_ceiling_height_mm": null, "daylight_required": false, "facade_required": false}, "depends_on": [], "shareable_with": ["food_hall", "grocery_store"], "shareable_note": "", "binding_constraint": "site_access", "layer": "site", "notes": ""}], "variants": [{"id": "rest_full_kitchen", "label": "Restaurant with full cooking kitchen (storkök)", "changes": "Imkanal EI 60 (Br1) / EI 30 (Br2–3) to outlet, non-combustible hood/duct, deposit control (BFS 2024:7 4 kap. 23–24 §§, 5 kap. 20 §); own fire cell if particular fire risk unless automatic extinguishing (5 kap. 26 §); grease separator; floor drains; changing rooms and showers for kitchen staff."}, {"id": "rest_cafe_simple", "label": "Café with simple preparation", "changes": "Household-type cooking only: imkanal EI 15 or E 15 (BFS 2024:7 4 kap. 22 §); no storkök fire cell; grease separator still often required by municipal VA rules (MSVA lists cafés); hours closer to retail (≈7–18, peaks 8, 12, 15); hourly_presence e.g. [0,0,0,0,0,0,0,0.3,0.6,0.4,0.4,0.6,0.9,0.6,0.4,0.6,0.4,0.2,0.05,0,0,0,0,0] (indicative)."}, {"id": "rest_bar_2c", "label": "Bar / nightclub >150 persons with alcohol (2C)", "changes": "15 m travel distance, spoken evacuation alarm, pub/bar default 3 persons/m2 (cross_cutting.json); serveringstillstånd; no kitchen needed since 2026-06-01."}], "conversion_from_office": {"typical_blockers": ["No vertical shaft route for a fire-rated kitchen exhaust to roof through upper floors (often other tenants).", "No kitchen drainage/grease-separator route and floor drains in office slabs; suction-truck access for emptying.", "Detaljplan K or old H may exclude restaurants; needs C or plan change.", "Change from vk 1 to 2A/2B/2C: 30 m (15 m) travel, exit count not relaxable for 2B/2C at change of use (cross_cutting.json fire_change_of_use_floor).", "Odour and noise nuisance to office or residential neighbours (fans, deliveries, late hours)."], "typical_enablers": ["Ground floor with street frontage and existing shafts.", "Café variant with simple preparation avoids most kitchen exhaust and fire-cell demands.", "Office tenants above provide lunch demand."]}, "sources": [{"ref": "EU 852/2004 bilaga II kap. I p. 3, 4, 5, 8, 9; kap. II p. 1–2; kap. VI p. 1–4 (read via legislation.gov.uk copy of original text)", "url": "https://www.legislation.gov.uk/eur/2004/852/annex/II", "accessed": "2026-10-19"}, {"ref": "Livsmedelsverket kontrollwiki — Toaletter och handfat (art. 1045); Lokaler och utrustning (art. 343)", "url": "https://kontrollwiki.livsmedelsverket.se/artikel/1045", "accessed": "2026-10-19"}, {"ref": "LIVSFS 2022:8 — 2, 6, 9 §§", "url": "https://www.livsmedelsverket.se/globalassets/om-oss/lagstiftning/offentlig-kontroll/livsfs-2022-8_web_t.pdf", "accessed": "2026-10-19"}, {"ref": "BFS 2024:7 — 2 kap. 4, 11–13 §§; 4 kap. 22–24 §§; 5 kap. 17, 20, 26, 38 §§; 7 kap. 11 §", "url": "https://rinfo.boverket.se/BFS2024-7/pdf/BFS2024-7.pdf", "accessed": "2026-10-19"}, {"ref": "BFS 2024:8 — 7 kap. 7–11 §§, 8 kap. 15 §, 9 kap. 1 §, 11 kap. 1–3 §§", "url": "https://rinfo.boverket.se/BFS2024-8/pdf/BFS2024-8.pdf", "accessed": "2026-10-19"}, {"ref": "Alkohollag (2010:1622) as amended to SFS 2026:511 — 8 kap. 14–17 §§", "url": "https://www.riksdagen.se/sv/dokument-och-lagar/dokument/svensk-forfattningssamling/alkohollag-20101622_sfs-2010-1622/", "accessed": "2026-10-19"}, {"ref": "Köping kommun — Serveringstillstånd (matkravet slopas 2026-06-01)", "url": "https://koping.se/foretagare--naringsliv/upphandling-tillstand-och-tillsyn/tillstand-regler-och-tillsyn/serveringstillstand-och-gardsforsaljning.html", "accessed": "2026-10-19"}, {"ref": "MittSverige Vatten & Avfall — Restaurang och storkök (fettavskiljare)", "url": "https://msva.se/vatten-och-avlopp/verksamheter/riktlinjer-for-verksamheter/riktlinjer-for-verksamheter-i-sundsvall/r l)", "family": "commercial", "summary": "Non-food retail unit, typically in a ground floor with street frontage. It is a publik lokal (BFS 2024:12) and a butiksutrymme in verksamhetsklass 2A (≤150 persons) or 2B (>150 persons). The default design occupancy for an affärslokal is 0.5 persons/m2 (BFS 2024:7 2 kap. 4 §), which drives exits: a 2A unit may have a single exit only if it serves at most 30 persons — about 60 m2 of shop floor at the default density. Staff facilities follow AFS 2023:12; customer WCs are not required by national law.", "regulatory": {"bbr_verksamhetsklass": "2A for ≤150 persons, 2B for >150 persons — BFS 2024:7 2 kap. 11–12 §§ name 'butiksutrymmen'. Back-of-house staff/stock rooms can be vk1.", "key_laws": [{"ref": "BFS 2024:7 brandskydd", "url": "https://rinfo.boverket.se/BFS2024-7/pdf/BFS2024-7.pdf"}, {"ref": "BFS 2024:12 tillgänglighet (new build/ändring)", "url": "https://rinfo.boverket.se/BFS2024-12/pdf/BFS2024-12.pdf"}, {"ref": "BFS 2011:13 as amended by BFS 2013:9 (HIN) — enkelt avhjälpta hinder in existing publika lokaler", "url": "https://rinfo.boverket.se/BFS2011-13/pdf/BFS2013-9.pdf"}, {"ref": "AFS 2023:12 Utformning av arbetsplatser", "url": "https://www.av.se/globalassets/filer/publikationer/foreskrifter/utformning-av-arbetsplatser-afs2023-12.pdf"}, {"ref": "BFS 2024:8 hygien, hälsa och miljö (waste, daylight in lokaler)", "url": "https://rinfo.boverket.se/BFS2024-8/pdf/BFS2024-8.pdf"}], "permits": ["Bygglov for change of use from office (PBL 9 kap. 15 § 1 since 2025-12-01, formerly 9 kap. 2 § 3 a — cross_cutting.json cou_bygglov_trigger), and detaljplan must allow Detaljhandel (H) or Centrum (C); Kontor (K) does not normally cover retail — Boverket PBL kunskapsbanken, användning 'Detaljhandel' and 'Centrum'.", "Bygglov for façade changes (shop windows, entrances, signs) per PBL 9 kap. and local rules.", "Anmälan (PBF 6 kap. 1 §) for fire-safety, ventilation and load-bearing changes."], "operator_oversight": "Kommunens byggnadsnämnd; räddningstjänsten (LSO tillsyn); Arbetsmiljöverket", "cross_cutting_refs": ["cou_bygglov_trigger", "cou_anmalan", "fire_vk_2abc", "fire_egress_dimensions", "occ_density_law_2024", "access_public_premises_wc", "access_hin", "san_public", "staff_personalutrymmen_general", "loads_imposed_table_4_1"]}, "occupancy": {"unit": "visitor", "gross_m2_per_unit": {"value": 2.0, "range": null, "strength": "law", "source": "BFS 2024:7 2 kap. 4 § p. 1: affärslokal 0.5 persons/m2 when the maximum number of persons is not known (i.e. 2 m2 per person). This is a fire/egress design density for the customer area, not a typical trading density.", "confidence": "verified"}, "staff_per_unit": {"value": null, "strength": "none", "source": "No regulatory or public Swedish source found for staff per m2 in small retail."}, "egress_design_density": {"persons_per_m2": 0.5, "strength": "law", "source": "BFS 2024:7 2 kap. 4 § p. 1 (affärslokal). Consequences: 7 kap. 11 § p. 1 — single exit in 2A only if the exit leads to a safe place and serves ≤30 persons (≈60 m2 at 0.5 p/m2); 7 kap. 9 § p. 6 — otherwise two exits up to 600 persons; 7 kap. 19 § — max 30 m to an exit in 2A/2B; 7 kap. 29 § — door free width ≥1.00 m per 150 persons.", "url": "https://rinfo.boverket.se/BFS2024-7/pdf/BFS2024-7.pdf", "confidence": "verified"}, "hours_profile": "retail_hours", "hourly_presence": [0, 0, 0, 0, 0, 0, 0, 0, 0.05, 0.1, 0.3, 0.4, 0.55, 0.5, 0.45, 0.5, 0.6, 0.7, 0.55, 0.25, 0.05, 0, 0, 0], "hourly_presence_note": "Modelling assumption (indicative, not sourced). Share of egress capacity present on a weekday, opening ~10–19/20; Saturdays typically peak midday. Sweden has no statutory shop hours."}, "spaces": [{"id": "retail_sales_floor", "label_en": "Sales floor", "label_sv": "Butiksyta / säljyta", "required": {"strength": "practice", "basis": "Defining space of the use; its size is a business decision. Must meet fire (BFS 2024:7) and accessibility rules.", "url": "https://rinfo.boverket.se/BFS2024-7/pdf/BFS2024-7.pdf"}, "size": {"rule": "per_building", "value_m2": null, "range_m2": null, "count": "", "strength": "none", "source": "No regulated size.", "url": "", "confidence": "verified"}, "constraints": {"min_ceiling_height_mm": 2400, "daylight_required": false, "facade_required": true}, "depends_on": ["retail_entrance"], "shareable_with": ["food_hall", "coworking"], "shareable_note": "Pop-up and evening events in the shop space.", "binding_constraint": "egress", "layer": "space_plan", "notes": "Ceiling height: AFS 2023:12 3 kap. 5 § allmänna råd 2.40 m for workplaces. Daylight/view: AFS 2023:12 5 kap. 25 § applies to staff workplaces but allows compensation where the nature of the activity makes daylight impossible; BFS 2024:8 4 kap. 3 § exempts where unreasonable given the room's use. Above ~60 m2 at default density two exits are normally needed (BFS 2024:7 7 kap. 9 §, 11 §); an exit may be in an adjacent business on the same floor (7 kap. 10 §). Fire alarm, evacuation alarm and emergency lighting only for 2B (7 kap. 40, 43, 46 §§); wayfinding markings for 2A and 2B (7 kap. 39 §)."}, {"id": "retail_entrance", "label_en": "Accessible street entrance / shop window", "label_sv": "Tillgänglig entré / skyltfönster", "required": {"strength": "law", "basis": "BFS 2024:12 2 kap. 1 § and 3 kap. 1 § — main entrances accessible and usable (new build/ändring); existing publika lokaler: enkelt avhjälpta hinder shall be removed (BFS 2011:13 / BFS 2013:9, HIN).", "url": "https://rinfo.boverket.se/BFS2024-12/pdf/BFS2024-12.pdf"}, "size": {"rule": "fixed", "value_m2": null, "range_m2": null, "count": "1", "strength": "none", "source": "Dimensions (door 0.80 m free passage, 1.50 m turning circle) appear in BFS 2024:7 2 kap. for frångänglighet and AFS 2023:12 3 kap. 4 § allmänna råd; no entrance area.", "url": "", "confidence": "verified"}, "constraints": {"min_ceiling_height_mm": null, "daylight_required": false, "facade_required": true}, "depends_on": [], "shareable_with": [], "shar
