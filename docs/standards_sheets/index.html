<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Standards sheets</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,600;12..96,700;12..96,800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  /* the explorer's look (explorer/web/src/index.css): cream paper, ink outlines, hard shadows, Marievik+ blue and coral */
  :root {
    --surface: #fffdf6; --sunken: #f2efe2; --line: #d8d3bf; --ink: #202020; --ink-2: #47443c; --muted: #6e6a5e;
    --accent: #0528ca; --coral: #fd876e; --edge: #202020;
    --sans: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif; --mono: "IBM Plex Mono", ui-monospace, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; scroll-padding-top: 16px; }
  body { margin: 0; background: var(--sunken); color: var(--ink); font-family: var(--sans); }
  .layout { display: grid; grid-template-columns: 17rem minmax(0, 1fr); gap: 20px; max-width: 1560px; margin: 0 auto; padding: 18px 20px 60px; }
  aside { position: sticky; top: 16px; align-self: start; max-height: calc(100vh - 32px); overflow-y: auto;
    background: var(--surface); border: 2px solid var(--edge); border-radius: 10px; box-shadow: 3px 3px 0 var(--edge); }
  .band { background: var(--accent); color: #fff; padding: 10px 14px 12px; border-bottom: 2px solid var(--edge); position: relative; }
  .band::after { content: ""; position: absolute; left: 0; right: 0; bottom: -2px; height: 6px;
    background: repeating-linear-gradient(90deg, var(--edge) 0 6px, transparent 6px 12px); }
  .band h1 { margin: 0; font-size: 17px; font-weight: 700; }
  .band p { margin: 3px 0 0; font: 500 10.5px/1.4 var(--mono); letter-spacing: .06em; text-transform: uppercase; opacity: .85; }
  .search { margin: 12px 12px 4px; }
  .search input { width: 100%; font: 13px var(--sans); padding: 6px 9px; border: 2px solid var(--edge); border-radius: 6px; background: var(--surface); }
  .group { padding: 6px 12px 10px; }
  .group h2 { margin: 10px 0 6px; font: 600 10.5px var(--mono); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
  .group a { display: flex; gap: 8px; align-items: baseline; padding: 4px 7px; border-radius: 6px; color: var(--ink); text-decoration: none; font-size: 13px; line-height: 1.3; }
  .group a b { font: 600 11px var(--mono); color: var(--accent); min-width: 1.6em; }
  .group a:hover { background: var(--sunken); }
  .group a.on { background: var(--coral); box-shadow: 2px 2px 0 var(--edge); outline: 1.5px solid var(--edge); }
  .group a.on b { color: var(--ink); }
  main { min-width: 0; }
  .sheet { background: var(--surface); border: 2px solid var(--edge); border-radius: 10px; box-shadow: 3px 3px 0 var(--edge); margin-bottom: 22px; overflow: hidden; }
  .sheet header { display: flex; align-items: center; gap: 10px; padding: 8px 14px; border-bottom: 2px solid var(--edge); background: var(--coral); }
  .sheet header .no { font: 700 12px var(--mono); background: var(--surface); border: 2px solid var(--edge); border-radius: 5px; padding: 1px 6px; }
  .sheet header h3 { margin: 0; font: 600 12px var(--mono); letter-spacing: .1em; text-transform: uppercase; }
  .sheet header a { margin-left: auto; font: 500 11px var(--mono); color: var(--ink); }
  .art { min-height: 400px; display: grid; place-items: center; }
  .art svg { display: block; width: 100%; height: auto; }
  .art .wait { font: 12px var(--mono); color: var(--muted); }
  .hidden { display: none; }
  @media (max-width: 860px) {
    .layout { grid-template-columns: 1fr; padding: 12px 16px 40px; }
    aside { position: static; max-height: none; }
  }
</style>
</head>
<body>
<div class="layout">
  <aside>
    <div class="band"><h1>Standards sheets</h1><p>Marievik+ · dimensioned from the catalogue</p></div>
    <div class="search"><input id="q" type="search" placeholder="Find a sheet…" aria-label="Find a sheet"></div>
    <nav id="nav"></nav>
  </aside>
  <main id="sheets"></main>
</div>
<script>
  // the sheets drawn by docs/draw_standards_sheets.py; inlined (not <img>) so they're drawn in the page's fonts
  const SHEETS = [
    ['01_wheelchair_dimensioning', 'Wheelchair dimensioning'], ['02_accessible_wc', 'Accessible WC'], ['03_escape_routes', 'Escape routes'],
    ['04_ramps_lifts_door_openers', 'Ramps, lifts & door openers'], ['05_care_apartment', 'Care apartment'], ['06_bicycle_parking', 'Bicycle parking'],
    ['07_waste_room', 'Waste room'], ['08_refuse_vehicle_access', 'Refuse vehicle access'], ['09_marievik_shell_section', 'Marievik shell section'],
    ['10_imposed_floor_loads', 'Imposed floor loads'],
    ['11_use_elderly_care_home', 'Elderly care home'], ['12_use_lss_group_home', 'LSS group home'], ['13_use_grocery_store', 'Grocery store'],
    ['14_use_gym_fitness', 'Gym & fitness'], ['15_use_retail_shop', 'Retail shop'], ['16_use_assembly_event', 'Assembly & events'],
    ['17_use_community_hybrid', 'Community hybrid'], ['18_use_culture_makerspace', 'Culture & makerspace'], ['19_use_library', 'Library'],
    ['20_use_shared_amenities', 'Shared amenities'], ['21_use_sports_hall', 'Sports hall'], ['22_use_preschool', 'Preschool'],
    ['23_use_school_compulsory', 'Compulsory school'], ['24_use_school_upper_secondary', 'Upper secondary school'],
    ['25_use_primary_care_clinic', 'Primary care clinic'], ['26_use_food_hall', 'Food hall'], ['27_use_hotel', 'Hotel'],
    ['28_use_restaurant_cafe', 'Restaurant & café'], ['29_use_co_living', 'Co-living'], ['30_use_housing_apartment', 'Apartments'],
    ['31_use_senior_housing', 'Senior housing'], ['32_use_student_housing', 'Student housing'], ['33_use_coworking', 'Coworking'],
    ['34_use_office', 'Office'],
  ]
  const nav = document.getElementById('nav'), main = document.getElementById('sheets')
  const groups = [['Building standards', SHEETS.filter(([id]) => !id.includes('_use_'))], ['Uses', SHEETS.filter(([id]) => id.includes('_use_'))]]
  for (const [title, list] of groups) {
    const g = document.createElement('div'); g.className = 'group'
    g.innerHTML = `<h2>${title}</h2>` + list.map(([id, name]) => `<a href="#${id}" data-id="${id}"><b>${id.slice(0, 2)}</b>${name}</a>`).join('')
    nav.appendChild(g)
  }
  for (const [id, name] of SHEETS) {
    const s = document.createElement('section'); s.className = 'sheet'; s.id = id
    s.innerHTML = `<header><span class="no">${id.slice(0, 2)}</span><h3>${name}</h3><a href="${id}.svg" target="_blank" rel="noopener">open SVG ↗</a></header><div class="art"><span class="wait">Drawing…</span></div>`
    main.appendChild(s)
  }
  // load each sheet as it comes near the screen
  const load = (s) => {
    if (s.dataset.loaded) return s.loading; s.dataset.loaded = '1'
    return (s.loading = fetch(`${s.id}.svg`).then((r) => r.text()).then((t) => { s.querySelector('.art').innerHTML = t })
      .catch(() => { s.querySelector('.art').innerHTML = `<img src="${s.id}.svg" alt="" style="width:100%">` }))
  }
  const io = new IntersectionObserver((es) => es.forEach((e) => e.isIntersecting && load(e.target)), { rootMargin: '800px 0px' })
  // a link to one sheet (#28_use_restaurant_cafe): draw it and every sheet above it first, so it stays put once there
  const goTo = (id) => {
    const all = [...document.querySelectorAll('.sheet')], i = all.findIndex((s) => s.id === id)
    if (i < 0) return
    Promise.all(all.slice(0, i + 1).map(load)).then(() => all[i].scrollIntoView())
  }
  if (location.hash) goTo(decodeURIComponent(location.hash.slice(1)))
  document.querySelectorAll('.sheet').forEach((s) => io.observe(s))
  nav.addEventListener('click', (e) => {
    const a = e.target.closest('a'); if (!a) return
    e.preventDefault(); history.replaceState(null, '', `#${a.dataset.id}`); goTo(a.dataset.id)
  })
  // the sheet in view, marked in the list
  const links = [...nav.querySelectorAll('a')]
  const spy = new IntersectionObserver((es) => es.forEach((e) => {
    if (!e.isIntersecting) return
    links.forEach((a) => a.classList.toggle('on', a.dataset.id === e.target.id))
  }), { rootMargin: '-30% 0px -60% 0px' })
  document.querySelectorAll('.sheet').forEach((s) => spy.observe(s))
  // find
  document.getElementById('q').addEventListener('input', (e) => {
    const q = e.target.value.trim().toLowerCase()
    for (const [id, name] of SHEETS) {
      const hit = !q || name.toLowerCase().includes(q) || id.includes(q)
      document.getElementById(id).classList.toggle('hidden', !hit)
      nav.querySelector(`a[data-id="${id}"]`).classList.toggle('hidden', !hit)
    }
  })
</script>
</body>
</html>
